@media (orientation: landscape) and (min-width: 900px) {
  .bk-view { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage" "panel"; width: min(1320px, 100%, calc((100dvh - 320px) * 1.528 + 26px)); min-width: min(860px, 100%); }
  .bk-stage { background: #120e0b; }
  .bk-stage .bk-scene { max-height: calc(100dvh - 320px); }
  .bk-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 440px); column-gap: 18px; align-items: start; }
  .bk-panel > * { grid-column: 1; }
  .bk-panel > .bp-buy, .bk-panel > #btn-engineer, .bk-panel > .btn-seal { grid-column: 2; grid-row: 1 / span 4; align-self: center; margin-top: 0; }
  .bk-panel .bp-buy { grid-template-columns: 1fr 1fr; }
  .bk-panel:has(.bp-hint) { display: block; }
}
@media (orientation: landscape) and (min-width: 900px) and (max-height: 820px) {
  .bk-panel { padding: 6px 12px; }
  .bp-head { margin-bottom: 2px; }
  .bp-btn { min-height: 54px; }
}

/* Portrait: sticky footer + bottom sheet go dark */
@media (orientation: portrait), (max-width: 899px) {
  .hand { background: linear-gradient(180deg, rgba(4, 22, 18, 0), rgba(4, 22, 18, 0.92) 30%); }
  .desk.has-sel .dossier .dz { background: linear-gradient(180deg, #0e4238, #062a23); }
  .desk.has-sel::after { background: rgba(0, 0, 0, 0.45); }
  .desk { background-position: 0 0, 0 0, 30% 0, 0 0; background-size: auto, auto, auto 100vh, auto; background-attachment: scroll, scroll, fixed, scroll; }
}

/* ---------- Title, executive select, brochure pages ---------- */
#screen-title .title-sunny {
  background:
    linear-gradient(90deg, rgba(4, 22, 18, 0.85) 0%, rgba(4, 22, 18, 0.55) 40%, rgba(4, 22, 18, 0.25) 100%),
    url("assets/desk-penthouse.webp") center / cover no-repeat, #0a2a23;
  border: 1px solid var(--gold-line); box-shadow: var(--deco-shadow);
}
.title-sunny .kicker { color: var(--gold-hi); letter-spacing: 0.24em; }
.title-sunny h1.wordmark { font-family: var(--font-serif); letter-spacing: 0.06em; }
.title-sunny .tagline { color: #ffb39e; }
.title-sunny .demo-note, .demo-note { color: var(--ivory-muted); }
.link-btn { color: var(--gold-hi); }
.btn { background: rgba(4, 30, 25, 0.75); border: 1px solid var(--gold-line); color: var(--ivory); }
.btn-coral { background: linear-gradient(180deg, #ef7a62, var(--coral-deep)); border-color: rgba(255, 225, 170, 0.75); color: #fff; }
.btn-ochre { background: linear-gradient(180deg, #f0cf7a, #b8862c); border-color: #fff1c2; color: #1e1404; }
.btn-teal { background: linear-gradient(180deg, #19a585, #0b5e4e); border-color: var(--gold-line); color: #fff; }
.btn-ghost { background: transparent; border-color: rgba(212, 175, 55, 0.4); color: var(--ivory-muted); }
.btn-danger { background: rgba(4, 30, 25, 0.75); border-color: var(--coral); color: #ffb3a1; }
.seed-row input, .title-sunny .seed-row input { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--gold-line); color: var(--ivory); }
.field-label { color: var(--ivory-muted); }
.page, .title-page { background: linear-gradient(180deg, #0c3a31, #051f1a); border-color: var(--gold); color: var(--ivory); }
.page::before, .page::after { border-color: var(--gold); }
.page.play, .page.inner { background: linear-gradient(180deg, #0c3a31, #051f1a); background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 1.2px), linear-gradient(180deg, #0c3a31, #051f1a); background-size: 12px 12px, auto; }
h1, h2, h3 { color: var(--gold-hi); }
.kicker { color: var(--gold-hi); }
.muted { color: var(--ivory-muted); }
.inner-head h2 { font-family: var(--font-serif); }
.exec-card { background: var(--glass-deco); border: 1px solid var(--gold-line); color: var(--ivory); box-shadow: var(--deco-inset); }
.exec-card.on { border-color: var(--coral); box-shadow: inset 0 0 0 2px var(--coral), 0 0 22px rgba(224, 90, 72, 0.25); }
.exec-card .name { color: var(--ivory); }
.exec-card .firm { color: var(--gold-hi); }
.exec-card p { color: var(--ivory-muted); }
.dots i { background: rgba(212, 175, 55, 0.3); }
.page p, .page li { color: var(--ivory); }
.page .muted, .page .hint, .page .meta { color: var(--ivory-muted); }
.tutorial-page .btn-row { background: linear-gradient(180deg, rgba(5, 31, 26, 0), #051f1a 40%) !important; }
.upgrade, .readiness { background: rgba(0, 0, 0, 0.28); border-color: var(--gold-line); color: var(--ivory); }
.upgrade h3, .readiness h3 { color: var(--gold-hi); }
.upgrade .meta, .log { color: var(--ivory-muted); }
.readiness p, .readiness li { color: var(--ivory); }
.end-mark.win { color: var(--gold-hi); }
.end-mark.lose { color: #ff8a6a; }
.end-hero.diagram { background: #0a2a23; }
.history li { color: var(--ivory-muted); border-bottom-color: rgba(212, 175, 55, 0.25); }

/* =====================================================================
   v4: meta progression, map readability, rivals, hologram globe
   ===================================================================== */
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.map .region:focus, .map .pin:focus { outline: none; }
.map .region:focus-visible .rim { stroke: #fff6c8; stroke-width: 5; stroke-dasharray: none; }
.map .pin:focus-visible .ring { opacity: 1; stroke: #fff6c8; stroke-width: 5; }
.map .region { cursor: pointer; }
.map .region .rim { fill: none; stroke: none; pointer-events: none; }
.map .region.owned.s-tense .rim { stroke: #ffc24a; stroke-width: 4; }
.map .region.owned.s-strike .rim { stroke: #ff7a4a; stroke-width: 5; }
.map .region.owned.s-revolt .rim, .map .region.warn .rim { stroke: #ff3b2f; stroke-width: 6; animation: revoltpulse 1s ease-in-out infinite; }
@keyframes revoltpulse { 50% { stroke-opacity: 0.35; } }
.map .region.rival .top { fill: url(#mg-rival); stroke: #ece6ff; }
.map .region.rival.rv-1 .top { filter: hue-rotate(-40deg); }
.map .region.flash .top { animation: rflash 0.4s ease-in-out 4 alternate; }
@keyframes rflash { to { filter: brightness(1.8) drop-shadow(0 0 10px #fff6c8); } }
.map .spips rect { fill: rgba(4, 30, 25, 0.75); stroke: rgba(243, 217, 143, 0.7); stroke-width: 1.2; }
.map .spips rect.on { fill: #ffc24a; }
.map .spips.s-strike rect.on { fill: #ff7a4a; }
.map .spips.s-revolt rect.on { fill: #ff3b2f; }
.map .spips.s-calm rect.on { fill: #3fe0b8; }
.map .spips, .map .revolt-plate, .map .preview, .map .yield { pointer-events: none; }
.map .revolt-plate rect { fill: #8a1c14; stroke: #ffd2c4; stroke-width: 2; animation: revoltpulse 1s ease-in-out infinite; }
.map .revolt-plate text { fill: #fff; font: 700 18px var(--font-sans); letter-spacing: 0.1em; }
.map .pv-outline { fill: none; stroke: #fff6c8; stroke-width: 3; stroke-dasharray: 9 6; animation: dash 1s linear infinite; }
.map .pv-outline.claim { stroke: #3fe0b8; stroke-width: 4; }
.map .pv-outline.heat { stroke: #ff9a4a; }
.map .pv-outline.cool { stroke: #9ff5e4; }
@keyframes dash { to { stroke-dashoffset: -30; } }
.map .pv-pips rect.add { fill: #ff7a4a; stroke: #fff; stroke-width: 1.5; animation: revoltpulse 0.8s ease-in-out infinite; }
.map .pv-pips rect.rem { fill: none; stroke: #3fe0b8; stroke-width: 2.5; stroke-dasharray: 3 2; }
.map .pv-plate rect { fill: rgba(5, 34, 28, 0.95); stroke: var(--gold-hi); stroke-width: 1.5; }
.map .pv-plate text { fill: var(--ivory); font: 700 17px var(--font-sans); }
.map .pv-net { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 10; animation: dash 0.8s linear infinite; }
.map .pv-net.strain { stroke: #ffb02e; }
.map .pv-net.ease { stroke: #3fe0b8; }
.map .plant-node { cursor: pointer; pointer-events: all; }
.map .yield rect { fill: rgba(5, 34, 28, 0.92); stroke: var(--gold); stroke-width: 1.2; }
.map .yield text { fill: #ffd36a; font: 700 15px var(--font-sans); }
.map .yield.off text { fill: #ff9a7a; }
.map .route.g-strained { stroke: #ffb02e; stroke-opacity: 0.7; }
.map .route.g-disrupted { stroke: #ff3b2f; stroke-opacity: 0.8; animation: revoltpulse 0.7s steps(2) infinite; }
/* Lenses */
.map.lens-mood .region:not(.s-calm) .top { filter: saturate(1.3); }
.map.lens-mood .region.s-calm .top { opacity: 0.55; }
.map.lens-mood .spips { transform-box: fill-box; }
.map.lens-networks .lands, .map.lens-networks .props { opacity: 0.45; }
.map.lens-networks .route { stroke-width: 6; stroke-opacity: 0.95; }
.map.lens-holdings .region:not(.owned):not(.rival) .top { opacity: 0.4; }
.map.lens-holdings .spips, .map.lens-holdings .prop-hz { opacity: 0.25; }
.map:not(.lens-networks) .route.g-clear { stroke-opacity: 0.3; }
/* Collapse: oceans grey out, haze rises */
.map .sea { filter: saturate(calc(1 - var(--collapse) * 0.85)) brightness(calc(1 - var(--collapse) * 0.25)); }
.map .haze { pointer-events: none; mix-blend-mode: multiply; }
.board-slab.worsen { animation: worsen 0.9s ease-in-out; }
@keyframes worsen { 40% { filter: sepia(0.5) brightness(0.8); } }

/* Board tools */
.board { position: relative; }
.lens-bar, .net-strip { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 6px; z-index: 4; position: relative; }
.lens-btn, .net-chip { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--gold-line); background: rgba(4, 30, 25, 0.8); color: var(--ivory-muted); font: 600 14px var(--font-sans); }
.lens-btn.on { background: linear-gradient(180deg, #f0cf7a, #b8862c); color: #1e1404; }
.net-chip { display: inline-flex; gap: 6px; align-items: center; text-transform: capitalize; }
.net-chip i { font-style: normal; color: var(--gold-hi); }
.net-chip b { font-weight: 700; }
.net-chip.g-clear b { color: #3fe0b8; }
.net-chip.g-strained b { color: #ffb02e; }
.net-chip.g-disrupted { border-color: #ff3b2f; }
.net-chip.g-disrupted b { color: #ff6a5a; }
.net-chip.sel, .rv-row.sel { box-shadow: inset 0 0 0 2px var(--coral); }
.map-zoom { width: 100%; height: 100%; transform-origin: 0 0; touch-action: pan-y; }
.map-tip { position: absolute; z-index: 9; width: 220px; padding: 10px 12px; border-radius: 10px; background: rgba(5, 34, 28, 0.96); border: 1px solid var(--gold-line); color: var(--ivory); font-size: 14px; display: grid; gap: 3px; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.map-tip[hidden] { display: none; }
.map-tip b { color: var(--gold-hi); font-size: 16px; }
.map-tip .tip-warn { color: #ff8a7a; font-weight: 700; }
.map-tip .pips i { width: 10px; height: 8px; }
.skip-btn { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 12; min-height: 44px; padding: 0 28px; border-radius: 12px; background: linear-gradient(180deg, #0e4238, #062a23); border: 1px solid var(--gold-line); color: var(--gold-hi); font: 700 17px var(--font-sans); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
.float.rival { background: #6b5aa8; color: #fff; }
.float.big { font-size: 22px; padding: 10px 18px; }
.float { max-width: 340px; white-space: normal; text-align: center; }

/* Rail */
.rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.rq { position: relative; min-height: 54px; padding: 6px 6px 8px; border-radius: 10px; background: rgba(4, 30, 25, 0.72); border: 1px solid rgba(212, 175, 55, 0.35); display: flex; flex-direction: column; gap: 4px; }
.rq::after { content: "→"; position: absolute; right: -9px; top: 6px; color: var(--gold); font-size: 12px; }
.rq:last-child::after { content: none; }
.rq.now { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.5); }
.rq-h { font: 700 14px var(--font-sans); color: var(--gold-hi); }
.rq-h small { font-weight: 500; color: var(--ivory-muted); font-size: 11px; }
.rq .fx-chip { font-size: 12px; padding: 2px 6px; }
.rq .fx-chip.ghost { opacity: 0.75; border-style: dashed; background: transparent; }
.rm { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; border-radius: 6px; padding: 1px 6px; align-self: flex-start; }
.rm.seal { background: rgba(63, 224, 184, 0.18); color: #7ff2c8; }
.rm.breach { background: rgba(255, 59, 47, 0.2); color: #ff8a7a; }
.rm.rival { background: rgba(185, 166, 255, 0.2); color: #cfc3ff; }

/* Meters: crisis threshold ticks */
.m-bar { position: relative; }
.m-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff6c8; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); }
.rating-plate { display: grid; place-items: center; min-width: 64px; padding: 4px 10px; border-radius: 10px; background: linear-gradient(180deg, #f0cf7a, #a87a22); color: #1e1404; font: 800 22px var(--font-serif); line-height: 1; border: 1px solid #fff1c2; box-shadow: var(--deco-shadow); }
.rating-plate small { font: 700 10px var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; }
.head-right { display: flex; gap: 8px; align-items: center; }

/* Rivals panel */
.rivals { display: grid; gap: 6px; }
.rv-row { display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; align-items: center; text-align: left; min-height: 44px; padding: 6px 8px; border-radius: 10px; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(185, 166, 255, 0.35); color: var(--ivory); }
.rv-row i { width: 12px; height: 12px; border-radius: 3px; grid-row: span 2; }
.rv-row b { font-size: 14px; }
.rv-row span { font-size: 12px; color: var(--ivory-muted); grid-column: 2; }
.tick-item { background: none; border: 0; color: inherit; font: inherit; padding: 0; margin-right: 28px; text-decoration: underline dotted rgba(243, 217, 143, 0.6); cursor: pointer; white-space: nowrap; }
.dz-warn { color: #ffb3a1; background: rgba(138, 28, 20, 0.45); border: 1px solid #ff6a5a; border-radius: 8px; padding: 6px 10px; font-weight: 700; }
.target.mandate span { color: var(--gold-hi); }

/* Exec select + loadout */
.div-badge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: linear-gradient(180deg, #f0cf7a, #b8862c); color: #1e1404; font: 800 14px var(--font-sans); letter-spacing: 0.04em; vertical-align: middle; }
.exec-card .best { font: 700 11px var(--font-sans); color: var(--gold-hi); border: 1px solid var(--gold-line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.loadout { margin-top: 18px; padding: 14px; border-radius: 16px; background: rgba(0, 0, 0, 0.22); border: 1px solid var(--gold-line); }
.loadout h3 { margin: 10px 0 6px; font-family: var(--font-serif); }
.loadout h3 small { font: 500 13px var(--font-sans); color: var(--ivory-muted); margin-left: 6px; }
.rating-row { display: flex; flex-wrap: wrap; gap: 6px; }
.rating-chip { min-width: 58px; min-height: 48px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--gold-line); background: rgba(4, 30, 25, 0.8); color: var(--ivory); font: 800 17px var(--font-serif); padding: 4px 8px; line-height: 1.1; }
.rating-chip small { font: 600 11px var(--font-sans); color: var(--ivory-muted); }
.rating-chip.on { background: linear-gradient(180deg, #f0cf7a, #a87a22); color: #1e1404; border-color: #fff1c2; }
.rating-chip.on small { color: #3b2a08; }
.rating-chip.locked { opacity: 0.35; }
.rating-mods { margin: 8px 0 0; padding-left: 18px; color: var(--ivory-muted); font-size: 14px; columns: 2 220px; }
.perk-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.perk-chip { text-align: left; display: grid; gap: 2px; padding: 10px 12px; min-height: 48px; border-radius: 12px; border: 1px solid var(--gold-line); background: rgba(4, 30, 25, 0.75); color: var(--ivory); }
.perk-chip.on { box-shadow: inset 0 0 0 2px var(--coral); background: rgba(14, 66, 56, 0.9); }
.perk-chip .up, .si-up { color: #7ff2c8; font-size: 13px; }
.perk-chip .down, .si-down { color: #ffb3a1; font-size: 13px; }
.perk-chip span { font-size: 13px; color: var(--ivory-muted); }

/* Boardroom */
.boardroom .wing { margin-top: 18px; }
.boardroom .wing h3 { font-family: var(--font-serif); margin: 0; border-bottom: 1px solid var(--gold-line); padding-bottom: 4px; }
.br-balance { margin: 6px 0 0; }
.br-balance .div-badge { font-size: 18px; margin-left: 0; }
.br-notice { padding: 8px 12px; border-radius: 10px; background: rgba(63, 224, 184, 0.15); border: 1px solid #3fe0b8; color: #c8fff0; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
.shop-item { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: var(--glass-deco); border: 1px solid var(--gold-line); box-shadow: var(--deco-inset); }
.shop-item.owned { border-color: rgba(63, 224, 184, 0.6); }
.si-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.si-head b { color: var(--ivory); }
.si-head em { font-style: normal; color: var(--gold-hi); font-weight: 800; white-space: nowrap; }
.shop-item.owned .si-head em { color: #7ff2c8; }
.si-text, .si-alt { margin: 0; font-size: 13px; color: var(--ivory-muted) !important; }
.shop-item .btn { margin-top: auto; }
.btn-sm { min-height: 40px; font-size: 15px; }

/* End: Shareholder Letter */
.end-hero { position: relative; }
.end-hero img { width: 100%; display: block; border-radius: 14px; }
.end-stamp { position: absolute; right: 6%; top: 10%; transform: rotate(-8deg); padding: 10px 18px; border: 4px double #ff6a5a; color: #ffd2c4; background: rgba(60, 10, 6, 0.65); font: 800 26px var(--font-serif); text-transform: uppercase; letter-spacing: 0.06em; text-align: center; animation: dzpop 0.5s cubic-bezier(.2,1.4,.4,1) 0.4s both; }
.end-stamp small { display: block; font: 600 12px var(--font-sans); letter-spacing: 0.04em; text-transform: none; }
.letter { margin: 16px 0; padding: 18px 20px; border-radius: 6px; background: linear-gradient(180deg, #fbf3dc, #efe0b8); color: #2a1d06; box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 0 1px #c9a24a, inset 0 0 0 6px #fbf3dc, inset 0 0 0 7px #c9a24a; }
.letter .kicker { color: #8a6412 !important; }
.letter-head p { font-family: var(--font-serif); font-style: italic; color: #4a3610 !important; margin: 4px 0 10px; }
.letter table { width: 100%; border-collapse: collapse; }
.letter th, .letter td { padding: 6px 4px; border-bottom: 1px dotted #b8954a; text-align: left; color: #2a1d06; }
.letter th small { display: block; font-weight: 400; font-size: 12px; color: #6a5220; }
.letter td { text-align: right; font: 700 17px var(--font-serif); white-space: nowrap; }
.letter tr.zero td, .letter tr.zero th { opacity: 0.5; }
.letter tr.sub th, .letter tr.sub td { font-size: 14px; border-bottom-style: solid; }
.letter tr.total th, .letter tr.total td { font: 800 22px var(--font-serif); border-bottom: 3px double #8a6412; color: #0d4a3c; }
.letter-foot { margin: 8px 0 0; text-align: right; color: #4a3610 !important; font-weight: 700; }
.page .letter p, .page .letter th, .page .letter td { color: #2a1d06; }

/* Hologram globe on a gold pedestal (desk, landscape) */
.desk.is-globe .board-tilt { flex-direction: column; align-items: center; perspective: none; }
.desk.is-globe .board-slab { transform: none; background: none; box-shadow: none; border-radius: 50%; overflow: visible; width: 100%; }
.desk.is-globe .board-slab::before, .desk.is-globe .board-slab::after { content: none; }
.desk.is-globe .board-tilt::after { content: none; }
.desk.is-globe .map { aspect-ratio: 960 / 950; height: 100%; width: auto; max-width: 100%; margin: 0 auto; overflow: visible; }
.desk.is-globe .map-zoom { display: flex; justify-content: center; }
.map.globe .sphere-shine { pointer-events: none; }
.map.globe .orbit { fill: none; stroke: #8ff5e0; stroke-width: 2; stroke-opacity: 0.5; pointer-events: none; }
.map.globe .orbit.o1 { stroke-dasharray: 2 10; }
.map.globe .sea-g { filter: drop-shadow(0 0 30px rgba(63, 224, 184, 0.55)); }
.pedestal { position: relative; width: min(70%, 520px); height: 46px; margin-top: -34px; pointer-events: none; }
.pedestal i { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; border: 2px solid var(--gold); }
.pedestal i:nth-child(1) { width: 100%; height: 46px; top: 0; background: radial-gradient(50% 50% at 50% 40%, rgba(255, 246, 200, 0.6), rgba(63, 224, 184, 0.15) 60%, rgba(0, 0, 0, 0)); box-shadow: 0 0 30px rgba(243, 217, 143, 0.5), inset 0 0 18px rgba(243, 217, 143, 0.6); }
.pedestal i:nth-child(2) { width: 80%; height: 34px; top: 6px; border-color: var(--gold-hi); }
.pedestal i:nth-child(3) { width: 112%; height: 58px; top: 2px; border-color: rgba(212, 175, 55, 0.45); }

/* Phone: map first, readable, half-height sheet */
@media (orientation: portrait), (max-width: 899px) {
  .desk .board-slab { transform: none; margin: 0 -6px; }
  .map .rlabel { font-size: 30px; stroke-width: 6px; }
  .map .pin-scale { transform: scale(1.9); }
  .map .pin-tag-in { transform: scale(1.45); }
  .map .pin-hit { transform: scale(1.45); }
  .map .spips { transform-box: fill-box; }
  .map .revolt-plate { transform-box: fill-box; }
  .map .yield, .map .rtag { display: none; }
  .desk.has-sel .dossier { max-height: 52dvh; }
  .desk.has-sel::after { background: rgba(0, 0, 0, 0.15); }
  .lens-btn, .net-chip { font-size: 13px; padding: 4px 10px; }
  .rail { grid-template-columns: repeat(5, minmax(64px, 1fr)); overflow-x: auto; }
  .map-zoom { touch-action: pan-y; }
  .end-stamp { font-size: 18px; }
}

/* Cosmetics: Property Portfolio */
body.cos-light-golden .bk-art, body.cos-light-golden .bc-scene { filter: sepia(0.35) saturate(1.3) brightness(1.05) hue-rotate(-8deg); }

/* ---- Penny · Onboarding ---- */
.penny { position: fixed; inset: 0; z-index: 900; pointer-events: none; }
.penny[hidden] { display: none; }
.penny .pn-blk { position: fixed; background: rgba(2, 14, 11, 0.62); pointer-events: auto; transition: none; }
.penny.is-tip .pn-blk { background: rgba(2, 14, 11, 0.45); }
.penny .pn-hole { position: fixed; border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 2px #f3d27a, 0 0 22px 6px rgba(243, 210, 122, 0.55), inset 0 0 18px rgba(243, 210, 122, 0.25); animation: pnHole 1.6s ease-in-out infinite; }
@keyframes pnHole { 50% { box-shadow: 0 0 0 3px #fff0c0, 0 0 34px 10px rgba(243, 210, 122, 0.7), inset 0 0 22px rgba(243, 210, 122, 0.35); } }
.penny .pn-arrow { position: fixed; width: 60px; height: 70px; pointer-events: none; animation: pnBob 0.9s ease-in-out infinite; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) drop-shadow(0 0 10px rgba(243,210,122,0.6)); }
.penny .pn-arrow svg { width: 100%; height: 100%; }
.penny .pn-arrow path { fill: #e9bd52; stroke: #fff2c4; stroke-width: 2.5; stroke-linejoin: round; }
.penny .pn-arrow.up { transform: rotate(180deg); animation-name: pnBobUp; }
.penny .pn-arrow.nudge { animation: pnNudge 0.45s ease-in-out 2; }
@keyframes pnBob { 50% { translate: 0 12px; } }
@keyframes pnBobUp { 50% { translate: 0 -12px; } }
@keyframes pnNudge { 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
.penny .pn-box { position: fixed; left: 50%; bottom: 18px; transform: translateX(-46%); width: min(860px, calc(100vw - 40px)); display: flex; align-items: flex-end; gap: 0; pointer-events: auto; }
.penny.box-top .pn-box { bottom: auto; top: 14px; }
.penny .pn-box.pop .pn-card { animation: pnPop 0.32s cubic-bezier(.2,.9,.3,1.3); }
@keyframes pnPop { from { transform: scale(0.96) translateY(10px); opacity: 0.2; } }
.penny .pn-face { width: 230px; height: 307px; object-fit: contain; object-position: bottom; margin-right: -38px; margin-bottom: -18px; position: relative; z-index: 2; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.55)); pointer-events: none; }
.penny.box-top .pn-face { width: 165px; height: 220px; margin-bottom: -10px; }
.penny .pn-card { position: relative; flex: 1; min-width: 0; padding: 30px 26px 16px 56px; border-radius: 6px;
  background: linear-gradient(180deg, rgba(10, 58, 48, 0.94), rgba(4, 30, 25, 0.96));
  border: 2px solid #d4af37; box-shadow: inset 0 0 0 5px rgba(4, 30, 25, 0.95), inset 0 0 0 6px rgba(212, 175, 55, 0.65), 0 18px 40px rgba(0,0,0,0.55), 0 0 30px rgba(212,175,55,0.18);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #f6edd7; }
.penny .pn-card::before, .penny .pn-card::after { content: ""; position: absolute; width: 26px; height: 26px; border: 2px solid #f0cf7a; pointer-events: none; }
.penny .pn-card::before { left: -7px; bottom: -7px; border-right: 0; border-top: 0; }
.penny .pn-card::after { right: -7px; top: -7px; border-left: 0; border-bottom: 0; }
.penny .pn-head { position: absolute; left: 40px; right: 18px; top: -19px; display: flex; justify-content: space-between; align-items: flex-start; }
.penny .pn-name { padding: 6px 22px 7px; background: linear-gradient(180deg, #0d4a3d, #052820); border: 2px solid #d4af37; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); font: 800 21px var(--font-serif, Georgia, serif); letter-spacing: 0.06em; color: #f3d27a; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
.penny .pn-name span { font: 700 18px var(--font-sans, sans-serif); letter-spacing: 0.02em; color: #f3d27a; }
.penny .pn-count { margin-top: 26px; font: 700 17px var(--font-sans, sans-serif); color: #f3d27a; }
.penny.is-tip .pn-count { display: none; }
.penny .pn-text { margin: 4px 0 0; min-height: 3.2em; font: 500 20px/1.5 var(--font-sans, sans-serif); color: #fbf3df; cursor: pointer; }
.penny .pn-text b { color: #f3d27a; }
.penny .pn-text .ch { opacity: 0; }
.penny .pn-text .ch.on, .penny .pn-text.done .ch { opacity: 1; }
.penny .pn-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.penny .pn-next, .penny .pn-alt { min-height: 44px; padding: 0 20px; border-radius: 8px; border: 2px solid #d4af37; background: linear-gradient(180deg, #0e4a3d, #052a22); color: #f6edd7; font: 800 17px var(--font-sans, sans-serif); cursor: pointer; }
.penny .pn-next:hover, .penny .pn-next:focus-visible { background: linear-gradient(180deg, #f0cf7a, #a87a22); color: #1e1404; outline: none; box-shadow: 0 0 0 3px rgba(243,210,122,0.45); }
.penny.is-action .pn-next { font-size: 15px; opacity: 0.92; }
.penny .pn-skip { position: absolute; right: 0; bottom: -2px; transform: translateY(100%); min-height: 36px; padding: 4px 6px; background: none; border: 0; color: #fbf3df; font: 700 17px var(--font-sans, sans-serif); text-shadow: 0 2px 6px rgba(0,0,0,0.9); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(243,210,122,0.5); text-underline-offset: 4px; }
.penny .pn-skip:focus-visible { outline: 2px solid #f3d27a; border-radius: 4px; }
.penny.box-top .pn-skip { bottom: auto; top: auto; }
.penny .pn-box { margin-bottom: 26px; }
.penny.is-passive .pn-box { left: 18px; transform: none; width: min(560px, calc(100vw - 36px)); }
.penny.is-passive .pn-face { width: 150px; height: 200px; }
.penny.is-passive .pn-text { font-size: 18px; }
.pn-glow { filter: drop-shadow(0 0 8px #f3d27a) drop-shadow(0 0 16px rgba(243,210,122,0.7)); }
.howto-pick { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.howto-pick img { width: 96px; height: 128px; object-fit: contain; }
@media (max-width: 720px) {
  .penny .pn-box { left: 8px; right: 8px; bottom: 10px; transform: none; width: auto; display: block; margin-bottom: 30px; }
  .penny .pn-face { position: absolute; left: -2px; bottom: calc(100% - 30px); width: 96px; height: 128px; margin: 0; }

  /* Visible viewport height: prefer visualViewport so a Safari toolbar
     cannot leave actions under the chrome. 100vh is the large viewport
     and is not used for layout. */
  (function () {
    function setAppH() {
      var vv = window.visualViewport;
      var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight);
      var top = Math.round((vv && vv.offsetTop) || 0);
      if (h < 240) return;
      var r = document.documentElement;
      r.style.setProperty("--app-h", h + "px");
      r.style.setProperty("--app-top", top + "px");
    }
    setAppH();
    window.addEventListener("resize", setAppH);
    window.addEventListener("orientationchange", function () { setTimeout(setAppH, 60); });
    if (window.visualViewport) {
      visualViewport.addEventListener("resize", setAppH);
      visualViewport.addEventListener("scroll", setAppH);
    }
  })();

/* Last Dividend — seeded PRNG (Mulberry32). Browser + Node. */
(function (root) {
  var LD = root.LD || (root.LD = {});

  function hashString(str) {
    var h = 2166136261 >>> 0;
    var s = String(str);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function normalizeSeed(seed) {
    if (seed == null || seed === "") {
      return (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
    }
    if (typeof seed === "number" && isFinite(seed)) {
      return (seed >>> 0) || 1;
    }
    var s = String(seed).trim();
    /* The seed field in the UI is always a string. "1" must equal 1, not a hash. */
    if (/^[0-9]+$/.test(s)) {
      var parsed = parseInt(s, 10);
      if (parsed <= 0xFFFFFFFF) return (parsed >>> 0) || 1;
    }
    return hashString(s) || 1;
  }

  function createRng(seed) {
    var a = normalizeSeed(seed);
    function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    next.state = function () {
      return a;
    };
    next.int = function (n) {
      return Math.floor(next() * n);
    };
    next.pick = function (arr) {
      return arr[next.int(arr.length)];
    };
    next.shuffle = function (arr) {
      var a2 = arr.slice();
      for (var i = a2.length - 1; i > 0; i--) {
        var j = next.int(i + 1);
        var tmp = a2[i];
        a2[i] = a2[j];
        a2[j] = tmp;
      }
      return a2;
    };
    next.fork = function () {
      return createRng(next.int(0xffffffff) || 1);
    };
    return next;
  }

  LD.hashString = hashString;
  LD.normalizeSeed = normalizeSeed;
  LD.createRng = createRng;

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { hashString: hashString, normalizeSeed: normalizeSeed, createRng: createRng };

    if (state.ap < LD.DEAL_AP) return { ok: false, error: "No action points remain.", state: state };
    if (state.offered.indexOf(dealId) === -1) return { ok: false, error: "That deal is not on offer.", state: state };
    var fyBlock = LD.fyBlockDeal ? LD.fyBlockDeal(state) : null;
    if (fyBlock) return { ok: false, error: fyBlock, state: state };

    var deal = dealById(dealId);
    if (!deal) return { ok: false, error: "Unknown deal.", state: state };

    var payload = deal;
    if (deal.choices) {
      var choice = resolveChoiceDeal(deal, choiceId);
      if (!choice) return { ok: false, error: "Choose a response to this crisis.", state: state, needChoice: true, deal: deal };
      payload = choice;
    }

    var m = mods(state);
    var cost = payload.cost || 0;
    if (deal.isCrisis && cost && state.unrest >= m.crisisNoPayAt) {
      return { ok: false, error: "They are past being bought. Paying is off the table at unrest " + m.crisisNoPayAt + "+.", state: state };
    }
    var rebate = crisisRebate(state, deal, payload);
    if (cost && state.cash < cost - rebate) {
      return { ok: false, error: "Not enough cash (" + (cost - rebate) + " required).", state: state };
    }

    var pendingBefore = state.pending.length;
    var notes = applyImmediate(state, payload.immediate, [], deal);
    if (rebate) {
      state.cash += rebate;
      state.flags.regulatorUsed = true;
      notes.push("regulator rebate +" + rebate);
    }
    if (m.calmBonus && LD.dealKind && LD.dealKind(deal) === "calm") {
      state.unrest = clamp(state.unrest - m.calmBonus, 0, LD.MAX_UNREST);
      notes.push("−" + m.calmBonus + " unrest (media darling)");
    }
    if (payload.delay) scheduleDelay(state, payload.delay, deal.title);
    var supply = defaultSupply(deal, payload);
    if (supply.ease) applyGridMap(state, supply.ease, -1, notes);
    if (supply.strain) {
      var execS = execById(state.executiveId);
      var bonusS = (execS.perks && execS.perks.delayBonus) || 0;
      scheduleDelay(state, {
        turns: 0 + bonusS,
        strain: supply.strain,
        log: "Public networks you still buy from have tightened."
      }, deal.title);
      Object.keys(supply.strain).forEach(function (g) {
        var next = Math.min(LD.GRID_DISRUPTED, gridLevel(state, g) + supply.strain[g]);
        notes.push(g + " supply will be " + gridLabel(next) + " at close");
      });
    }
    var regionEffect = LD.worldOnDeal ? LD.worldOnDeal(state, deal, choiceId, notes) : null;
    if (LD.fyOnDeal) LD.fyOnDeal(state, deal, payload, choiceId, notes, pendingBefore);
    if (deal.unique || deal.isCrisis) {
      if (state.usedUnique.indexOf(deal.id) === -1) state.usedUnique.push(deal.id);
    }

    state.ap -= LD.DEAL_AP;
    state.dealPickedThisTurn = true;
    state.lastDealId = deal.id;
    state.phase = "bunker";
    state.recentDealIds = state.recentDealIds.concat([deal.id]).slice(-6);
    var line = deal.title;
    if (payload.label) line += " — " + payload.label;
    if (notes.length) line += " (" + notes.join(", ") + ")";
    if (payload.delay) {
      var exec = execById(state.executiveId);
      var bonus = (exec.perks && exec.perks.delayBonus) || 0;
      line += ". Due Q" + (state.turn + payload.delay.turns + bonus) + ".";
    }
    pushLog(state, line);
    return { ok: true, state: state, notes: notes, region: regionEffect };
  }

  function upgradeCost(state, systemId, level, quality) {
    var table = LD.UPGRADES[systemId];
    if (!table) return null;
    var row = null;
    for (var i = 0; i < table.length; i++) {
      if (table[i].level === level) row = table[i];
    }
    if (!row) return null;
    var m = mods(state);
    var cost = quality === "cheap" ? row.cheap : row.sound;
    if (m.upgradeMult !== 1) cost = Math.round(cost * m.upgradeMult);
    if (quality === "cheap" && m.cheapExtra) cost += m.cheapExtra;
    var exec = execById(state.executiveId);
    var perks = exec.perks || {};
    if (systemId === "water" && perks.waterUpgradeDiscount) cost -= perks.waterUpgradeDiscount;
    if (systemId === "power" && perks.powerUpgradeDiscount) cost -= perks.powerUpgradeDiscount;
    if (systemId === "air" && perks.airUpgradeDiscount) cost -= perks.airUpgradeDiscount;
    if (systemId === "food" && hasFlag(state, "seedVault")) cost -= 6;
    if (systemId === "food" && level === 2 && hasFlag(state, "farmLand")) cost -= 6;
    if (systemId === "power" && level === 2 && hasFlag(state, "solarWriteoff")) cost -= 8;
    if (!state.converting && !permitAvailable(state)) {
      var gl = gridLevel(state, systemId);
      if (gl >= LD.GRID_DISRUPTED) cost += m.disruptSurcharge;
      else if (gl >= LD.GRID_STRAINED) cost += m.strainSurcharge;
    }
    if (state.bunker.water.level >= 2 && systemId === "food" && level === 2) cost -= 6;
    if (state.bunker.power.level >= 2 && (systemId === "air" || systemId === "water") && level === 2) cost -= 4;
    if (hasFlag(state, "freightCharter")) {
      cost = Math.floor(cost * 0.7);
    }
    return Math.max(4, cost);
  }

  /* Pre-Approved Permits: an order that ignores public-network damage. */
  function permitAvailable(state) {
    var m = mods(state);
    return m.permitWaivers > ((state.flags && state.flags.permitsUsed) || 0);
  }

  function availableUpgrades(state) {
    var list = [];
    LD.SYSTEMS.forEach(function (sys) {
      var cur = state.bunker[sys.id];
      var nextLevel = cur.level + 1;
      if (nextLevel > 3) return;
      var table = LD.UPGRADES[sys.id];
      var row = table[nextLevel - 1];
      var inbound = pendingInstallFor(state, sys.id);
      var soundQ = shipmentQuote(state, sys.id, "sound");
      var cheapQ = shipmentQuote(state, sys.id, "cheap");
      var soundCost = soundQ ? soundQ.cost : upgradeCost(state, sys.id, nextLevel, "sound");
      var cheapCost = cheapQ ? cheapQ.cost : upgradeCost(state, sys.id, nextLevel, "cheap");
      list.push({
        systemId: sys.id,
        systemName: sys.name,
        level: nextLevel,
        name: row.name,
        soundCost: soundCost,
        cheapCost: cheapCost,
        canSound: !inbound && state.cash >= soundCost,
        canCheap: !inbound && state.cash >= cheapCost,
        delay: soundQ ? soundQ.delay : 0,
        surcharge: soundQ ? soundQ.surcharge : 0,
        gridLabel: soundQ ? soundQ.gridLabel : "clear",
        inbound: inbound
      });
    });
    return list;
  }

  function engineerCost(state) {
    var c = mods(state).engineerCost + (LD.rivalEngineerTax ? LD.rivalEngineerTax(state) : 0);
    var exec = execById(state.executiveId);
    if (exec.perks && exec.perks.engineerExtra) c += exec.perks.engineerExtra;
    if (hasFlag(state, "poachedTalent")) c -= 10;
    return Math.max(8, c);
  }

  function engineerBlocked(state) {
    var t = mods(state).engineerMinTurn || 1;
    return state.turn < t ? "Your retainer engineer is not free until Q" + t + "." : null;
  }

  function canHireEngineer(state) {
    return !state.engineer && !engineerBlocked(state) && state.cash >= engineerCost(state);
  }

  function bunkerGuard(state) {
    if (state.ended) return "Run already ended.";
    if (state.phase !== "bunker") return "Choose a deal first.";
    if (state.bunkerActedThisTurn) return "Bunker action already taken this quarter.";
    if (state.ap < LD.BUNKER_AP) return "No action points remain.";
    return null;
  }

  function buyUpgrade(state, systemId, quality) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (quality !== "sound" && quality !== "cheap") {
      return { ok: false, error: "Choose sound or discount contractors.", state: state };
    }
    var cur = state.bunker[systemId];
    if (!cur) return { ok: false, error: "Unknown system.", state: state };
    if (cur.level >= 3) return { ok: false, error: "That system is already at maximum.", state: state };
    var nextLevel = cur.level + 1;
    var cost = upgradeCost(state, systemId, nextLevel, quality);
    if (state.cash < cost) return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };

    if (hasFlag(state, "skilledCrew")) {
      quality = "sound";
      delete state.flags.skilledCrew;
    }
    if (hasFlag(state, "freightCharter")) {
      delete state.flags.freightCharter;
    }

    if (pendingInstallFor(state, systemId)) {
      return { ok: false, error: "A shipment for that system is already in transit.", state: state };
    }
    var quote = shipmentQuote(state, systemId, quality);
    state.cash -= cost;
    if (quote && quote.waived) {
      state.flags.permitsUsed = (state.flags.permitsUsed || 0) + 1;
      pushLog(state, "Pre-approved permit used: public-network surcharge waived.");
    }
    var row = LD.UPGRADES[systemId][nextLevel - 1];
    if (quote && quote.delay > 0) {
      scheduleDelay(state, {
        turns: quote.delay,
        noBonus: true,
        install: { id: systemId, level: nextLevel, quality: quality },
        log: "Private-shelter shipment arrived: " + row.name + "."
      }, row.name);
      state.ap -= LD.BUNKER_AP;
      state.bunkerActedThisTurn = true;
      state.lastBunkerAction = "upgrade:" + systemId + ":L" + nextLevel + ":" + quality + ":delayed";
      pushLog(state, "Paid " + cost + " for " + row.name + " (" + systemId + " L" + nextLevel + ", " + quality + "). Public " + systemId + " is disrupted — arrives Q" + (state.turn + quote.delay) + ".");
      return { ok: true, state: state, cost: cost, delayed: true, due: state.turn + quote.delay };
    }
    cur.level = nextLevel;
    if (quality === "cheap") {
      cur.quality = "cheap";
    } else if (nextLevel >= 3) {
      cur.quality = "sound";
    }
    /* L3 sound remediates; L1/L2 sound does not wash out a prior cheap mark unless L3. */
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    state.lastBunkerAction = "upgrade:" + systemId + ":L" + nextLevel + ":" + quality;
    pushLog(state, "Installed " + row.name + " (" + systemId + " L" + nextLevel + ", " + quality + ") for " + cost + ".");
    return { ok: true, state: state, cost: cost, delayed: false };
  }

  function hireEngineer(state) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (state.engineer) return { ok: false, error: "A chief engineer is already retained.", state: state };
    var eb = engineerBlocked(state);
    if (eb) return { ok: false, error: eb, state: state };
    var cost = engineerCost(state);
    if (state.cash < cost) return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };
    state.cash -= cost;
    state.engineer = true;
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    state.lastBunkerAction = "engineer";
    pushLog(state, "Retained a chief engineer for " + cost + ".");
    return { ok: true, state: state, cost: cost };
  }

  function canBeginConversion(state) {
    return !state.ended && state.phase === "bunker" && !state.bunkerActedThisTurn && !state.converting && state.ap >= LD.BUNKER_AP;
  }

  function beginConversion(state, systemId, quality) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (state.converting) return { ok: false, error: "You have already converted to private supply.", state: state };
    if (systemId && quality !== "sound" && quality !== "cheap") {
      return { ok: false, error: "Choose sound or discount contractors.", state: state };
    }
    var cost = 0;
    var secured = null;
    var fee = mods(state).conversionFee || 0;
    if (state.cash < fee) return { ok: false, error: "Going private needs " + fee + " cash for the offshore paperwork.", state: state };
    if (systemId) {
      var curCheck = state.bunker[systemId];
      if (!curCheck) return { ok: false, error: "Unknown system.", state: state };
      if (curCheck.level >= 3) return { ok: false, error: "That system is already at maximum.", state: state };
      if (pendingInstallFor(state, systemId)) {
        return { ok: false, error: "A shipment for that system is already in transit.", state: state };
      }
      var priced = deepClone(state);
      priced.converting = true;
      if (hasFlag(priced, "skilledCrew")) quality = "sound";
      var nextCheck = curCheck.level + 1;
      cost = upgradeCost(priced, systemId, nextCheck, quality);
      if (state.cash < cost + fee) return { ok: false, error: "Not enough cash (" + (cost + fee) + " required).", state: state };
    }
    state.converting = true;
    if (fee) state.cash -= fee;
    if (systemId) {
      if (hasFlag(state, "skilledCrew")) {
        quality = "sound";
        delete state.flags.skilledCrew;
      }
      if (hasFlag(state, "freightCharter")) {
        delete state.flags.freightCharter;
      }
      var cur = state.bunker[systemId];
      var nextLevel = cur.level + 1;
      cost = upgradeCost(state, systemId, nextLevel, quality);
      state.cash -= cost;
      cur.level = nextLevel;
      if (quality === "cheap") cur.quality = "cheap";
      else if (nextLevel >= 3) cur.quality = "sound";
      secured = { systemId: systemId, level: nextLevel, quality: quality, name: LD.UPGRADES[systemId][nextLevel - 1].name };
      state.lastBunkerAction = "convert:" + systemId + ":L" + nextLevel + ":" + quality;
    } else {
      state.lastBunkerAction = "convert";
    }
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    pushLog(state, "Converted to private supply. Further deals pay " + Math.round(conversionRate(state) * 100) + "% cash." + (fee ? " Offshore paperwork " + fee + "." : "") + " Installs ignore public-network damage and arrive this quarter.");
    if (secured) {
      pushLog(state, "Secured " + secured.name + " (" + secured.systemId + " L" + secured.level + ", " + secured.quality + ") for " + cost + ".");
    }
    return { ok: true, state: state, cost: cost + fee, secured: secured };
  }

  function systemReliable(state, systemId) {
    var sys = state.bunker[systemId];
    if (!sys || sys.level < LD.WIN_LEVEL) return false;
    var fyRel = LD.fyReliable ? LD.fyReliable(state, sys) : null;
    if (fyRel !== null) return fyRel;
    if (sys.quality === "sound") return true;
    if (sys.level >= 3) return true;
    if (state.engineer) return true;
    return false;
  }

  function evacuationResult(state) {
    var missing = [];
    var unreliable = [];
    LD.SYSTEMS.forEach(function (s) {
      var sys = state.bunker[s.id];
      if (sys.level < LD.WIN_LEVEL) missing.push(s.name);
      else if (!systemReliable(state, s.id)) unreliable.push(s.name);
    });
    if (missing.length) {
      return {
        kind: "lose",
        reason: "unfinished",
        title: "An unfinished hole in the ground",
        body: "The doors can close. They should not. Incomplete systems: " + missing.join(", ") + "."
      };
    }
    if (unreliable.length) {
      return {
        kind: "lose",
        reason: "failed-systems",
        title: "The cheapest filters failed first",
        body: "You sealed on time. The bargain work did not hold. Failed systems: " + unreliable.join(", ") + ". A chief engineer, or level-3 redundancy, would have carried them."
      };
    }
    var flavor = [];
    if (hasFlag(state, "clinicSold")) flavor.push("There is no surgeon. You did sell the clinic lot.");
    if (hasFlag(state, "blackoutContracts")) flavor.push("The generator is yours. The grid you priced in the dark is not coming back.");
    if (state.collapse < 70 && state.cash >= 20) flavor.push("You left money on the table. The street would have taken it anyway.");
    if (state.converting) flavor.push("You converted to a private supply chain before the public one finished failing.");
    else if ((state.grids && (state.grids.water + state.grids.power + state.grids.air + state.grids.food)) >= 3) {
      flavor.push("The municipal contracts you sold are not coming back. Your private ones did.");
    }
    var body = "Air, water, power, and food all hold. The last dividend is silence.";
    if (flavor.length) body += " " + flavor.join(" ");
    return {
      kind: "win",
      reason: "evacuated",
      title: "The doors close on time",
      body: body
    };
  }

  function applyPendingDue(state) {
    var fired = [];
    var keep = [];
    state.pending.forEach(function (item) {
      if (item.due > state.turn || item.install) {
        keep.push(item);
        return;
      }
      var notes = [];
      var unrest = item.unrest || 0;
      var collapse = item.collapse || 0;
      var cash = item.cash || 0;
      if (item.effectsIf) {
        var cond = item.effectsIf;
        var apply = true;
        if (cond.unlessFlag && hasFlag(state, cond.unlessFlag)) apply = false;
        if (cond.ifFlag && !hasFlag(state, cond.ifFlag)) apply = false;
        if (apply) {
          unrest += cond.unrest || 0;
          collapse += cond.collapse || 0;
          cash += cond.cash || 0;
        }
      }
      var exec = execById(state.executiveId);
      if (collapse > 0 && exec.perks && exec.perks.foodCollapseRelief && item.grantSystem == null) {
        /* Imani only relieves collapse on food-tagged delayed pain if we stored it; keep simple: small relief always on delayed collapse. */
      }
      if (unrest) {
        state.unrest = clamp(state.unrest + unrest, 0, LD.MAX_UNREST);
        notes.push((unrest >= 0 ? "+" : "") + unrest + " unrest");
      }
      if (collapse) {
        state.collapse = clamp(state.collapse + collapse, 0, LD.MAX_COLLAPSE);
        notes.push((collapse >= 0 ? "+" : "") + collapse + " collapse");
      }
      if (cash) {
        state.cash = Math.max(0, state.cash + cash);
        notes.push((cash >= 0 ? "+" : "") + cash + " cash");
      }
      if (item.flags) setFlags(state, item.flags);
      if (item.grantSystem) grantSystem(state, item.grantSystem, notes);
      if (item.strain) applyGridMap(state, item.strain, 1, notes);
      if (item.ease) applyGridMap(state, item.ease, -1, notes);
      var line = item.log + (notes.length ? " (" + notes.join(", ") + ")" : "");
      pushLog(state, line);
      fired.push({ text: line, source: item.source });
    });
    state.pending = keep;
    return fired;
  }

  function baseTick(state) {
    var m = mods(state);
    return m.collapseTick + (state.turn >= m.lateAccelTurn ? 1 : 0);
  }

  function collapseTickAmount(state) {
    var tick = baseTick(state);
    if (hasFlag(state, "softQuarter")) {
      tick -= 2;
      delete state.flags.softQuarter;
    }
    var exec = execById(state.executiveId);
    if (exec.perks && exec.perks.foodCollapseRelief) tick -= exec.perks.foodCollapseRelief;
    return Math.max(1, tick);
  }

  function forecastQuarters(state) {
    var exec = execById(state.executiveId);
    var relief = (exec.perks && exec.perks.foodCollapseRelief) || 0;
    var remain = LD.MAX_COLLAPSE - state.collapse;
    if (remain <= 0) return 0;
    var m = mods(state);
    var q = 0, turn = state.turn, soft = hasFlag(state, "softQuarter");
    while (remain > 0 && q < 40) {
      var tick = m.collapseTick + (turn >= m.lateAccelTurn ? 1 : 0) - relief;
      if (soft) { tick -= 2; soft = false; }
      remain -= Math.max(1, tick);
      turn += 1;
      q += 1;
    }
    return q;
  }

  function maybeEnd(state) {
    if (state.ended) return;
    if (state.unrest >= LD.MAX_UNREST) {
      state.ended = true;
      state.ending = {
        kind: "lose",
        reason: "unrest",
        title: "The street is in the lobby",
        body: "The board is still in session. You do not reach the car."
      };
      state.phase = "ended";
      pushLog(state, "Run ends: unrest reached " + LD.MAX_UNREST + ".");
      return;
    }
    if (state.collapse >= LD.MAX_COLLAPSE) {
      var result = evacuationResult(state);
      if (result.kind === "win") {
        result.title = "The sirens started during the ribbon-cutting";
        result.body = "Collapse reached the door. Your bunker held. " + result.body;
      } else if (result.reason === "unfinished") {
        result.title = "The countdown expired in an unfinished room";
        result.body = "Collapse reached 100 before the bunker was ready. " + result.body;
      } else {
        result.title = "The doors closed on bargain work";
        result.body = "Collapse forced an evacuation. " + result.body;
      }
      state.ended = true;
      state.ending = result;
      state.phase = "ended";
      pushLog(state, "Run ends: collapse reached " + LD.MAX_COLLAPSE + " — " + result.kind + ".");
    }
  }

  function applyIncomingInstalls(state) {
    var fired = [];
    var keep = [];
    state.pending.forEach(function (item) {
      if (!item.install || item.due > state.turn) {
        keep.push(item);
        return;
      }
      var notes = [];
      grantSystem(state, item.install, notes);
      var text = item.log || (item.source + " arrives.");
      if (notes.length) text += " " + notes.join(", ") + ".";
      pushLog(state, text);
      fired.push({ source: item.source, text: text, item: item });
    });
    state.pending = keep;
    return fired;
  }

  function closeQuarter(state, opts) {
    state = deepClone(state);
    if (state.ended) return { ok: false, error: "Run already ended.", state: state };
    if (state.phase === "deal" || !state.dealPickedThisTurn) {
      return { ok: false, error: "Choose a deal before closing the quarter.", state: state };
    }
    var fired = (LD.fyPreClose ? LD.fyPreClose(state, opts) : []).concat(applyPendingDue(state));
    var worldEvents = LD.spreadCrises ? LD.spreadCrises(state) : [];
    worldEvents = worldEvents.concat(LD.resolveWorldQuarter ? LD.resolveWorldQuarter(state) : []);
    if (LD.resolveRivals) worldEvents = worldEvents.concat(LD.resolveRivals(state));
    worldEvents.forEach(function (ev) { fired.push({ text: ev.text, source: "map", world: ev }); });
    maybeEnd(state);
    if (state.ended) return { ok: true, state: state, fired: fired, ended: true, world: worldEvents };

    var tick = collapseTickAmount(state);
    state.collapse = clamp(state.collapse + tick, 0, LD.MAX_COLLAPSE);
    pushLog(state, "Quarter closes. Collapse drifts +" + tick + ".");
    maybeEnd(state);
    if (!state.ended && LD.fyYearEnd) LD.fyYearEnd(state);
    if (state.ended) return { ok: true, state: state, fired: fired, ended: true, tick: tick, world: worldEvents };

    state.turn += 1;
    state.phase = "deal";
    state.ap = LD.AP_PER_TURN;
    state.dealPickedThisTurn = false;
    state.bunkerActedThisTurn = false;
    state.lastDealId = null;
    state.lastBunkerAction = null;
    var rng = rngFrom(state);
    offerDeals(state, rng);
    state.rngState = rng.state();
    var sniped = LD.rivalsSnipe ? LD.rivalsSnipe(state) : null;
    if (LD.worldAfterClose) LD.worldAfterClose(state);
    var arrivals = applyIncomingInstalls(state);
    if (arrivals.length) fired = fired.concat(arrivals);
    pushLog(state, "Q" + state.turn + " opens.");
    var draft = LD.fyAfterClose ? LD.fyAfterClose(state) : null;
    return { ok: true, state: state, fired: fired, ended: false, tick: tick, world: worldEvents, sniped: sniped, draft: draft };
  }

  function attemptEvacuation(state) {
    state = deepClone(state);
    if (state.ended) return { ok: false, error: "Run already ended.", state: state };
    if (state.phase !== "bunker") return { ok: false, error: "Choose a deal first.", state: state };
    if (state.turn < LD.MIN_EVAC_TURN) {
      return { ok: false, error: "The bunker cannot be sealed before quarter " + LD.MIN_EVAC_TURN + ".", state: state };
    }
    var result = evacuationResult(state);
    state.ended = true;
    state.ending = result;
    state.phase = "ended";

  <script>
/* Last Dividend — pure render helpers. Browser + Node. No DOM writes. */
(function (root) {
  var LD = root.LD || (root.LD = {});

  var DISCOUNT_RULE =
    "You can seal from quarter 9, after the Act II boss. A working bunker needs all four systems at Lv 2 or higher, and those systems must hold. Sound contractors cost more and will hold. Discount contractors are cheaper, but a discount system at Lv 2 will fail at evacuation unless you have hired a chief engineer or raised that system to Lv 3.";

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function assetUrl(name) {
    if (LD.ASSETS && LD.ASSETS[name]) return LD.ASSETS[name];
    return "assets/" + name + ".webp";
  }

  function dealArtKey(dealId) {
    if (LD.DEAL_ART && LD.DEAL_ART[dealId]) return LD.DEAL_ART[dealId];
    return null;
  }

  function systemStatus(state, systemId) {
    var sys = state.bunker[systemId];
    if (!sys || sys.level <= 0) return "empty";
    if (sys.level < LD.WIN_LEVEL) return "incomplete";
    if (LD.systemReliable(state, systemId)) return "ready";
    return "risk";
  }

  function installedName(systemId, level) {
    if (!level) return "";
    var table = LD.UPGRADES[systemId];
    return table && table[level - 1] ? table[level - 1].name : "";
  }

  function qualityLabel(q) {
    return q === "cheap" ? "discount" : "sound";
  }

  function inboundFor(state, systemId) {
    return LD.pendingInstallFor ? LD.pendingInstallFor(state, systemId) : null;
  }

  function systemDetail(state, systemId, compact) {
    var sys = state.bunker[systemId];
    var status = systemStatus(state, systemId);
    var inbound = inboundFor(state, systemId);
    if (inbound && inbound.install) {
      var due = inbound.due;
      if (compact) return "arrives Q" + due;
      return "shipment in transit · arrives Q" + due + " · will not count if you seal first";
    }
    if (status === "empty") return "Not installed";
    var name = installedName(systemId, sys.level);
    var q = qualityLabel(sys.quality);
    if (compact) {
      if (status === "ready") return (name ? name + " · " : "") + q;
      if (status === "risk") return q + " · at risk";
      return (name ? name + " · " : "") + q;
    }
    if (status === "ready") return name + " · " + q + " · will hold";
    if (status === "risk") return name + " · " + q + " · at risk (hire an engineer or raise to Lv 3)";
    return name + " · " + q + " · not ready (need Lv 2)";
  }

  function readinessSummary(state) {
    var lines = [];
    var ready = 0, risk = 0, incomplete = 0, empty = 0;
    LD.SYSTEMS.forEach(function (s) {
      var st = systemStatus(state, s.id);
      var sys = state.bunker[s.id];
      if (st === "ready") ready += 1;
      else if (st === "risk") risk += 1;
      else if (st === "incomplete") incomplete += 1;
      else empty += 1;
      lines.push({
        id: s.id,
        name: s.name,
        level: sys.level,
        status: st,
        text: s.name + " — Lv " + sys.level + " · " + systemDetail(state, s.id, false)
      });
    });
    var missing = incomplete + empty;
    return {
      ready: ready,
      risk: risk,
      incomplete: incomplete,
      empty: empty,
      missing: missing,
      canWin: ready === 4 && risk === 0 && missing === 0,
      sealAvailable: state.turn >= LD.MIN_EVAC_TURN && state.phase === "bunker" && !state.ended,
      engineer: !!state.engineer,
      lines: lines,
      tally: "Ready " + ready + " of 4" +
        (missing ? " · " + missing + " incomplete" : "") +
        (risk ? " · " + risk + " at risk" : "") +
        (state.engineer ? " · chief engineer retained" : ""),
      rule: DISCOUNT_RULE
    };
  }

  function barPct(n, max) {
    return Math.max(0, Math.min(100, Math.round((n / max) * 100)));
  }

  function renderChrome(state) {
    var exec = LD.execById(state.executiveId);
    var html = '<div class="chrome">';
    html += "<div><div class='kicker'>" + escapeHtml(exec.firm) + "</div>";
    html += "<h2>" + escapeHtml(exec.name) + "</h2>";
    html += "<div class='who'>" + escapeHtml(exec.title) + " · seed " + escapeHtml(String(state.seedLabel)) + "</div></div>";
    html += "<div class='q-badge' aria-label='Quarter " + state.turn + "'>Q" + state.turn + "</div></div>";

    html += '<div class="stats">';
    html += statBox("cash", "Cash", state.cash, 100);
    html += statBox("unrest", "Unrest", state.unrest, LD.MAX_UNREST);
    html += statBox("collapse", "Collapse", state.collapse, LD.MAX_COLLAPSE);
    html += "</div>";
    var fc = LD.forecastQuarters(state);
    html += '<p class="forecast">At the current drift, breach in about ' + fc + " quarter" + (fc === 1 ? "" : "s") + ". Delayed deals are not included in this estimate.</p>";
    return html;
  }

  function statBox(cls, label, val, max) {
    var h = '<div class="stat ' + cls + '"><div class="lbl">' + label + '</div><div class="val">' + val + "</div>";
    h += '<div class="bar" aria-hidden="true"><span style="width:' + barPct(val, max) + '%"></span></div></div>';
    return h;
  }

  function renderChips(state) {
    var html = '<div class="chips" aria-label="Bunker systems">';
    LD.SYSTEMS.forEach(function (s) {
      var st = systemStatus(state, s.id);
      var sys = state.bunker[s.id];
      var installed = sys.level > 0;
      html += '<div class="chip ' + st + '"><div class="nm' + (installed ? " accent" : "") + '">' + escapeHtml(s.name) + "</div>";
      html += '<div class="lv">Lv ' + sys.level + "</div>";
      html += '<div class="q">' + escapeHtml(systemDetail(state, s.id, true)) + "</div></div>";
    });
    html += "</div>";
    return html;
  }

  function renderPending(state) {
    if (!state.pending || !state.pending.length) return "";
    var parts = state.pending.map(function (p) {
      var bits = [escapeHtml(p.source) + " due Q" + p.due];
      if (p.install) bits.push("shipment for " + p.install.id + " L" + p.install.level);
      if (p.strain) {
        Object.keys(p.strain).forEach(function (g) {
          bits.push(g + " network tightens");
        });
      }
      return bits.join(" — ");
    });
    return '<div class="pending"><strong>Still outstanding.</strong> ' + parts.join(" · ") + "</div>";
  }

  function renderContracts(state) {
    if (LD.ensureSupply) LD.ensureSupply(state);
    var html = '<section class="contracts" aria-label="Public supply contracts">';
    html += '<div class="kicker">Public networks you still buy from</div>';
    if (state.converting) {
      html += '<p class="convert-banner">Private supply conversion is active. Further deals pay ' + Math.round(LD.conversionRate(state) * 100) + '% cash. Installs ignore network damage and arrive this quarter.</p>';
    }
    html += '<div class="contract-grid">';
    LD.SYSTEMS.forEach(function (s) {
      var level = LD.gridLevel ? LD.gridLevel(state, s.id) : 0;
      var label = LD.gridLabel ? LD.gridLabel(level) : "clear";
      var inbound = inboundFor(state, s.id);
      var coming = "";
      (state.pending || []).forEach(function (item) {
        if (item.strain && item.strain[s.id]) coming = "tightens Q" + item.due;
        if (item.ease && item.ease[s.id]) coming = "eases Q" + item.due;
      });
      html += '<div class="contract ' + label + '"><div class="nm">' + escapeHtml(s.name) + "</div>";
      html += '<div class="lv">' + escapeHtml(label) + "</div>";
      if (coming) html += '<div class="q">' + escapeHtml(coming) + "</div>";
      else if (inbound) html += '<div class="q">shipment Q' + inbound.due + "</div>";
      else if (level >= 2) html += '<div class="q">+14 and delayed</div>';
      else if (level >= 1) html += '<div class="q">+8 to install</div>';
      else html += '<div class="q">clear rate</div>';
      html += "</div>";
    });
    html += "</div></section>";
    return html;
  }

    if (pts[pts.length - 1] !== state.cash) pts.push(state.cash);
    if (pts.length < 2) pts.unshift(pts[0] || 0);

    var step = w / (pts.length - 1);

  function ghostItem(state, dealId, choiceId) {

    function f(n) { return n > 0 && dm !== 1 ? Math.round(n * dm) : (n || 0); }
    return { due: state.turn + dl.turns + bonus, unrest: f(dl.unrest), collapse: f(dl.collapse), cash: dl.cash || 0, effectsIf: dl.effectsIf, grantSystem: dl.grantSystem, ghost: true };
  }
  function renderRail(state, dealId, choiceId) {

      if (!bq && i === cols - 1 && LD.nextBossQ) { var nb = LD.nextBossQ(state); if (nb && nb > q) bq = LD.bossInfo(state, nb); }
      if (bq) marks.push('<button class="rm boss" data-boss-q="' + bq.q + '">' + bq.icon + " " + esc(bq.name.replace(/^The /, "")) + (bq.q !== q ? " Q" + bq.q : "") + "</button>");
