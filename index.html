:root {
  --teal: rgb(10, 70, 78);
  --teal-deep: rgb(8, 50, 56);
  --teal-mid: rgb(16, 90, 98);
  --chip: rgb(10, 58, 66);
  --ink: rgb(18, 44, 50);
  --ink-muted: rgb(64, 86, 88);
  --ochre: rgb(201, 148, 40);
  --coral: rgb(224, 90, 72);
  --coral-deep: rgb(184, 62, 50);
  --cream: rgb(248, 236, 210);
  --cream-panel: rgb(251, 243, 224);
  --paper: rgb(252, 245, 228);
  --ground: rgb(236, 220, 186);
  --font-serif: "Playfair Display", Palatino, "Palatino Linotype", Georgia, serif;
  --font-slab: "Zilla Slab", Palatino, Georgia, serif;
  --font-sans: "Source Sans Pro", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --tap: 48px;
  --tap-min: 44px;
  --pad: clamp(16px, 3.2vw, 28px);
  --radius: 12px;
  --text: 17px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text);
  line-height: 1.45;
}
body {
  min-height: 100dvh;
  background-image: radial-gradient(rgba(10, 70, 78, 0.12) 1.05px, transparent 1.2px);
  background-size: 9px 9px;
  background-attachment: fixed;
}
button, input { font: inherit; color: inherit; }
button {
  appearance: none;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
img { max-width: 100%; display: block; }

.shell {
  width: min(740px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.page {
  position: relative;
  min-height: calc(100dvh - 20px);
  background: var(--cream);
  border: 2px solid var(--teal);
  border-radius: 4px;
  overflow: auto;
}
.page::before, .page::after {
  content: "";
  position: absolute;
  pointer-events: none;
  width: 14px;
  height: 14px;
  border: 2px solid var(--teal);
  z-index: 5;
}
.page::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.page::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.page.play, .page.inner { background: var(--ground); background-image: radial-gradient(rgba(10, 70, 78, 0.12) 1.05px, transparent 1.2px); background-size: 9px 9px; }
.page-inner { padding: 18px var(--pad) 28px; }

.screen { display: none; }
.screen.on { display: block; }

.kicker {
  font-size: 16px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ochre);
}
.muted { color: var(--ink-muted); }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 700; letter-spacing: -0.02em; margin: 0; color: var(--teal); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--paper);
  color: var(--teal);
  font-weight: 600;
  font-size: 17px;
  text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.btn-coral {
  background: var(--coral);
  border-color: var(--coral);
  color: var(--cream-panel);
  font-weight: 700;
}
.btn-ochre {
  background: var(--ochre);
  border-color: var(--ochre);
  color: var(--teal-deep);
  font-weight: 700;
}
.btn-teal {
  background: var(--teal);
  border-color: var(--teal);
  color: var(--cream-panel);
  font-weight: 700;
}
.btn-danger {
  background: var(--paper);
  border-color: var(--coral);
  color: var(--coral-deep);
}
.btn-ghost {
  background: transparent;
  border-color: rgba(16, 90, 98, 0.45);
  color: var(--ink-muted);
}
.btn-row { display: grid; gap: 10px; margin-top: 12px; }
.btn-row.split { grid-template-columns: 1fr 1fr; }
.field-label {
  display: block;
  font-size: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 14px 0 6px;
  font-weight: 600;
}
.seed-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}
.seed-row input {
  min-height: var(--tap);
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--paper);
  padding: 0 14px;
  width: 100%;
  font-size: 17px;
}
.footer-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}

/* Title: HTML wordmark sits above the art, not over it. */
.title-page { display: flex; flex-direction: column; min-height: calc(100dvh - 20px); background: var(--cream); }
.title-copy {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 28px 24px 16px;
  color: var(--teal);
  background: var(--cream);
  flex: 0 0 auto;
}
.title-art {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  flex: 0 0 auto;
  aspect-ratio: 900 / 720;
  overflow: hidden;
  background: var(--cream);
}
.title-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
  object-position: center center;
}
.title-copy .kicker { color: var(--teal); letter-spacing: 0.18em; font-weight: 700; font-size: 16px; }
.title-copy h1 {
  font-size: clamp(48px, 14vw, 86px);
  line-height: 0.86;
  margin: 12px 0 10px;
  color: var(--teal);
}
.title-copy h1 .it {
  display: block;
  font-style: italic;
  font-weight: 600;
  font-size: 0.62em;
  line-height: 1;
}
.title-copy h1::after {
  content: "";
  display: block;
  width: 72px;
  height: 2px;
  background: var(--ochre);
  margin: 12px auto 0;
}
.tagline {
  font-family: var(--font-slab);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(18px, 3.4vw, 22px);
  color: var(--coral);
  margin: 12px 0 0;
}
.title-panel {
  position: relative;
  z-index: 2;
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  margin-top: 0;
  padding: 22px 18px max(22px, env(safe-area-inset-bottom));
  box-shadow: 0 -10px 28px rgba(8, 50, 56, 0.14);
}
.demo-note {
  margin: 14px 0 0;
  font-size: 16px;
  color: var(--ink-muted);
  text-align: center;
}

/* Inner brochure pages */
.inner-head { padding: 8px 0 16px; }
.inner-head h2 { font-size: clamp(28px, 6vw, 36px); margin-top: 6px; }
.exec-list { display: grid; gap: 12px; }
.exec-card {
  text-align: left;
  padding: 16px;
  min-height: 96px;
  border-radius: var(--radius);
  border: 2px solid var(--teal);
  background: var(--paper);
}
.exec-card:active { transform: translateY(1px); }
.exec-card.on { box-shadow: inset 0 0 0 2px var(--coral); border-color: var(--coral); }
.exec-card.locked { opacity: 0.55; }
.exec-card .name { font-family: var(--font-serif); font-size: 24px; color: var(--teal); }
.exec-card .firm { color: var(--ochre); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; margin: 4px 0 8px; font-weight: 600; }
.exec-card p { margin: 0; color: var(--ink-muted); font-size: 16px; }
.dots { display: flex; gap: 8px; margin: 16px 0; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(10, 70, 78, 0.25); display: block; }
.dots i.on { background: var(--coral); }

/* Play chrome */
.chrome {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 12px;
  background: var(--teal);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--cream);
  min-height: 82px;
}
.chrome .kicker { color: var(--ochre); margin-bottom: 2px; }
.chrome .who { font-size: 16px; color: var(--cream); }
.chrome h2 { font-family: var(--font-sans); font-weight: 700; font-size: 22px; color: var(--cream); letter-spacing: 0; }
.q-badge {
  flex: 0 0 62px;
  width: 62px;
  min-height: 54px;
  border-radius: 8px;
  background: var(--coral);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 22px;
  box-shadow: inset 0 0 0 2px var(--cream);
  margin: 4px 0;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}
.stat {
  background: var(--teal);
  border-radius: 10px;
  padding: 10px 10px 8px;
  color: var(--cream);
  min-height: 86px;
  overflow: hidden;
  position: relative;
}
.stat::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 5px;
  background: var(--coral);
}
.stat.cash::before { background: var(--ochre); }
.stat .lbl {
  font-size: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--cream);
}
.stat .val {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin: 2px 0 8px;
  color: var(--cream);
}
.bar {
  height: 7px;
  border-radius: 99px;
  background: var(--teal-deep);
  overflow: hidden;
}
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--coral); }
.stat.cash .bar > span { background: var(--ochre); }
.forecast {
  font-family: var(--font-slab);
  font-style: italic;
  font-size: 17px;
  color: var(--ink);
  margin: 4px 0 12px;
}

.hero-frame {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  height: clamp(180px, 32vw, 280px);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--teal-deep);
}
.hero-frame.deal {
  height: auto;
  aspect-ratio: 960 / 540;
  background: var(--cream);
}
.hero-frame.bunker { height: clamp(170px, 30vw, 260px); }
.hero-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
}
.hero-frame.deal img {
  object-fit: contain;
  object-position: center center;
}
.hero-frame.bunker img { object-position: center center; }
.chips {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 0 0 12px;
}
.chip {
  background: var(--chip);
  border: 2px solid var(--cream);
  border-radius: 8px;
  padding: 6px 6px 5px;
  color: var(--cream);
  min-height: 62px;
  text-align: left;
}
.chip .nm { font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.chip .lv { font-size: 18px; font-weight: 700; line-height: 1.15; }
.chip .q { font-size: 16px; line-height: 1.15; opacity: 0.95; }
.chip.ready { border-color: var(--ochre); }
.chip.risk { border-color: var(--coral); }
.chip.incomplete { border-color: var(--coral); }
.chip .nm.accent { color: var(--coral); }

.pending {
  margin: 0 0 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--teal);
  color: var(--cream);
  font-size: 16px;
}
.pending strong { color: var(--ochre); font-weight: 700; }

.banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: var(--teal);
  color: var(--cream);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 0 0 12px;
  min-height: var(--tap-min);
}
.banner h2 { font-family: var(--font-sans); font-size: 18px; font-weight: 700; color: var(--cream); letter-spacing: 0; }
.banner .ap { font-size: 16px; color: var(--cream); font-weight: 600; }

.deals { display: grid; gap: 12px; }
.deal {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  text-align: left;
  border-radius: 12px;
  border: 2px solid var(--teal);
  background: var(--paper);
  padding: 0;
  min-height: 112px;
  overflow: hidden;
  position: relative;
}
.deal-layout {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 12px;
  width: 100%;
  min-height: 112px;
  align-items: stretch;
}
.deal:active { transform: translateY(1px); }
.deal::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--coral);
}
.deal.crisis::before { width: 6px; }
.deal-art, .deal-fallback {
  width: 92px;
  min-width: 92px;
  min-height: 112px;
  object-fit: cover;
  height: 100%;
  max-width: none;
  background: var(--teal-deep);
}
.deal-fallback {
  /* Decorative tile only — category text lives in .deal-body so it cannot clip. */
  display: block;
  padding: 0;
  background:
    radial-gradient(circle at 70% 22%, var(--coral) 0 16px, transparent 17px),
    linear-gradient(160deg, var(--teal-mid), var(--teal-deep));
}
.deal-body { padding: 12px 14px 12px 0; min-width: 0; }
.deal-body .kicker { font-size: 16px; color: var(--coral); letter-spacing: 0.08em; overflow-wrap: anywhere; }
.deal-body h3 { font-family: var(--font-sans); font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: 0; margin: 2px 0 6px; text-transform: none; }
.deal-body p { margin: 0 0 8px; color: var(--ink-muted); font-size: 16px; }
.deal-body .hint { font-size: 16px; color: var(--ink); border-top: 1px solid rgba(18, 44, 50, 0.16); padding-top: 8px; }
.deal[disabled] { opacity: 0.45; pointer-events: none; }
.choices { display: grid; gap: 8px; margin-top: 10px; grid-column: 1 / -1; padding: 0 12px 12px; }
.choice {
  text-align: left;
  min-height: var(--tap);
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--cream-panel);
}
.choice:active { transform: translateY(1px); }
.choice strong { display: block; margin-bottom: 2px; font-size: 17px; }
.choice span { color: var(--ink-muted); font-size: 16px; }

.upgrade {
  border: 2px solid var(--teal);
  background: var(--paper);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.upgrade h3 { font-family: var(--font-sans); font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: 0; margin-bottom: 4px; }
.upgrade .meta { color: var(--ink-muted); font-size: 16px; margin-bottom: 10px; }

.readiness {
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 12px;
  padding: 14px;
  margin: 0 0 14px;
}
.readiness h3 { font-family: var(--font-sans); font-size: 18px; color: var(--teal); letter-spacing: 0; margin-bottom: 8px; }
.readiness p, .readiness li { font-size: 16px; margin: 0 0 8px; color: var(--ink); }
.readiness ul { margin: 0 0 8px; padding: 0; list-style: none; }
.readiness li { padding: 6px 0 6px 12px; border-left: 4px solid var(--ink-muted); }
.readiness li.ready { border-color: var(--ochre); }
.readiness li.risk { border-color: var(--coral); }
.readiness li.incomplete, .readiness li.empty { border-color: var(--ink-muted); }
.readiness .tally { font-weight: 700; margin: 0; }

.log { margin-top: 16px; color: var(--ink-muted); font-size: 16px; }
.log ul { margin: 8px 0 0; padding: 0; }
.log li { list-style: none; margin: 0 0 6px; }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(8, 50, 56, 0.78);
  padding: max(24px, env(safe-area-inset-top)) 18px 28px;
  overflow: auto;
}
.overlay.on { display: block; }
.overlay .panel {
  width: min(560px, 100%);
  margin: 8vh auto 0;
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 14px;
  padding: 20px 18px;
}
.overlay .panel h2 { margin-bottom: 10px; font-size: 28px; }
.overlay .panel p { color: var(--ink); font-size: 16px; }

.end-mark {
  font-size: 16px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 10px;
}
.end-mark.win { color: var(--ochre); }
.end-mark.lose { color: var(--coral-deep); }
.end-hero { position: relative; display: block; width: 100%; height: 180px; border-radius: 10px; overflow: hidden; margin: 14px 0; background: var(--teal-deep); }
.end-hero img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center center; }
.end-hero.diagram { height: auto; aspect-ratio: 900 / 720; background: var(--cream); }
.end-hero.diagram img { object-fit: contain; }
.history ul { margin: 0; padding: 0; }
.history li {
  list-style: none;
  padding: 12px 0;
  border-bottom: 1px solid rgba(10, 70, 78, 0.18);
  color: var(--ink-muted);
  font-size: 16px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}


.contracts {
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 10px;
  padding: 12px;
  margin: 0 0 12px;
}
.contracts > .kicker { color: var(--coral); margin-bottom: 8px; }
.contract-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.contract {
  border: 2px solid var(--teal);
  border-radius: 8px;
  padding: 8px;
  background: var(--cream);
  min-height: 72px;
}
.contract .nm {
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.contract .lv { font-size: 16px; font-weight: 700; color: var(--teal); }
.contract .q { font-size: 16px; color: var(--ink-muted); }
.contract.strained { border-color: var(--ochre); }
.contract.strained .lv { color: var(--ochre); }
.contract.disrupted { border-color: var(--coral); }
.contract.disrupted .lv { color: var(--coral); }
.convert-banner {
  background: var(--teal);
  color: var(--cream);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 16px;
  margin: 0 0 10px;
}
.convert-panel { border-color: var(--ochre); }

@media (max-width: 520px) {
  .chips { grid-template-columns: 1fr 1fr; }
  .contract-grid { grid-template-columns: 1fr 1fr; }
  .hero-frame.bunker {
    height: clamp(240px, 62vw, 360px);
  }
}

.tutorial-page {
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - 20px);
}
.tutorial-page .page-inner {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.tutorial-copy {
  flex: 1 1 auto;
}
.tutorial-page .btn-row {
  flex: 0 0 auto;
  margin-top: auto;
  position: sticky;
  bottom: 0;
  padding-top: 16px;
  min-height: calc(16px + var(--tap) * 2 + 10px);
  align-content: start;
  background: linear-gradient(to top, var(--ground) 70%, rgba(236, 220, 186, 0));
}

/* =====================================================================
   World-map desk (sunny corporate gloss). Touch-first, landscape + portrait.
   ===================================================================== */
:root {
  --sun: #ffd36a;
  --glass: rgba(255, 252, 244, 0.86);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --teal-glow: #19b3a6;
  --shadow: 0 10px 28px rgba(80, 48, 12, 0.22), 0 2px 6px rgba(80, 48, 12, 0.18);
  --good: #0f8a6a;
  --bad: #d2493a;
}
body.on-desk { background: #e8c48f; }
body.on-desk .shell { width: 100%; max-width: none; padding: 0; }
.desk {
  position: relative;
  min-height: 100dvh;
  display: grid;
  gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  grid-template-columns: 1fr;
  grid-template-areas: "head" "board" "dash" "hand" "dos";
  background:
    radial-gradient(120% 70% at 85% -10%, rgba(255, 244, 200, 0.95), rgba(255, 244, 200, 0) 60%),
    repeating-linear-gradient(94deg, rgba(120, 72, 24, 0.05) 0 2px, transparent 2px 22px),
    linear-gradient(180deg, #f6dcab 0%, #e7bd83 55%, #d9a76b 100%);
  overflow-x: clip;
  color: var(--ink);
}
.desk-light {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.0) 0 80px, rgba(255, 255, 255, 0.14) 80px 150px, rgba(255, 255, 255, 0) 150px 260px);
  animation: beams 18s ease-in-out infinite alternate;
}
@keyframes beams { from { background-position: 0 0; } to { background-position: 160px 0; } }
.desk > * { position: relative; z-index: 1; }
.desk-head { grid-area: head; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { text-align: left; }
.wordmark {
  font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.04em;
  font-size: clamp(28px, 4.2vw, 46px); line-height: 1; color: var(--teal);
  text-shadow: 0 2px 0 #fff6dc, 0 4px 10px rgba(10, 70, 78, 0.25);
  position: relative; display: inline-block;
}
.wordmark .sun {
  position: absolute; right: -40px; top: -18px; width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle, #fff3b0 0 35%, var(--sun) 36% 60%, rgba(255, 211, 106, 0) 62%);
  box-shadow: 0 0 22px 6px rgba(255, 211, 106, 0.7);
  animation: sunspin 6s linear infinite;
}
@keyframes sunspin { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.tag { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #a36a10; font-size: 16px; margin-top: 4px; }
.head-right { display: flex; align-items: center; gap: 10px; }
.q-chip {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 70px; min-height: 56px; padding: 4px 12px; border-radius: 14px;
  background: linear-gradient(180deg, #13606a, var(--teal-deep)); color: #fff; font-weight: 700; font-size: 26px; line-height: 1;
  box-shadow: var(--shadow);
}
.q-chip small { font-size: 16px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.8; text-transform: uppercase; margin-bottom: 2px; }
.icon-btn {
  min-width: 52px; min-height: 52px; border-radius: 14px; font-size: 24px; color: var(--teal);
  background: var(--glass); box-shadow: var(--shadow);
}
.panel {
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 12px; text-align: left;
}
.panel-k, .dz-k {
  font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal);
}

/* ---- Board / map ---- */
.board { grid-area: board; position: relative; min-height: 0; display: flex; flex-direction: column; align-items: stretch; }
.board-tilt { perspective: 1500px; flex: 1; min-height: 0; display: flex; }
.board-slab {
  flex: 1; min-height: 0; position: relative; overflow: hidden; background: #2a9bb5;
  transform: rotateX(16deg) scale(0.98); transform-origin: 50% 100%;
  border-radius: 26px; padding: 6px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.25));
  box-shadow: 0 14px 0 -2px #0b4f5e, 0 34px 40px -14px rgba(70, 38, 6, 0.6), 0 0 0 5px rgba(255, 255, 255, 0.55) inset;
  padding: 0;
}
.board-slab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.5), inset 0 0 40px rgba(6, 50, 70, 0.45); pointer-events: none; z-index: 2; }
.map { display: block; width: 100%; height: 100%; aspect-ratio: 2 / 1; }
.map .waves { animation: waves 9s linear infinite; opacity: 0.9; }
@keyframes waves { from { transform: translate(0, 0); } to { transform: translate(40px, 0); } }
.map .glare { mix-blend-mode: screen; animation: glare 12s ease-in-out infinite alternate; }
@keyframes glare { from { transform: translate(-80px, -10px); opacity: 0.65; } to { transform: translate(120px, 20px); opacity: 1; } }
.map .grat { fill: none; stroke: #fff; stroke-opacity: 0.16; stroke-width: 1; }
.map .route { fill: none; stroke: #fff; stroke-opacity: 0.35; stroke-width: 2; stroke-dasharray: 3 8; stroke-linecap: round; }
.map .route.live { stroke: #ffe39a; stroke-opacity: 0.95; stroke-width: 3; stroke-dasharray: 10 10; animation: dash 2.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -40; } }
.map .region { cursor: pointer; transition: transform 0.45s cubic-bezier(.2,1.4,.4,1); }
.map .region .side { fill: #8b6a3c; }
.map .region .top { fill: url(#mg-land); stroke: #fffaf0; stroke-width: 1.4; transition: fill 0.4s; }
.map .region .dots { pointer-events: none; opacity: 0.8; }
.map .region.owned { transform: translate(0, -5px); }
.map .region.owned .side { fill: #064a4f; }
.map .region.owned .top { fill: url(#mg-own); stroke: #b8fff4; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(25, 179, 166, 0.9)); }
.map .region.s-strike:not(.owned) .top, .map .region.t-crisis:not(.owned) .top { fill: url(#mg-burn); }
.map .region.owned.s-strike .top { stroke: #ff8a6a; stroke-width: 3; }
.map .region.sel .top { stroke: var(--coral); stroke-width: 4; }
.map .region.claimed .top { animation: claimflash 1.2s ease-out; }
@keyframes claimflash { 0% { fill: #fff; } 40% { fill: #7ff2e3; } 100% { } }
.map .region.ev-revolt { animation: shudder 0.6s ease-in-out 2; }
.map .region.ev-income .top { animation: incomeflash 0.9s ease-out; }
@keyframes incomeflash { 30% { fill: #ffe39a; } }
@keyframes shudder { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 0); } 75% { transform: translate(4px, 0); } }
.map .borders { fill: none; stroke: #6a4a20; stroke-opacity: 0.18; stroke-width: 0.7; pointer-events: none; }
.map .rlabel { font-family: var(--font-sans); font-weight: 700; font-size: 17px; letter-spacing: 0.08em; fill: #5b3f14; paint-order: stroke; stroke: #fff4d8; stroke-width: 4px; pointer-events: none; }
.map .rlabel.own { fill: #04454a; stroke: #d9fff8; }
.map .rtag { font-family: var(--font-sans); font-weight: 700; font-size: 16px; letter-spacing: 0.1em; fill: #0f8a6a; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.map .anc { fill: none; }
.map .props, .map .traffic { pointer-events: none; }
.map .ship { filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.3)); }
.map .plane { opacity: 0.9; }
.map .flag .cloth { transform-origin: 0 -12px; animation: wave 1.6s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
.map .plant .steam { animation: steam 2.4s ease-out infinite; opacity: 0.8; }
@keyframes steam { from { transform: translate(0, 0) scale(0.6); opacity: 0.85; } to { transform: translate(4px, -14px) scale(1.5); opacity: 0; } }
.map .plant.off { filter: grayscale(0.8) brightness(0.85); }
.map .hz.fire { animation: flicker 0.9s ease-in-out infinite alternate; transform-origin: 0 6px; }
@keyframes flicker { from { transform: scale(0.92, 0.9); } to { transform: scale(1.08, 1.12); } }
.map .hz.storm .spin { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.map .hz.flood { animation: bob 2s ease-in-out infinite; }
.map .hz.drought { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.map .protest .sign { animation: bob 0.8s ease-in-out infinite; }
.map .protest.hot .sign rect { fill: #ffd2c4; stroke: var(--bad); }

/* Deal pins */
.map .pin { cursor: pointer; }
.map .pin .hit { fill: transparent; }
.map .pin-body { animation: pindrop 0.7s cubic-bezier(.2,1.6,.4,1) both, pinbob 2.4s ease-in-out 0.8s infinite; animation-delay: calc(var(--i) * 0.15s), calc(0.8s + var(--i) * 0.3s); }
@keyframes pindrop { from { transform: translateY(-120px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pinbob { 50% { transform: translateY(-5px); } }
.map .pin .drop { fill: #fffaf0; stroke: #a36a10; stroke-width: 3; filter: drop-shadow(0 4px 3px rgba(60, 30, 0, 0.35)); }
.map .pin.k-claim .drop { fill: #fff3c4; stroke: var(--teal); }
.map .pin.k-squeeze .drop { fill: #ffe7a6; stroke: #a36a10; }
.map .pin.k-calm .drop { fill: #e3fbf1; stroke: var(--good); }
.map .pin.k-crisis .drop { fill: #ffd9cf; stroke: var(--bad); }
.map .pin .glyph { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: var(--teal); dominant-baseline: central; transform: translateY(-8px); pointer-events: none; }
.map .pin.k-crisis .glyph { fill: var(--bad); }
.map .pin.k-squeeze .glyph { fill: #8a5508; }
.map .pin.k-calm .glyph { fill: var(--good); }
.map .pin .ring { fill: none; stroke: #fff; stroke-width: 3; opacity: 0; transform: translateY(-8px); }
.map .pin.sel .drop { fill: var(--coral); stroke: #fff; }
.map .pin.sel .glyph { fill: #fff; }
.map .pin.sel .ring, .map .pin.coach .ring { animation: ring 1.4s ease-out infinite; }
.map .pin.coach .ring { stroke: #ffe39a; stroke-width: 5; }
@keyframes ring { from { r: 20; opacity: 0.95; } to { r: 52; opacity: 0; } }

.phase-pill {
  align-self: center; margin-top: -4px; padding: 6px 16px; border-radius: 999px;
  background: rgba(10, 70, 78, 0.9); color: #fff; font-weight: 600; font-size: 16px; box-shadow: var(--shadow);
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
.float {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-weight: 700; font-size: 20px; padding: 4px 12px; border-radius: 999px; color: #fff;
  background: var(--teal); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
  animation: floatup 2.2s ease-out both;
}
.float.cash { background: linear-gradient(180deg, #ffcf4a, #e39a12); color: #3b2500; }
.float.cost { background: #5b6b6e; }
.float.bad { background: var(--bad); }
.float.good { background: var(--good); }
.float.own { background: var(--teal-glow); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.08); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
.burst { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 4px solid var(--teal-glow); animation: burst 1.2s ease-out both; }
.burst.ev-revolt, .burst.ev-riot, .burst.ev-protest { border-color: var(--bad); }
.burst.ev-income { border-color: #ffcf4a; }
@keyframes burst { from { transform: scale(0.5); opacity: 1; } to { transform: scale(9); opacity: 0; } }
.stamp {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%) rotate(-8deg);
  font-weight: 700; font-size: clamp(40px, 7vw, 76px); color: var(--coral); letter-spacing: 0.06em;
  border: 6px solid var(--coral); border-radius: 14px; padding: 4px 26px; background: rgba(255, 250, 240, 0.85);
  animation: stamp 0.8s cubic-bezier(.2,1.4,.4,1) both;
}
.stamp span { font-size: 0.55em; text-transform: uppercase; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } }
.desk.closing .board-slab { animation: closeshake 0.5s ease-in-out; }
@keyframes closeshake { 30% { transform: rotateX(20deg) scale(0.96); } }

/* ---- Coach bubbles ---- */
.coach-bubble {
  position: absolute; z-index: 8; padding: 10px 16px; border-radius: 14px; background: var(--teal); color: #fff;
  font-weight: 700; font-size: 18px; box-shadow: var(--shadow); animation: coachbob 1.6s ease-in-out infinite; pointer-events: none;
  max-width: 280px; text-align: center;
}
.coach-bubble::after { content: ""; position: absolute; width: 16px; height: 16px; background: var(--teal); transform: rotate(45deg); }
.coach-bubble.c-pin { bottom: 44px; left: 50%; margin-left: -140px; width: 280px; }
.coach-bubble.c-pin::after { top: -7px; left: 132px; }
.coach-bubble.c-bunker { right: 14px; bottom: calc(100% - 4px); }
.coach-bubble.c-end { right: 14px; bottom: 112px; }
.coach-bubble.c-end::after, .coach-bubble.c-bunker::after { bottom: -7px; right: 40px; }
@keyframes coachbob { 50% { transform: translateY(-5px); } }

/* ---- Dash ---- */
.dash { grid-area: dash; display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-content: start; }
.dash-meters { grid-column: 1 / -1; }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.meter { background: #fff; border-radius: 12px; padding: 6px 10px 8px; box-shadow: inset 0 0 0 1px rgba(10, 70, 78, 0.12); }
.m-lbl { font-size: 16px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.m-val { font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--teal); font-variant-numeric: tabular-nums; }
.m-unrest .m-val { color: #b4570e; }
.m-collapse .m-val { color: var(--bad); }
.m-bar { height: 9px; border-radius: 9px; background: rgba(10, 70, 78, 0.1); overflow: hidden; margin-top: 4px; }
.m-bar span { display: block; height: 100%; border-radius: inherit; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.m-cash .m-bar span { background: linear-gradient(90deg, #f5c04a, #e39a12); }
.m-unrest .m-bar span { background: linear-gradient(90deg, #f5c04a, #e2722b); }
.m-collapse .m-bar span { background: linear-gradient(90deg, #f08a5d, var(--bad)); }
.m-sub { font-size: 16px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.rise .m-val, .meter.fall .m-val { animation: pulse 0.9s ease-out; }
@keyframes pulse { 30% { transform: scale(1.18); } }
.spark-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 8px; }
.spark-row .spark { width: 100%; height: 44px; display: block; }
.holdings { line-height: 1.2; text-align: right; }
.spark .area { fill: rgba(25, 179, 166, 0.16); }
.spark .line { fill: none; stroke: var(--good); stroke-width: 3; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark .line.down { stroke: var(--bad); }
.holdings { font-size: 16px; color: var(--ink-muted); }
.holdings b { color: var(--teal); }
.ticker { overflow: hidden; }
.tick-wrap { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.tick-run { display: inline-block; animation: ticker 40s linear infinite; font-size: 16px; padding-top: 4px; }
.tick-run span { margin-right: 36px; }
.tick-run span::before { content: "● "; color: var(--coral); }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.bunker-card { display: flex; flex-direction: column; gap: 4px; position: relative; cursor: pointer; transition: transform 0.2s; }
.bunker-card:active { transform: scale(0.98); }
.bunker-card.ready { box-shadow: var(--shadow), 0 0 0 3px var(--teal-glow); animation: readyglow 1.8s ease-in-out infinite; }
@keyframes readyglow { 50% { box-shadow: var(--shadow), 0 0 0 6px rgba(25, 179, 166, 0.35); } }
.cutaway { width: 100%; height: auto; display: block; border-radius: 10px; overflow: hidden; }
.cutaway .room rect:first-child { fill: #3d3328; stroke: #fff; stroke-width: 2; }
.cutaway .room.st-incomplete rect:first-child { fill: #c99428; }
.cutaway .room.st-risk rect:first-child { fill: var(--coral); }
.cutaway .room.st-ready rect:first-child { fill: var(--teal-glow); }
.cutaway .r-ico { font-size: 22px; font-weight: 700; fill: #fff; }
.cutaway .pip { fill: rgba(255, 255, 255, 0.3); }
.cutaway .pip.on { fill: #fff; }
.bc-cta { font-weight: 700; color: var(--teal); font-size: 16px; }
.bunker-card.ready .bc-cta { color: var(--coral-deep); }
.toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--teal); color: #fff;
  font-weight: 700; padding: 8px 16px; border-radius: 999px; white-space: nowrap; animation: floatup 2.2s ease-out both; font-size: 18px;
}

/* ---- Hand ---- */
.hand { grid-area: hand; display: grid; gap: 10px; grid-template-columns: 1fr; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card {
  position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: 2px 10px; align-items: start;
  min-height: 96px; padding: 10px 12px; text-align: left; border-radius: 16px; background: var(--glass); box-shadow: var(--shadow);
  border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s, opacity 0.3s;
}
.card:active { transform: translateY(2px); }
.card.sel { border-color: var(--coral); transform: translateY(-4px); }
.card.gone { opacity: 0.4; filter: grayscale(0.7); }
.card.taken { border-color: var(--teal-glow); }
.card.dealing { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); animation: coachbob 1.2s ease-in-out infinite; }
.c-ico { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; background: #fff3c4; color: var(--teal); }
.card.k-squeeze .c-ico { background: #ffe7a6; color: #8a5508; }
.card.k-calm .c-ico { background: #e3fbf1; color: var(--good); }
.card.k-crisis .c-ico { background: #ffd9cf; color: var(--bad); }
.c-txt { display: flex; flex-direction: column; min-width: 0; }
.c-k { font-size: 16px; font-weight: 700; color: #a36a10; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-t { font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--ink); }
.c-tag { justify-self: end; font-weight: 700; color: #fff; background: var(--coral); border-radius: 999px; padding: 2px 10px; font-size: 16px; }
.card.k-calm .c-tag { background: var(--good); }
.c-stamp { position: absolute; right: 10px; top: 8px; transform: rotate(8deg); border: 3px solid var(--teal-glow); color: var(--teal-glow); font-weight: 700; padding: 0 8px; border-radius: 6px; text-transform: uppercase; font-size: 16px; }
.end-q {
  position: relative; display: flex; align-items: center; gap: 14px; min-height: 84px; padding: 10px 20px; border-radius: 22px; text-align: left;
  color: #fff; background: linear-gradient(180deg, #b9b2a6, #8f877b); box-shadow: var(--shadow); transition: transform 0.15s, filter 0.2s;
}
.end-q.live { background: linear-gradient(180deg, #ff8a6a 0%, var(--coral) 45%, var(--coral-deep) 100%); box-shadow: var(--shadow), inset 0 2px 0 rgba(255, 255, 255, 0.5); }
.end-q.live::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 45%, transparent 60%); background-size: 250% 100%; animation: sheen 3s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { from { background-position: 130% 0; } to { background-position: -130% 0; } }
.end-q:active { transform: scale(0.97); }
.end-q.coach { animation: coachbob 1.6s ease-in-out infinite; }
.end-q.shake { animation: shake 0.45s ease-in-out; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.eq-ico { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; }
.eq-t { font-weight: 700; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: 0.04em; line-height: 1.05; }
.eq-t small { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; opacity: 0.92; margin-top: 4px; }

/* ---- Dossier ---- */
.dossier { grid-area: dos; }
.dz { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; position: relative; }
.dossier.pop .dz { animation: dzpop 0.35s cubic-bezier(.2,1.4,.4,1); }
@keyframes dzpop { from { transform: translateY(14px) scale(0.97); opacity: 0.4; } }
.dz h3 { font-family: var(--font-sans); font-size: 22px; line-height: 1.15; margin: 4px 0 6px; color: var(--ink); letter-spacing: 0; }
.dz-x { position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; color: var(--ink-muted); background: rgba(10, 70, 78, 0.06); }
.dz-k { padding-right: 46px; color: #a36a10; }
.dz-art { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; margin: 4px 0 8px; }
.dz-body { margin: 0 0 8px; color: var(--ink-muted); font-size: 16px; }
.dz-note { font-size: 16px; color: var(--ink-muted); margin: 6px 0; }
.dz-note.priv { color: var(--teal); }
.fine { font-size: 16px; color: var(--ink-muted); font-style: italic; margin: 8px 0; }
.fx-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.row-k, .when { font-size: 16px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); min-width: 52px; }
.when { min-width: 0; color: #a36a10; }
.fx-chip { font-size: 16px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #eef2f0; color: var(--ink); }
.fx-chip.good { background: #d6f5e8; color: #08694f; }
.fx-chip.bad { background: #ffe0d8; color: #a8301f; }
.fx-chip.cost { background: #e9e4da; color: #4b4136; }
.fx-chip.own { background: var(--teal-glow); color: #fff; }
.fx-chip.meh { background: #f3ead2; color: #6d5420; }
.btn-sign, .btn-seal {
  width: 100%; min-height: 56px; margin-top: 8px; border-radius: 16px; font-weight: 700; font-size: 20px; color: #fff;
  background: linear-gradient(180deg, #1aa196, var(--teal)); box-shadow: var(--shadow);
  animation: signpulse 1.8s ease-in-out infinite;
}
.btn-seal { background: linear-gradient(180deg, #ff8a6a, var(--coral-deep)); animation: none; }
.btn-sign[disabled] { opacity: 0.45; animation: none; }
@keyframes signpulse { 50% { box-shadow: var(--shadow), 0 0 0 6px rgba(25, 179, 166, 0.3); } }
.dz-choices { display: grid; gap: 8px; }
.dz-choice, .dz-act { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px rgba(10, 70, 78, 0.15); min-height: var(--tap); margin-top: 6px; }
.dz-choice:active, .dz-act:active { transform: scale(0.98); }
.dz-choice b, .dz-act b { font-size: 17px; color: var(--teal); }
.dz-act span { display: block; font-size: 16px; color: var(--ink-muted); }
.dz-act span.fx-row { display: flex; }
.dz-choice[disabled], .dz-act[disabled] { opacity: 0.45; }
.dz-stat { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 6px 0; }
.dz-stat span:first-child { min-width: 64px; color: var(--ink-muted); font-weight: 600; }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 16px; height: 10px; border-radius: 3px; background: rgba(10, 70, 78, 0.14); }
.pips i.on { background: var(--good); }
.pips.s-tense i.on { background: #e39a12; }
.pips.s-strike i.on, .pips.s-revolt i.on { background: var(--bad); }
.exec-id { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
.avatar { width: 64px; height: 64px; flex: none; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #1aa196, var(--teal-deep)); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.15); }
.exec-t { font-size: 16px; color: var(--ink-muted); line-height: 1.25; }
.target { background: #fff3c4; border-radius: 12px; padding: 8px 10px; font-size: 16px; }
.target span { color: var(--coral); font-weight: 700; margin-right: 4px; }
.quote { font-style: italic; color: var(--ink-muted); font-size: 16px; margin: 10px 0 6px; }

/* ---- Sheets / overlay modes ---- */
.overlay.sheet-mode { align-items: flex-end; }
.sheet-wrap { width: min(640px, 100%); max-height: 92dvh; overflow: auto; }
.sheet { background: #fffaf0; border-radius: 22px 22px 0 0; padding: 16px; position: relative; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.25); animation: sheetup 0.35s cubic-bezier(.2,1.2,.4,1); }
@keyframes sheetup { from { transform: translateY(60px); opacity: 0.4; } }
.sheet h3 { font-family: var(--font-sans); font-size: 22px; margin: 4px 0; color: var(--ink); letter-spacing: 0; }
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(10, 70, 78, 0.08); padding: 4px; border-radius: 14px; margin: 8px 0; }
.mode { min-height: var(--tap-min); border-radius: 10px; font-weight: 700; color: var(--teal); }
.mode.on { background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); }
.sys-list { display: grid; gap: 8px; margin: 8px 0; }
.sys { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 8px 10px; box-shadow: inset 0 0 0 2px rgba(10, 70, 78, 0.08); }
.sys-ico { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; background: #5c5246; }
.sys.st-incomplete .sys-ico { background: #c99428; }
.sys.st-risk .sys-ico { background: var(--coral); }
.sys.st-ready .sys-ico { background: var(--teal-glow); }
.sys-n { font-weight: 700; font-size: 18px; }
.sys-n span { color: var(--ink-muted); font-weight: 600; }
.sys-d { font-size: 16px; color: var(--ink-muted); line-height: 1.2; }
.sys-d em { font-style: normal; font-weight: 700; color: var(--bad); }
.sys-btns { display: flex; gap: 6px; }
.buy { min-width: 76px; min-height: 52px; border-radius: 12px; font-weight: 700; font-size: 18px; color: #fff; background: var(--teal); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.buy small { font-size: 16px; font-weight: 600; opacity: 0.9; }
.buy.q-cheap { background: #c99428; }
.buy[disabled] { opacity: 0.35; }
.buy:active { transform: scale(0.96); }
.maxed { font-weight: 700; color: var(--ink-muted); font-size: 16px; }
.sys-warn { grid-column: 1 / -1; font-size: 16px; color: var(--bad); }
.dz-act.slim { margin-top: 8px; }
.overlay.report-mode .panel { max-width: 520px; }
.report h3 { font-family: var(--font-sans); font-size: 26px; margin: 2px 0 10px; color: var(--ink); letter-spacing: 0; }
.rep-deltas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rd { background: #fff; border-radius: 12px; padding: 8px; text-align: center; box-shadow: inset 0 0 0 1px rgba(10, 70, 78, 0.1); animation: dzpop 0.4s both; }
.rd:nth-child(2) { animation-delay: 0.1s; }
.rd:nth-child(3) { animation-delay: 0.2s; }
.rd span { display: block; font-size: 16px; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; }
.rd b { display: block; font-size: 26px; color: var(--teal); }
.rd em { font-style: normal; font-weight: 700; font-size: 16px; }
.rd.good em { color: var(--good); }
.rd.bad em { color: var(--bad); }
.rep-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.rep-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.3; animation: dzpop 0.4s both; }
.rep-list li:nth-child(n+2) { animation-delay: 0.25s; }
.rep-list li:nth-child(n+4) { animation-delay: 0.45s; }
.rep-list i { flex: none; width: 28px; height: 28px; border-radius: 8px; background: #fff3c4; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 700; color: var(--teal); }

/* ---- Portrait / narrow: dossier becomes a bottom sheet when something is selected ---- */
@media (orientation: portrait), (max-width: 899px) {
  .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 0.62fr); grid-template-areas: "perf bunk" "news bunk"; }
  .dash-meters { grid-area: perf; }
  .ticker { grid-area: news; align-self: start; }
  .bunker-card { grid-area: bunk; }
  .phase-pill { margin-top: 10px; }
  .desk.has-sel .dossier .dz { background: #fffaf0; }
  .map { aspect-ratio: 2 / 1.05; }
  .hand { position: sticky; bottom: 0; z-index: 6; padding-top: 6px; background: linear-gradient(180deg, rgba(231, 189, 131, 0), rgba(217, 167, 107, 0.95) 30%); margin: 0 -12px; padding-left: 12px; padding-right: 12px; padding-bottom: 6px; }
  .cards { grid-template-columns: repeat(3, 1fr); }
  .card { grid-template-columns: 1fr; grid-template-rows: auto; min-height: 88px; }
  .c-ico { grid-row: auto; width: 34px; height: 34px; font-size: 19px; position: absolute; right: 8px; bottom: 8px; }
  .c-tag { justify-self: start; }
  .end-q { min-height: 72px; }
  .desk.has-sel .dossier { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 10px 10px; max-height: 78dvh; overflow: auto; }
  .desk.has-sel .dossier .dz { box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.35); }
  .desk.has-sel::after { content: ""; position: fixed; inset: 0; background: rgba(30, 20, 5, 0.3); z-index: 20; pointer-events: none; }
  .coach-bubble.c-end { bottom: 96px; }
}
/* ---- Landscape desk ---- */
@media (orientation: landscape) and (min-width: 900px) {
  .desk {
    height: 100dvh; overflow: hidden;
    grid-template-columns: minmax(0, 20vw) minmax(0, 1fr) minmax(0, 22vw);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "head head head" "dos board dash" "hand hand hand";
  }
  .desk-head { justify-content: center; position: relative; }
  .brand { text-align: center; }
  .head-right { position: absolute; right: 0; top: 0; }
  .dossier { min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .dash { grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; grid-template-rows: auto auto minmax(0, 1fr); }
  .dash > * { min-width: 0; }
  .meters { grid-template-columns: 1fr 1fr; }
  .m-cash { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
  .m-cash .m-lbl { grid-column: 1; }
  .m-cash .m-val { grid-column: 1; }
  .m-cash .m-bar { grid-column: 2; grid-row: 1; align-self: end; }
  .m-cash .m-sub { grid-column: 2; grid-row: 2; }
  .bunker-card { min-height: 0; overflow: hidden; }
  .cutaway { flex: 1; min-height: 0; height: 100%; }
  .hand { grid-template-columns: minmax(0, 1fr) minmax(0, 22vw); align-items: stretch; }
  .board-slab { margin: 0 6px 12px; }
  .dz-art { height: 84px; }
}
@media (orientation: landscape) and (min-width: 900px) and (max-height: 820px) {
  .dz-art { display: none; }
  .dz h3 { font-size: 20px; }
  .desk { gap: 10px; }
  .wordmark { font-size: clamp(26px, 3.4vw, 40px); }
  .m-val { font-size: 24px; }
  .spark-row .spark { height: 36px; }
  .card { min-height: 84px; }
  .end-q { min-height: 78px; }
}
@media (prefers-reduced-motion: reduce) {
  .desk *, .desk *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; }
}
body.on-desk .overlay { background: rgba(40, 24, 4, 0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
body.on-desk .overlay .panel { border: 0; border-radius: 22px; background: #fffaf0; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); animation: dzpop 0.35s cubic-bezier(.2,1.4,.4,1); }
.overlay.on.sheet-mode { display: flex; justify-content: center; align-items: flex-end; padding: 0; }
@media (orientation: landscape) and (min-width: 900px) {
  .overlay.on.sheet-mode { align-items: center; padding: 16px; }
  .sheet { border-radius: 22px; }
}

/* ---- Sunny title ---- */
#screen-title .title-sunny {
  position: relative; min-height: calc(100dvh - 20px); border-radius: 22px; overflow: hidden;
  display: grid; gap: 18px; padding: 24px 20px; align-content: center;
  background:
    radial-gradient(120% 70% at 85% -10%, rgba(255, 244, 200, 0.95), rgba(255, 244, 200, 0) 60%),
    repeating-linear-gradient(94deg, rgba(120, 72, 24, 0.05) 0 2px, transparent 2px 22px),
    linear-gradient(180deg, #f6dcab 0%, #e7bd83 55%, #d9a76b 100%);
  box-shadow: var(--shadow);
}
.title-sunny > * { position: relative; z-index: 1; }
.title-sunny .title-copy { padding: 0; text-align: center; background: none; border: 0; }
.title-sunny .title-copy::after, .title-sunny .title-copy h1::after { display: none; }
.title-sunny .kicker { color: var(--teal); }
.title-sunny h1.wordmark { font-family: var(--font-sans); text-transform: uppercase; font-size: clamp(44px, 9vw, 78px); margin: 6px 0 0; }
.title-sunny h1.wordmark .it { font-style: normal; font-family: inherit; color: inherit; }
.title-sunny .tagline { font-family: var(--font-slab); font-style: italic; color: var(--coral-deep); font-size: 20px; margin: 6px 0 0; }
.title-sunny .title-panel { display: grid; gap: 10px; width: min(420px, 100%); margin: 16px auto 0; padding: 0; background: none; border: 0; }
.title-sunny .seed-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.title-sunny .seed-row .field-label { margin: 0; }
.title-sunny .seed-row .btn { width: auto; padding: 0 18px; }
.title-sunny .btn { border-radius: 16px; box-shadow: var(--shadow); }
.title-sunny .demo-note { text-align: center; margin: 4px 0 0; }
.link-btn { min-height: 44px; padding: 0 6px; font-weight: 700; color: var(--teal); text-decoration: underline; }
.title-sunny .title-art { aspect-ratio: auto; border: 0; background: none; padding: 0; overflow: visible; display: flex; }
.title-sunny .title-art .board-slab { animation: titlefloat 6s ease-in-out infinite; }
@keyframes titlefloat { 50% { transform: rotateX(20deg) scale(0.98) translateY(-6px); } }
body:has(#screen-title.on) .shell { width: 100%; max-width: none; }
@media (orientation: landscape) and (min-width: 900px) {
  #screen-title .title-sunny { grid-template-columns: minmax(340px, 0.8fr) 1.2fr; align-items: center; padding: 28px 36px; }
  .title-sunny .title-art { min-height: 60vh; }
}
.title-sunny > .desk-light { position: absolute; }
.coach-inline { background: var(--teal); color: #fff; font-weight: 700; font-size: 16px; text-align: center; border-radius: 10px; padding: 6px 10px; animation: coachbob 1.6s ease-in-out infinite; }
@media (orientation: landscape) and (min-width: 900px) {
  .dash { grid-template-rows: auto minmax(0, 1fr) auto; }
  .ticker { order: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .ticker .tick-wrap { flex: 1; min-width: 0; }
  .ticker .tick-run { padding-top: 0; }
  .bunker-card .cutaway { min-height: 120px; }
}
.hand { position: relative; }
.coach-bubble.c-end { right: 0; bottom: calc(100% + 10px); }
@media (orientation: portrait), (max-width: 899px) { .coach-bubble.c-end { bottom: calc(100% + 4px); } }
.title-art .map .region .top { fill: url(#tg-land); }
.title-art .map .region.owned .top { fill: url(#tg-own); }
.title-art .map .region.s-strike:not(.owned) .top, .title-art .map .region.t-crisis:not(.owned) .top { fill: url(#tg-burn); }

/* =====================================================================
   v2: map-only deal picking + dimensional bunker
   ===================================================================== */
.desk { grid-template-areas: "head" "board" "hand" "dash" "dos"; }
.hand { grid-template-columns: 1fr; }
.map .pin-scale { transform: scale(1.3); }
.map .pin .hit { fill: transparent; }
.map .pin-tag rect { fill: #0a464e; stroke: #fff; stroke-width: 2.5; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.3)); }
.map .pin-tag text { font-family: var(--font-sans); font-weight: 700; font-size: 20px; fill: #fff; letter-spacing: 0.04em; pointer-events: none; }
.map .pin.k-claim .pin-tag rect { fill: #0b6f73; }
.map .pin.k-squeeze .pin-tag rect { fill: #a36a10; }
.map .pin.k-calm .pin-tag rect { fill: var(--good); }
.map .pin.k-crisis .pin-tag rect { fill: var(--bad); }
.map .pin.sel .pin-tag rect { fill: var(--coral); }
.map .pin.sel { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9)); }
.map .signed-mark rect { fill: #19b3a6; stroke: #fff; stroke-width: 3; }
.map .signed-mark text { font-family: var(--font-sans); font-weight: 700; font-size: 20px; fill: #fff; }
.map .signed-mark { animation: pindrop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
.phase-pill { font-size: 18px; padding: 8px 20px; }
.desk.phase-deal .phase-pill { background: var(--coral); animation: coachbob 2s ease-in-out infinite; }

/* Bunker scene (shared by mini card + zoom view) */
.bk-scene { display: block; width: 100%; height: auto; border-radius: 12px; }
.bk-scene .bk-spin { animation: spin 1.1s linear infinite; }
.bk-scene .bk-wave { animation: waves 2.4s linear infinite alternate; }
.bk-scene .bk-bolt { animation: glowp 1.4s ease-in-out infinite; }
@keyframes glowp { 50% { opacity: 0.45; } }
.bk-scene .bk-charge rect { animation: charge 2s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
@keyframes charge { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
.bk-scene .bk-grow { animation: glowp 2.2s ease-in-out infinite; }
.bk-scene .bk-sway { animation: bob 2.4s ease-in-out infinite; }
.bk-scene .bk-light { animation: glowp 3s ease-in-out infinite; }
.bk-scene .bk-bulb { animation: swing 2.6s ease-in-out infinite; transform-origin: 125px 12px; }
@keyframes swing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.bk-scene .bk-hook { animation: swing 3s ease-in-out infinite; transform-origin: 170px 12px; }
.bk-scene .bk-hammer { animation: hammer 0.5s ease-in-out infinite alternate; transform-origin: 0 -12px; }
@keyframes hammer { from { transform: rotate(-30deg); } to { transform: rotate(25deg); } }
.bk-scene .bk-worker.walk { animation: walk 3.4s ease-in-out infinite alternate; }
@keyframes walk { from { translate: -26px 0; } to { translate: 14px 0; } }
.bk-scene .bk-risk { animation: riskp 1.1s ease-in-out infinite; opacity: 0; }
@keyframes riskp { 50% { opacity: 0.28; } }
.bk-scene .bk-beacon { animation: glowp 0.7s steps(2) infinite; }
.bk-scene .bk-elev { animation: elev 7s ease-in-out infinite; }
.bk-scene .bk-elev.still { animation: none; }
@keyframes elev { 0%, 15% { transform: translateY(0); } 50%, 65% { transform: translateY(200px); } 100% { transform: translateY(0); } }
.bk-scene .bk-crate { animation: swing 2.2s ease-in-out infinite; transform-origin: 368px 40px; }
.bk-scene .bk-flow { animation: dash 1.6s linear infinite; }
.bk-scene .bk-flow.g-strained { animation-duration: 3.5s; }
.bk-scene .bk-flow.g-disrupted { animation: glowp 0.6s steps(2) infinite; }
.bk-scene .bk-private { animation: dash 1.2s linear infinite; }
.bk-scene .bk-sun { animation: sunspin 5s ease-in-out infinite; transform-origin: 572px 38px; }
.bk-scene .bk-cloud { animation: drift 30s linear infinite alternate; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(260px); } }
.bk-scene .bk-fire { animation: flicker 0.8s ease-in-out infinite alternate; transform-origin: 46px 100px; transform-box: view-box; }
.bk-scene .bk-palm { animation: palm 4s ease-in-out infinite; }
@keyframes palm { 50% { transform: rotate(2deg); } }
.bk-scene .bk-palm { transform-box: fill-box; transform-origin: 50% 100%; }
.bk-scene .bk-shimmer { animation: shim 2.5s ease-in-out infinite; }
@keyframes shim { 50% { transform: translateX(36px); } }
.bk-scene .bk-doorleaf { animation: none; }
.bk-scene .bk-sealglow { animation: glowp 1.2s ease-in-out infinite; }
.bk-scene .bk-stamp { animation: stampin 0.7s 0.9s cubic-bezier(.2,1.4,.4,1) both; transform-box: view-box; transform-origin: 320px 272px; }
@keyframes stampin { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; transform: scale(1); } }
.bk-scene.is-sealed .bk-door ellipse:first-child { animation: doorshut 0.9s cubic-bezier(.3,1.4,.5,1) both; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes doorshut { from { transform: scaleX(0.1) translateY(-20px); } to { transform: none; } }
.bk-scene.is-sealed .bk-room > rect:nth-of-type(2) { animation: dim 1.4s 0.6s both; }
@keyframes dim { to { filter: brightness(0.92); } }
.bk-scene .bk-room.just .bk-spark circle { animation: sparkle 1s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes sparkle { from { transform: scale(0.2); opacity: 1; } to { transform: scale(9); opacity: 0; } }
.bk-scene .bk-room.just { animation: roompop 0.6s cubic-bezier(.2,1.6,.4,1); }
@keyframes roompop { 40% { transform: translateY(-6px); } }
.bk-scene .bk-room.just { transform-box: fill-box; }
.bk-scene .bk-hit { fill: transparent; }
.bk-scene.live .bk-room, .bk-scene.live .bk-spot { cursor: pointer; }
.bk-scene.live .bk-room .bk-shell { transition: fill 0.2s; }
.bk-scene.live .bk-room.sel .bk-shell { fill: var(--coral); }
.bk-scene.live .bk-room.sg-empty .bk-badge, .bk-scene.live .bk-room.st-incomplete .bk-badge { animation: coachbob 1.4s ease-in-out infinite; }
.bk-scene .bk-spotlbl rect { fill: rgba(10, 70, 78, 0.92); stroke: #fff; stroke-width: 2; }
.bk-scene .bk-spotlbl text { fill: #fff; }
.bk-scene .bk-spotlbl.on rect { fill: #19b3a6; }
.bk-scene .bk-spot.sel .bk-spotlbl rect { fill: var(--coral); }
.bk-view.convert-mode .bk-room .bk-shell { fill: #19b3a6; }
.bk-scene.mini .bk-worker, .bk-scene.mini .bk-cloud { display: inline; }

/* Desk mini card */
.bunker-card .bc-scene { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(10, 70, 78, 0.12); background: #c8945a; }
.bunker-card .bc-scene .bk-scene { max-height: 100%; width: auto; max-width: 100%; height: 100%; }
.bunker-card.installed .bc-scene { animation: roompop 0.7s cubic-bezier(.2,1.6,.4,1); }

/* Zoom view */
.overlay.on.bunker-mode { display: flex; align-items: center; justify-content: center; padding: 10px; }
.overlay.bunker-mode.closing { background: rgba(40, 24, 4, 0); transition: background 0.35s; }
.bk-view {
  position: relative; width: min(1240px, 100%); max-height: calc(100dvh - 20px); overflow: auto;
  display: grid; gap: 10px; grid-template-columns: 1fr; grid-template-areas: "top" "stage" "panel";
  background: #fffaf0; border-radius: 24px; padding: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  will-change: transform;
}
.bk-top { grid-area: top; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 2px 4px; }
.bk-top h3 { font-family: var(--font-sans); font-size: 22px; margin: 2px 0 0; color: var(--ink); letter-spacing: 0; }
.bk-top .dz-x { position: static; flex: none; }
.bk-stage { grid-area: stage; position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 24px rgba(60, 30, 0, 0.25); }
.bk-panel { grid-area: panel; padding: 4px 6px 8px; }
.bk-panel.pop { animation: dzpop 0.3s cubic-bezier(.2,1.4,.4,1); }
.bk-stage .toast { top: 50%; }
.bp-head { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.bp-head h3 { font-family: var(--font-sans); font-size: 22px; margin: 0; color: var(--ink); letter-spacing: 0; }
.bp-sub { font-size: 16px; color: var(--ink-muted); }
.bp-ico { width: 48px; height: 48px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; background: #5c5246; }
.bp-ico.st-incomplete { background: #c99428; }
.bp-ico.st-risk { background: var(--coral); }
.bp-ico.st-ready { background: var(--teal-glow); }
.bp-next { margin: 8px 0 6px; font-size: 17px; }
.bp-note { font-size: 16px; color: var(--ink-muted); margin: 6px 0; }
.bp-warn { font-size: 16px; color: var(--bad); margin: 6px 0; font-weight: 600; }
.bp-buy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.bp-btn { min-height: 64px; border-radius: 16px; padding: 8px 12px; text-align: left; color: #fff; background: linear-gradient(180deg, #1aa196, var(--teal)); box-shadow: var(--shadow); }
.bp-btn.q-cheap { background: linear-gradient(180deg, #e0ab3a, #b07c18); }
.bp-btn.on { box-shadow: var(--shadow), 0 0 0 4px rgba(25, 179, 166, 0.45); }
.bp-btn b { display: block; font-size: 18px; }
.bp-btn span { display: block; font-size: 16px; opacity: 0.92; line-height: 1.2; }
.bp-btn[disabled] { opacity: 0.38; box-shadow: none; }
.bp-btn:active { transform: scale(0.97); }
@media (orientation: landscape) and (min-width: 900px) {
  .desk { grid-template-areas: "head head head" "dos board dash" "dos board hand"; }
  .hand { grid-template-columns: 1fr; }
  .board-slab { margin-bottom: 14px; }
  .bk-view { grid-template-columns: minmax(0, 1fr) 330px; grid-template-areas: "top top" "stage panel"; align-items: start; }
  .bk-stage .bk-scene { max-height: calc(100dvh - 120px); width: auto; max-width: 100%; margin: 0 auto; }
  .bk-stage { background: #c8945a; }
  .bk-buy, .bp-buy { grid-template-columns: 1fr; }
}
@media (orientation: portrait), (max-width: 899px) {
  .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
  .hand { margin: 0 -12px; }
  .overlay.on.bunker-mode { align-items: flex-start; padding-top: max(10px, env(safe-area-inset-top)); }
}
.bk-stage .toast { top: auto; bottom: 14px; }


/* =====================================================================
   v3 look: "Brighter Tomorrow" — tech-optimist Roaring 20s deco.
   Emerald + black lacquer, thin gold linework, frosted emerald glass,
   holographic map, golden sunrise. Visual only: no layout/logic changes.
   ===================================================================== */
:root {
  --gold: #d4af37;
  --gold-hi: #f3d98f;
  --gold-soft: rgba(212, 175, 55, 0.55);
  --gold-line: rgba(226, 191, 99, 0.7);
  --ivory: #f6ecd4;
  --ivory-muted: rgba(246, 236, 212, 0.74);
  --emerald: #0d5a4c;
  --emerald-deep: #06261f;
  --lacquer: rgba(5, 28, 23, 0.8);
  --lacquer-solid: #082a23;
  --glass-deco: linear-gradient(180deg, rgba(14, 66, 56, 0.82), rgba(5, 30, 25, 0.86));
  --deco-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.35);
  --deco-inset: inset 0 0 0 1px rgba(212, 175, 55, 0.18), inset 0 1px 0 rgba(255, 240, 200, 0.12);
}
html, body { background: #05201b; color: var(--ivory); }
body { background-image: radial-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1.2px); background-size: 12px 12px; }

/* ---------- Desk backdrop: penthouse at sunrise ---------- */
body.on-desk { background: #05201b; }
.desk {
  background:
    linear-gradient(180deg, rgba(4, 22, 18, 0.55) 0%, rgba(4, 22, 18, 0.2) 30%, rgba(4, 22, 18, 0.35) 70%, rgba(3, 16, 13, 0.82) 100%),
    radial-gradient(70% 55% at 22% 48%, rgba(255, 196, 96, 0.28), rgba(255, 196, 96, 0) 70%),
    url("assets/desk-penthouse.webp") center 40% / cover no-repeat,
    linear-gradient(180deg, #2a3a2c, #0a2a23);
  color: var(--ivory);
}
.desk-light {
  background: repeating-linear-gradient(115deg, rgba(255, 214, 140, 0) 0 90px, rgba(255, 214, 140, 0.07) 90px 160px, rgba(255, 214, 140, 0) 160px 280px);
  mix-blend-mode: screen;
}

/* Wordmark: gold deco title with sunburst rules */
.wordmark {
  font-family: var(--font-serif); font-weight: 700; letter-spacing: 0.08em;
  color: var(--gold-hi);
  background: linear-gradient(180deg, #fff3c4 0%, #f0cf7a 45%, #b8862c 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
}
.wordmark .sun {
  background: radial-gradient(circle, #fff6d0 0 30%, #f3c55a 32% 55%, rgba(243, 197, 90, 0) 60%);
  box-shadow: 0 0 26px 8px rgba(255, 205, 100, 0.55);
}
.tag { color: var(--ivory); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7); letter-spacing: 0.22em; }
.tag::before, .tag::after { content: ""; display: inline-block; width: 34px; height: 1px; background: var(--gold); vertical-align: middle; margin: 0 10px; box-shadow: 0 -4px 0 -0.5px rgba(212, 175, 55, 0.5); }
.q-chip {
  background: var(--glass-deco); border: 1px solid var(--gold-line); color: var(--gold-hi);
  box-shadow: var(--deco-shadow), var(--deco-inset); font-family: var(--font-serif);
}
.q-chip small { color: var(--ivory-muted); font-family: var(--font-sans); }
.icon-btn { background: var(--glass-deco); color: var(--gold-hi); border: 1px solid var(--gold-line); box-shadow: var(--deco-shadow), var(--deco-inset); }

/* Panels: frosted emerald glass, gold hairline + corner ticks */
.panel, .dz, .card {
  background: var(--glass-deco); border: 1px solid var(--gold-line); color: var(--ivory);
  box-shadow: var(--deco-shadow), var(--deco-inset);
  backdrop-filter: blur(8px) saturate(1.2); -webkit-backdrop-filter: blur(8px) saturate(1.2);
}
.panel-k, .dz-k { color: var(--gold-hi); letter-spacing: 0.1em; font-weight: 700; }
.panel-k::before, .dz-k::before { content: "◆"; font-size: 0.6em; color: var(--gold); margin-right: 6px; vertical-align: 0.2em; }
@media (orientation: portrait), (max-width: 899px) {
  .tag::before, .tag::after { display: none; }
  .tag { letter-spacing: 0.12em; }
}
.dz-k { color: var(--gold-hi); }
.dz, .dash-meters, .bunker-card { position: relative; }
.dz::after, .dash-meters::after {
  content: ""; position: absolute; inset: 5px; border-radius: 13px; pointer-events: none;
  background:
    linear-gradient(var(--gold), var(--gold)) left top / 14px 1px no-repeat,
    linear-gradient(var(--gold), var(--gold)) left top / 1px 14px no-repeat,
    linear-gradient(var(--gold), var(--gold)) right top / 14px 1px no-repeat,
    linear-gradient(var(--gold), var(--gold)) right top / 1px 14px no-repeat,
    linear-gradient(var(--gold), var(--gold)) left bottom / 14px 1px no-repeat,
    linear-gradient(var(--gold), var(--gold)) left bottom / 1px 14px no-repeat,
    linear-gradient(var(--gold), var(--gold)) right bottom / 14px 1px no-repeat,
    linear-gradient(var(--gold), var(--gold)) right bottom / 1px 14px no-repeat;
  opacity: 0.8;
}

/* Meters */
.meter { background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.35); }
.m-lbl { color: var(--ivory-muted); letter-spacing: 0.12em; }
.m-val { color: var(--ivory); font-family: var(--font-serif); }
.m-cash .m-val { color: var(--gold-hi); }
.m-unrest .m-val { color: #f5c04a; }
.m-collapse .m-val { color: #ff8a6a; }
.m-bar { background: rgba(0, 0, 0, 0.4); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.2); }
.m-cash .m-bar span { background: linear-gradient(90deg, #b8862c, #f3d98f); }
.m-sub { color: var(--ivory-muted); }
.spark .area { fill: rgba(63, 224, 184, 0.16); }
.spark .line { stroke: #3fe0b8; }
.spark .line.down { stroke: #ff8a6a; }
.holdings { color: var(--ivory-muted); }
.holdings b { color: var(--gold-hi); }
.tick-run { color: var(--ivory); }
.tick-run span::before { color: var(--gold); content: "◆ "; }

/* Bunker card on the desk */
.bunker-card .bc-scene { background: #120e0b; box-shadow: inset 0 0 0 1px var(--gold-line); }
.bunker-card.ready { box-shadow: var(--deco-shadow), 0 0 0 2px var(--gold); }
@keyframes readyglow { 50% { box-shadow: var(--deco-shadow), 0 0 0 5px rgba(243, 217, 143, 0.4); } }
.bc-cta { color: var(--gold-hi); }
.bunker-card.ready .bc-cta { color: #ffb19c; }
.coach-inline { background: var(--emerald); border: 1px solid var(--gold-line); color: var(--ivory); }

/* Board: holographic map table with gold rim and emitter rings */
.board-slab {
  background: linear-gradient(180deg, rgba(120, 255, 225, 0.22), rgba(20, 120, 100, 0.12));
  box-shadow:
    0 12px 0 -2px rgba(90, 64, 18, 0.95),
    0 12px 0 0 var(--gold),
    0 34px 50px -12px rgba(0, 0, 0, 0.65),
    0 0 46px rgba(63, 224, 184, 0.35),
    0 0 0 2px var(--gold) inset;
}
.board-slab::before {
  box-shadow: inset 0 0 0 2px rgba(243, 217, 143, 0.75), inset 0 0 0 7px rgba(6, 40, 34, 0.55), inset 0 0 0 8px rgba(212, 175, 55, 0.5), inset 0 0 60px rgba(63, 224, 184, 0.35);
}
.board-slab::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(0deg, rgba(160, 255, 235, 0.05) 0 1px, transparent 1px 4px);
  mix-blend-mode: screen; animation: scan 6s linear infinite;
}
@keyframes scan { from { background-position: 0 0; } to { background-position: 0 40px; } }
.board-tilt { position: relative; }
.board-tilt::after {
  content: ""; position: absolute; left: 8%; right: 8%; bottom: -14px; height: 46px; pointer-events: none; z-index: -1;
  border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(63, 224, 184, 0.45), rgba(63, 224, 184, 0) 70%);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.45), 0 0 0 10px rgba(212, 175, 55, 0.08), 0 0 0 12px rgba(212, 175, 55, 0.35);
}
.map .grat { stroke: #8ff5e0; stroke-opacity: 0.16; }
.map .route { stroke: #8ff5e0; stroke-opacity: 0.35; }
.map .route.live { stroke: var(--gold-hi); }
.map .region .side { fill: #6b4a14; }
.map .region .top { stroke: #fff1c2; stroke-width: 1.2; }
.map .region.owned .side { fill: #064a3c; }
.map .region.owned .top { stroke: #c8fff0; filter: drop-shadow(0 0 7px rgba(63, 224, 184, 0.95)); }
.map .borders { stroke: #4a3208; stroke-opacity: 0.25; }
.map .rlabel { fill: var(--ivory); stroke: #052a23; stroke-width: 4.5px; letter-spacing: 0.12em; }
.map .rlabel.own { fill: #d9fff4; stroke: #04332a; }
.map .rtag { fill: #ffd36a; stroke: #052a23; }
.map .pin .drop { fill: #f6d77e; stroke: #6b4a10; filter: drop-shadow(0 0 6px rgba(255, 210, 110, 0.85)) drop-shadow(0 4px 3px rgba(0, 0, 0, 0.45)); }
.map .pin.k-claim .drop { fill: #f6d77e; stroke: #0b5e55; }
.map .pin.k-squeeze .drop { fill: #ffd56a; stroke: #7a5410; }
.map .pin.k-calm .drop { fill: #e9f7c8; stroke: #1d6b4a; }
.map .pin.k-crisis .drop { fill: #ffc2b0; stroke: #a3352a; }
.map .pin .glyph { fill: #08362d; }
.map .pin-tag rect { fill: rgba(5, 34, 28, 0.94); stroke: var(--gold-hi); stroke-width: 2; }
.map .pin.k-claim .pin-tag rect { fill: #0a4f46; }
.map .pin.k-squeeze .pin-tag rect { fill: #6e4a0c; }
.map .pin.k-calm .pin-tag rect { fill: #175c40; }
.map .pin.k-crisis .pin-tag rect { fill: #9a3226; }
.map .pin.sel .pin-tag rect { fill: var(--coral); }
.map .pin-tag text { fill: var(--ivory); }
.map .signed-mark rect { fill: #0f8f72; stroke: var(--gold-hi); }

.phase-pill { background: var(--glass-deco); border: 1px solid var(--gold-line); color: var(--ivory); box-shadow: var(--deco-shadow); }
.desk.phase-deal .phase-pill { background: linear-gradient(180deg, #ef7a62, var(--coral-deep)); border-color: rgba(255, 220, 180, 0.7); }
.coach-bubble, .coach-bubble::after { background: var(--emerald); }
.coach-bubble { border: 1px solid var(--gold-line); color: var(--ivory); }
.stamp { background: rgba(250, 240, 214, 0.92); font-family: var(--font-serif); box-shadow: 0 0 0 3px rgba(250, 240, 214, 0.92), 0 0 0 5px var(--gold); }
.toast { background: var(--emerald); border: 1px solid var(--gold-line); }

/* End Quarter: coral CTA kept, deco trim */
.end-q { background: linear-gradient(180deg, rgba(40, 64, 56, 0.92), rgba(16, 36, 31, 0.94)); border: 1px solid var(--gold-soft); color: var(--ivory-muted); }
.end-q.live { border-color: rgba(255, 225, 170, 0.75); color: #fff; }
.eq-t { font-family: var(--font-serif); }
.eq-t small { font-family: var(--font-sans); }
body:not(.on-desk) { background: linear-gradient(180deg, rgba(4, 22, 18, 0.82), rgba(4, 22, 18, 0.9)), url("assets/desk-penthouse.webp") center / cover fixed no-repeat, #05201b; }
.title-sunny > .desk-light { opacity: 0.5; }
.eq-ico { border-color: currentColor; }

/* Dossier */
.dz h3 { color: var(--ivory); font-family: var(--font-serif); letter-spacing: 0; }
.dz-x { color: var(--gold-hi); background: rgba(212, 175, 55, 0.14); }
.dz-body, .dz-note, .fine, .exec-t, .quote { color: var(--ivory-muted); }
.dz-note.priv { color: #7ff2d6; }
.row-k { color: var(--ivory-muted); }
.when { color: var(--gold-hi); }
.fx-chip { background: rgba(255, 255, 255, 0.1); color: var(--ivory); }
.fx-chip.good { background: rgba(63, 224, 184, 0.2); color: #9ff5de; }
.fx-chip.bad { background: rgba(255, 120, 90, 0.2); color: #ffb3a1; }
.fx-chip.cost { background: rgba(255, 255, 255, 0.12); color: #e8dcc0; }
.fx-chip.own { background: #0f8f72; color: #fff; }
.fx-chip.meh { background: rgba(243, 217, 143, 0.18); color: var(--gold-hi); }
.dz-choice, .dz-act { background: rgba(0, 0, 0, 0.26); color: var(--ivory); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.45); }
.dz-choice b, .dz-act b { color: var(--gold-hi); }
.dz-act span { color: var(--ivory-muted); }
.btn-sign { background: linear-gradient(180deg, #19a585, #0b5e4e); box-shadow: var(--deco-shadow), inset 0 0 0 1px var(--gold-hi); }
@keyframes signpulse { 50% { box-shadow: var(--deco-shadow), inset 0 0 0 1px var(--gold-hi), 0 0 0 6px rgba(243, 217, 143, 0.28); } }
.btn-seal { box-shadow: var(--deco-shadow), inset 0 0 0 1px rgba(255, 225, 170, 0.8); }
.pips i { background: rgba(255, 255, 255, 0.16); }
.pips i.on { background: #3fe0b8; }
.dz-stat span:first-child { color: var(--ivory-muted); }
.avatar { background: linear-gradient(135deg, #12806a, #063a30); box-shadow: inset 0 0 0 2px var(--gold), 0 0 0 1px rgba(0, 0, 0, 0.4); color: var(--gold-hi); font-family: var(--font-serif); }
.target { background: rgba(212, 175, 55, 0.12); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.35); color: var(--ivory); }
.dz-art { box-shadow: 0 0 0 1px var(--gold-line); }
.card .c-t { color: var(--ivory); }
.c-k { color: var(--gold-hi); }

/* Overlays (report, menu, crisis confirm, sheets) */
body.on-desk .overlay { background: rgba(2, 14, 11, 0.55); }
body.on-desk .overlay .panel, .sheet, .overlay .panel {
  background: linear-gradient(180deg, #0e4238, #062a23); color: var(--ivory);
  border: 1px solid var(--gold-line); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), var(--deco-inset);
}
.overlay .panel h2, .report h3, .sheet h3 { color: var(--gold-hi); font-family: var(--font-serif); }
.overlay .panel p, .overlay .muted { color: var(--ivory-muted); }
.overlay .kicker { color: var(--gold-hi); }
.rd { background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.35); }
.rd span { color: var(--ivory-muted); }
.rd b { color: var(--ivory); font-family: var(--font-serif); }
.rd.good em { color: #6ff0c9; }
.rd.bad em { color: #ff9a80; }
.rep-list li { color: var(--ivory); }
.rep-list i { background: rgba(212, 175, 55, 0.2); color: var(--gold-hi); }
.overlay .btn:not(.btn-coral):not(.btn-danger) { background: rgba(0, 0, 0, 0.25); border-color: var(--gold-line); color: var(--ivory); }
.overlay .btn-danger { background: rgba(0, 0, 0, 0.25); color: #ffb3a1; }
.mode-row { background: rgba(0, 0, 0, 0.25); }
.mode { color: var(--ivory); }
.mode.on { background: rgba(212, 175, 55, 0.25); }
.sys { background: rgba(0, 0, 0, 0.25); }
.sys-d { color: var(--ivory-muted); }

/* ---------- Bunker zoom view: island scene, slim glass hint strip ---------- */
.overlay.bunker-mode { background: rgba(2, 14, 11, 0.6); }
.bk-view {
  background: linear-gradient(180deg, #0c3a31, #051f1a); color: var(--ivory);
  border: 1px solid var(--gold-line); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), var(--deco-inset);
}
.bk-top h3 { color: var(--ivory); font-family: var(--font-serif); }
.bk-stage { background: #120e0b; box-shadow: 0 0 0 1px var(--gold-line), 0 10px 24px rgba(0, 0, 0, 0.45); }
.bk-panel {
  background: linear-gradient(180deg, rgba(14, 66, 56, 0.78), rgba(5, 30, 25, 0.85));
  border: 1px solid var(--gold-line); border-radius: 14px; padding: 10px 14px;
  box-shadow: var(--deco-inset); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.bk-panel:has(.bp-hint) { padding: 8px 14px; text-align: center; }
.bp-hint { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 10px; font-size: 17px; color: var(--ivory); font-family: var(--font-serif); }
.bp-hint b { color: var(--gold-hi); }
.bp-dot { color: var(--gold); }
.bp-hint-sub { font-size: 16px; color: var(--ivory-muted); margin-top: 2px; }
.bp-hint-sub b { color: var(--gold-hi); }
.bp-head h3 { color: var(--ivory); font-family: var(--font-serif); }
.bp-sub, .bp-note { color: var(--ivory-muted); }
.bp-next { color: var(--ivory); }
.bp-next b { color: var(--gold-hi); }
.bp-warn { color: #ff9a80; }
.bp-ico { box-shadow: inset 0 0 0 2px var(--gold); background: #3a2e22; }
.bp-ico.st-incomplete { background: #a8781c; }
.bp-ico.st-ready { background: #0f8f72; }
.bp-btn { background: linear-gradient(180deg, #19a585, #0b5e4e); box-shadow: var(--deco-shadow), inset 0 0 0 1px var(--gold-hi); }
.bp-btn.q-cheap { background: linear-gradient(180deg, #e2b445, #9a6a12); color: #1e1404; }
.bp-btn.on { box-shadow: var(--deco-shadow), 0 0 0 3px var(--gold-hi); }
.bk-scene .bk-spotlbl rect { fill: #d4af37; stroke: none; }
.bk-scene .bk-spotlbl .bk-spotlbl-in { fill: #062a23; stroke: rgba(255, 240, 200, 0.35); stroke-width: 1; }
.bk-scene .bk-spotlbl text { fill: var(--ivory); font-family: var(--font-serif); }
.bk-scene .bk-spotlbl.on .bk-spotlbl-in { fill: #0f8f72; }
.bk-scene .bk-spot.sel .bk-spotlbl .bk-spotlbl-in { fill: var(--coral); }
.bk-scene .bk-spot.sel .bk-spotlbl rect:first-child { fill: #fff1c2; }
.bk-scene .bk-plaque rect { fill: #062a23; stroke: var(--gold); stroke-width: 2; }
.bk-scene .bk-plaque text { fill: var(--gold-hi); font-family: var(--font-serif); }
.bk-scene.mini .bk-plaque { display: none; }
.bk-scene .bk-zap { animation: zap 1.5s steps(3) infinite; }
@keyframes zap { 0%, 100% { opacity: 0.15; } 40% { opacity: 1; } 70% { opacity: 0.4; } }
.bk-scene .bk-pipeflow { animation: dash 2.6s linear infinite; }
.bk-scene .bk-docklamp { animation: glowp 1.6s ease-in-out infinite; }
.bk-scene .bk-docklit { mix-blend-mode: screen; }
.bk-scene .bk-hit { cursor: pointer; }
.bk-scene .bk-spot:not(.sel) .bk-hit:hover { fill: rgba(243, 217, 143, 0.08); }
.bk-view.convert-mode .bk-room .bk-shell { fill: #0f8f72; }
.bk-scene.live .bk-room.sel .bk-shell { fill: var(--coral); stroke: #fff1c2; }
