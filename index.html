    state.rivals.forEach(function (rv) {
      var n = LD.rivalRegions(state, rv.idx).length;
      h += '<button class="rv-row' + (ui.selRival === rv.idx ? " sel" : "") + '" data-rival="' + rv.idx + '"><i style="background:' + LD.RIVAL_COLORS[rv.idx] + '"></i><b>' + esc(rv.firm) + "</b><span>" +
        (rv.sealed ? "Sealed in" : n + " region" + (n === 1 ? "" : "s") + (rv.engineer ? " · engineer" : "") + " · seal ~Q" + rv.sealTurn) + "</span></button>";
    });
    return h + "</div>";
  }

  function renderDesk(state, ui) {
    ui = ui || {};
    var dealPhase = state.phase === "deal";
    var h = '<div class="desk ' + (dealPhase ? "phase-deal" : "phase-bunker") + (ui.selDeal || ui.selRegion || ui.selNet || ui.selRival != null ? " has-sel" : "") + (ui.globe ? " is-globe" : "") + '">';
    h += '<div class="desk-light" aria-hidden="true"></div>';
    h += '<header class="desk-head"><div class="brand"><div class="wordmark">LAST DIVIDEND<span class="sun" aria-hidden="true"></span></div>' +
      '<div class="tag">A Brighter Tomorrow, Privately Owned</div></div>' +
      '<div class="head-right"><div class="rating-plate" aria-label="Credit rating ' + esc(LD.ratingName(state.rating)) + '"><small>Rating</small>' + esc(LD.ratingName(state.rating)) + '</div><div class="q-chip" aria-label="Quarter ' + state.turn + '"><small>' + (LD.actChip ? LD.actChip(state) : "Quarter") + '</small>Q' + state.turn + (state.fy ? "<i>/" + state.fy.rules.finalQ + "</i>" : "") + "</div>" +
      '<button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button></div></header>';

    h += '<aside class="dossier" id="dossier">' + renderDossier(state, ui) + "</aside>";

    h += '<main class="board">' + lensBar(ui) + networkStrip(state, ui);
    h += '<div class="board-tilt"><div class="board-slab"><div class="map-zoom" id="map-zoom">' + renderMap(state, ui) + "</div></div>" + (ui.globe ? '<div class="pedestal" aria-hidden="true"><i></i><i></i><i></i></div>' : "") + "</div>";
    var bossNow = LD.bossInfo ? LD.bossInfo(state, state.turn) : null;
    h += '<div class="phase-pill' + (bossNow && !ui.hidePins ? " boss" : "") + '">' + (bossNow && !ui.hidePins ? bossNow.icon + " Boss quarter · " + bossNow.name + " · " : "") + (ui.hidePins ? "The world reacts…" : dealPhase ? "Pick 1 of " + state.offered.length + " deals on the map" : (state.bunkerActedThisTurn ? "Ready to end the quarter" : "Deal signed · upgrade the bunker or end the quarter")) + "</div>";
    h += '<div id="rail-wrap">' + renderRail(state, ui.selDeal, null) + "</div>";
    if (ui.coach === "pin" && ui.coachText) h += '<div class="coach-bubble c-pin">' + esc(ui.coachText) + "</div>";
    if (dealPhase && !ui.hidePins) {
      h += '<div class="sr-only"><h2>Deals this quarter</h2><ul>';
      state.offered.forEach(function (id) { h += '<li><button class="sr-deal" data-deal="' + id + '">' + esc(pinAria(state, id)) + "</button></li>"; });
      h += "</ul></div>";
    }
    h += '<div class="map-tip" id="map-tip" role="tooltip" hidden></div>';
    h += '<div class="fx" id="fx" aria-hidden="true"></div></main>';

    var hist = (state.world && state.world.history) || [];
    var prev = hist.length > 1 ? hist[hist.length - 2].cash : null;
    var last = hist.length ? hist[hist.length - 1].cash : state.cash;
    var delta = state.cash - (prev == null ? last : (state.turn === hist[hist.length - 1].turn ? prev : last));
    h += '<aside class="dash">';
    h += '<div class="panel dash-meters"><div class="panel-k"><span>Q' + state.turn + " Performance</span>" + (LD.portfolioChip ? LD.portfolioChip(state) : "") + "</div><div class=\"meters\">";
    h += meter("cash", "Cash", state.cash, delta ? (delta > 0 ? "▲ " : "▼ ") + money(Math.abs(delta)) + " this Q" : "steady", true);
    h += meter("unrest", "Unrest", state.unrest, state.unrest >= LD.mods(state).crisisNoPayAt ? "Past being bought" : state.unrest >= 48 ? "Crises likely" : state.unrest >= 40 ? "Restless" : "Manageable", false, [[48, "Crisis deals likely from 48"], [LD.mods(state).crisisNoPayAt, "Crises cannot be paid off from " + LD.mods(state).crisisNoPayAt]]);
    h += meter("collapse", "Collapse", state.collapse, "~" + LD.forecastQuarters(state) + "Q to breach · +" + LD.collapseTickAmountPreview(state) + "/Q", false, [[55, "Crisis deals likely from 55"]]);
    h += "</div>";
    h += '<div class="spark-row">' + sparkline(state) +
      '<div class="holdings"><b>' + LD.ownedCount(state) + "</b> regions<br><b>" + LD.plantCount(state) + "</b> plants</div></div></div>";
    h += rivalPanel(state, ui);
    h += '<div class="panel ticker" aria-label="News"><div class="panel-k">News</div><div class="tick-wrap"><div class="tick-run">';
    var items = tickerItems(state);
    function tickItem(t, hidden) {
      return t.region ? '<button class="tick-item" data-region="' + t.region + '"' + (hidden ? ' tabindex="-1" aria-hidden="true"' : "") + ">" + esc(t.text) + "</button>" : "<span" + (hidden ? ' aria-hidden="true"' : "") + ">" + esc(t.text) + "</span>";
    }
    h += items.map(function (t) { return tickItem(t, false); }).join("") + items.map(function (t) { return tickItem(t, true); }).join("");
    h += "</div></div></div>";
    var bunkerReady = !dealPhase && !state.bunkerActedThisTurn;
    h += '<button class="panel bunker-card' + (bunkerReady ? " ready" : "") + (ui.coach === "bunker" ? " coach" : "") + '" id="bunker-card">' +
      '<div class="panel-k">Private bunker · ' + esc(bunkerTally(state)) + (state.converting ? " · private" : "") + "</div>" +
      '<div class="bc-scene">' + LD.renderBunkerScene(state, { mini: true, idPrefix: "bm" }) + "</div>" +
      (ui.coach === "bunker" && ui.coachText ? '<div class="coach-inline">' + esc(ui.coachText) + "</div>" : "") +
      '<div class="bc-cta">' + (dealPhase ? "Sign a deal to unlock" : state.bunkerActedThisTurn ? "Works ordered this quarter" : "Tap to build ▸") + "</div></button>";
    h += "</aside>";

    h += '<footer class="hand">';
    var canEnd = !dealPhase;
    h += '<button class="end-q' + (canEnd ? " live" : "") + (ui.coach === "end" ? " coach" : "") + '" id="btn-endq">' +
      '<span class="eq-ico">✓</span><span class="eq-t">END QUARTER<small>' + (ui.hidePins ? "Dealing Q" + state.turn + " opportunities…" : canEnd ? "Ride the upside. Own the future." : "Pick 1 of " + state.offered.length + " deals on the map first") + "</small></span></button>";
    if (ui.coach === "end" && ui.coachText) h += '<div class="coach-bubble c-end">' + esc(ui.coachText) + "</div>";
    h += "</footer>";
    h += "</div>";
    return h;
  }

  function cardTag(state, d) {
    if (d.choices) return "Choose";
    var c = LD.payloadCash(state, d.immediate);
    if (c > 0) return "+" + money(LD.dealCashAmount(state, c, d));
    if (c < 0) return money(c);
    return "Free";
  }

  function chip(cls, text) { return '<span class="fx-chip ' + cls + '">' + esc(text) + "</span>"; }

  function payloadChips(state, deal, payload) {
    var now = [], later = [], world = [];
    var imm = payload.immediate || {};
    var listed = LD.payloadCash(state, imm);
    if (listed) {
      var cash = listed > 0 ? LD.dealCashAmount(state, listed, deal) : listed;
      now.push(chip(cash > 0 ? "good" : "cost", (cash > 0 ? "+" : "") + money(cash) + (state.converting && cash !== listed ? " (" + Math.round(LD.conversionRate(state) * 100) + "%)" : "")));
    }
    if (imm.unrest) now.push(chip(imm.unrest > 0 ? "bad" : "good", "Unrest " + signed(imm.unrest)));
    if (imm.collapse) now.push(chip(imm.collapse > 0 ? "bad" : "good", "Collapse " + signed(imm.collapse)));
    if (imm.special === "divertFilters") now.push(chip("good", state.bunker.air.level < 1 ? "Air Lv1 (discount)" : "+$12M resale"));
    var dl = payload.delay;
    if (dl) {
      var exec = LD.execById(state.executiveId);
      var due = state.turn + dl.turns + ((exec.perks && exec.perks.delayBonus) || 0);
      if (dl.cash) later.push(chip(dl.cash > 0 ? "good" : "cost", money(dl.cash)));
      if (dl.unrest) later.push(chip(dl.unrest > 0 ? "bad" : "good", "Unrest " + signed(dl.unrest)));
      if (dl.collapse) later.push(chip(dl.collapse > 0 ? "bad" : "good", "Collapse " + signed(dl.collapse)));
      if (dl.effectsIf && dl.effectsIf.collapse) later.push(chip("bad", "Collapse +" + dl.effectsIf.collapse + " unless filters funded"));
      if (dl.grantSystem) later.push(chip("good", dl.grantSystem.id + " Lv" + dl.grantSystem.level + " arrives"));
      if (later.length) later.unshift('<span class="when">Q' + due + "</span>");
    }
    var supply = LD.defaultSupply(deal, payload);
    if (supply.strain) Object.keys(supply.strain).forEach(function (g) {
      var next = Math.min(LD.GRID_DISRUPTED, LD.gridLevel(state, g) + supply.strain[g]);
      var lbl = LD.gridLabel(next);
      world.push(chip("bad", "Public " + g + " " + lbl + (lbl === "disrupted" ? " (+" + LD.mods(state).disruptSurcharge + ", 1Q late)" : lbl === "strained" ? " (+" + LD.mods(state).strainSurcharge + ")" : "")));
    });
    if (supply.ease) Object.keys(supply.ease).forEach(function (g) { world.push(chip("good", "Public " + g + " eases")); });
    return { now: now, later: later, world: world };
  }

  function regionChips(state, dealId, choiceId) {
    var eff = LD.dealRegionEffect(state, dealId, choiceId);
    if (!eff) return [];
    var out = [];
    if (eff.claim) out.push(chip("own", "Claims " + eff.regionName));
    var r = state.world.regions[eff.regionId];
    if (eff.stress > 0) out.push(chip(r.owned || eff.claim ? "bad" : "meh", eff.regionName + " stress +" + eff.stress));
    if (eff.stress < 0) out.push(chip("good", eff.regionName + " stress " + eff.stress));
    return out;
  }

  function chipRows(c, mapChips) {
    var h = "";
    if (c.now.length) h += '<div class="fx-row"><span class="row-k">Now</span>' + c.now.join("") + "</div>";
    if (c.later.length) h += '<div class="fx-row"><span class="row-k">Later</span>' + c.later.join("") + "</div>";
    var w = (mapChips || []).concat(c.world);
    if (w.length) h += '<div class="fx-row"><span class="row-k">Map</span>' + w.join("") + "</div>";
    return h;
  }

  function renderDealDossier(state, dealId) {
    var d = LD.dealById(dealId);
    var kind = LD.dealKind(d);
    var rid = state.world.pins[dealId];
    var h = '<div class="dz deal-dz k-' + kind + '">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    h += '<div class="dz-head">';
    var art = LD.dealArtKey(dealId);
    if (art) h += '<img class="dz-art" src="' + esc(LD.assetUrl(art)) + '" alt="">';
    h += '<div class="dz-copy">';
    h += '<div class="dz-k">' + esc(d.kicker) + " · " + esc(LD.REGION_NAMES[rid] || "") + (d.pack ? " · " + esc((LD.PACKS.filter(function (p) { return p.id === d.pack; })[0] || {}).name || "") : "") + "</div>";
    h += "<h3>" + esc(d.title) + "</h3>";
    h += "</div></div>";
    h += '<p class="dz-body">' + esc(d.body) + "</p>";
    if (d.choices) {
      h += '<div class="dz-choices">';
      d.choices.forEach(function (c) {
        var rebate = LD.crisisRebate(state, d, c);
        var blocked = LD.choiceBlocked(state, d, c);
        var poor = c.cost && state.cash < c.cost - rebate;
        h += '<button class="dz-choice" data-deal="' + dealId + '" data-choice="' + c.id + '"' + (poor || blocked ? " disabled" : "") + ">";
        h += "<b>" + esc(c.label) + (blocked ? " · " + esc(blocked) : poor ? " · need " + money(c.cost - rebate) : "") + "</b>";
        if (rebate && !blocked) h += '<div class="fx-row">' + chip("good", "Regulator rebate +" + money(rebate)) + "</div>";
        h += chipRows(payloadChips(state, d, c), regionChips(state, dealId, c.id)) + "</button>";
      });
      h += "</div>";
      h += '<p class="fine">Ignore it and it spreads to a neighbouring region at quarter close.</p>';
    } else {
      h += chipRows(payloadChips(state, d, d), regionChips(state, dealId));
      var poor = d.cost && state.cash < d.cost;
      h += '<button class="btn-sign" id="btn-sign" data-deal="' + dealId + '"' + (poor ? " disabled" : "") + ">" + (poor ? "Need " + money(d.cost) : "Sign the deal") + "</button>";
      h += '<p class="fine">Fine print: ' + esc(d.hint) + "</p>";
    }
    h += "</div>";
    return h;
  }

  function stressPips(r) {
    var h = '<span class="pips s-' + LD.stressLabel(r.stress) + '">';
    for (var i = 1; i <= LD.STRESS_MAX; i++) h += '<i class="' + (i <= r.stress ? "on" : "") + '"></i>';
    return h + "</span>";
  }

  var MOOD = { calm: "Calm", tense: "Protests (+1 unrest/Q)", strike: "Riots (+3 unrest/Q, plants strike)", revolt: "Revolt" };

  function renderRegionDossier(state, rid) {
    var r = state.world.regions[rid];
    var lvl = LD.stressLabel(r.stress);
    var rv = !r.owned && r.rival != null && state.rivals ? state.rivals[r.rival] : null;
    var h = '<div class="dz region-dz' + (r.owned ? " owned" : "") + (rv ? " rival" : "") + '">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    var status = r.owned ? (r.trait === "hq" ? "Headquarters" : "Your territory") : rv ? "Held by " + rv.firm : "Not yours yet";
    h += '<div class="dz-k">' + esc(status) + (r.trait === "boom" ? " · Booming" : r.trait === "crisis" ? " · In crisis" : "") + "</div>";
    h += "<h3>" + esc(LD.REGION_NAMES[rid]) + "</h3>";
    h += '<div class="dz-stat"><span>Mood</span>' + stressPips(r) + "<b>" + esc(MOOD[lvl]) + "</b></div>";
    if (LD.willRevolt(state, rid)) h += '<p class="dz-warn">⚠ Revolts at quarter close: you lose it and take unrest +' + LD.REVOLT_UNREST + ". Calm it now.</p>";
    if (LD.hazardVisible(state, rid)) h += '<div class="dz-stat"><span>Hazard</span><b>' + esc(LD.HAZARD_NAMES[r.hazard]) + "</b></div>";
    else h += '<div class="dz-stat"><span>Hazard</span><b>' + esc(LD.HAZARD_NAMES[r.hazard]) + " at collapse " + r.hazardAt + "</b></div>";
    if (r.owned && r.plant) {
      var pay = LD.plantIncome(state, rid);
      h += '<div class="dz-stat"><span>Plant</span><b>' + (r.stress >= LD.STRESS_STRIKE ? "On strike · $0M" : "+" + money(pay) + " / quarter") + " · collapse +" + LD.PLANT.collapsePerQuarter + "/Q · stress +" + LD.PLANT.stressPerQuarter + "/Q</b></div>";
    }
    /* Aim this quarter's Soothe deal at a hot region. */
    var soothe = state.phase === "deal" ? state.offered.filter(function (id) { return LD.dealKind(LD.dealById(id)) === "calm" && state.world.pins[id] !== rid; })[0] : null;
    if (soothe && r.owned && r.stress >= LD.STRESS_TENSE) {
      h += '<button class="dz-act" id="btn-aim" data-deal="' + soothe + '" data-region="' + rid + '"><b>Aim “' + esc(LD.dealById(soothe).title) + "” here</b>" +
        '<span class="fx-row">' + chip("good", "Stress −2 here instead") + chip("meh", "Free · then sign it") + "</span></button>";
    }
    if (rv) {
      h += '<p class="dz-body">' + esc(rv.firm) + " squeezes this region. Their holdings add collapse and, when they get aggressive, unrest.</p>";
      h += '<button class="dz-act" id="btn-outbid" data-region="' + rid + '"' + (LD.canOutbid(state, rid) ? "" : " disabled") + "><b>Outbid " + esc(rv.firm) + " · " + money(LD.OUTBID.cost) + "</b>" +
        '<span class="fx-row">' + chip("own", "Claims it at stress 2") + chip("bad", "Unrest +" + LD.OUTBID.unrest) + chip("meh", "Uses the regional order") + "</span></button>";
    } else if (!r.owned) {
      h += '<p class="dz-body">Win it with an <b>Acquire</b> deal (＋ pin). Owned land can host a plant.</p>';
    }
    if (r.owned) {
      var acted = state.world.actedTurn === state.turn;
      var err = LD.regionGuard(state, rid);
      h += '<p class="dz-note">One regional order per quarter' + (acted ? " · used" : " · available") + ". At 5 stress it revolts and you lose it.</p>";
      if (!r.plant) {
        var inc = LD.PLANT.income + (r.trait === "boom" ? LD.PLANT.boomBonus : 0);
        h += '<button class="dz-act" id="btn-build" data-region="' + rid + '"' + (LD.canBuildPlant(state, rid) ? "" : " disabled") + ">" +
          "<b>Build a desalination plant · " + money(LD.PLANT.cost) + "</b>" +
          '<span class="fx-row">' + chip("good", "+" + money(inc) + "/Q") + chip("bad", "Stress +1/Q") + chip("bad", "Collapse +1/Q") + "</span></button>";
      }
      h += '<button class="dz-act" id="btn-calm" data-region="' + rid + '"' + (LD.canCalmRegion(state, rid) ? "" : " disabled") + ">" +
        "<b>Charm offensive · " + money(LD.PR_PUSH.cost) + "</b>" +
        '<span class="fx-row">' + chip("good", "Stress −" + LD.PR_PUSH.calm) + "</span></button>";
      if (err && !acted && err.indexOf("own") === -1) h += '<p class="dz-note">' + esc(err) + "</p>";
    }
    h += "</div>";
    return h;
  }

  var NET_FEEDS = { air: "Air", water: "Water", power: "Power", food: "Food" };
  function renderNetDossier(state, id) {
    var lvl = LD.gridLevel(state, id);
    var gl = LD.gridLabel(lvl);
    var m = LD.mods(state);
    var h = '<div class="dz net-dz">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    h += '<div class="dz-k">Public network</div><h3>' + SYS_ICON[id] + " " + esc(NET_FEEDS[id]) + " · " + esc(gl) + "</h3>";
    h += '<p class="dz-body">Your bunker still buys ' + esc(id) + " parts from the public network. Squeeze deals tagged " + esc(id) + " strain it at quarter close; Soothe deals ease it.</p>";
    h += '<div class="dz-stat"><span>Install surcharge</span><b>' + (state.converting ? "none (private supply)" : lvl >= 2 ? "+" + money(m.disruptSurcharge) + " and 1Q late" : lvl >= 1 ? "+" + money(m.strainSurcharge) : "none") + "</b></div>";
    var queued = LD.pendingStrainLines(state).filter(function (l) { return l.id === id; });
    if (queued.length) h += '<div class="dz-stat"><span>Queued</span><b>' + queued.map(function (l) { return "+" + l.amount + " at Q" + l.due; }).join(", ") + "</b></div>";
    h += "</div>";
    return h;
  }

  function renderRivalDossier(state, idx) {
    var rv = state.rivals[idx];
    var n = LD.rivalRegions(state, idx);
    var h = '<div class="dz rival-dz">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    h += '<div class="dz-k">Rival executive · aggression ' + Math.round(rv.aggr * 100) + "%</div><h3>" + esc(rv.name) + "</h3>";
    h += '<div class="exec-t">' + esc(rv.firm) + "</div>";
    h += '<div class="dz-stat"><span>Holdings</span><b>' + (n.length ? n.map(function (id) { return LD.REGION_NAMES[id]; }).join(", ") : "none yet") + "</b></div>";
    h += '<div class="dz-stat"><span>Engineer</span><b>' + (rv.engineer ? "poached (yours +$4M)" : "not yet") + "</b></div>";
    h += '<div class="dz-stat"><span>Bunker</span><b>' + (rv.sealed ? "sealed in" : "seals around Q" + rv.sealTurn + " (panic: collapse spike)") + "</b></div>";
    if (!rv.sealed) {
      h += '<button class="dz-act" id="btn-leak" data-rival="' + idx + '"' + (LD.canLeak(state, idx) ? "" : " disabled") + "><b>Leak their contracts</b>" +
        '<span class="fx-row">' + chip("good", "Their seal slips " + LD.LEAK.delay + "Q") + chip("bad", "Unrest +" + LD.LEAK.unrest) + chip("meh", "Uses the regional order") + "</span></button>";
      if (n.length) h += '<p class="dz-note">Tap one of their regions to outbid them for it.</p>';
    }
    h += "</div>";
    return h;
  }

  function renderExecDossier(state) {
    var exec = LD.execById(state.executiveId);
    var initials = exec.name.replace(/^Dr\. /, "").split(" ").map(function (p) { return p[0]; }).join("");
    var h = '<div class="dz exec-dz">';
    h += '<div class="dz-k">Executive dossier</div>';
    h += '<div class="exec-id"><div class="avatar" aria-hidden="true">' + esc(initials) + '</div><div><h3>' + esc(exec.name) + "</h3>" +
      '<div class="exec-t">' + esc(exec.title) + "<br>" + esc(exec.firm) + "</div></div></div>";
    h += '<div class="target"><span>◎</span><b>Goal</b> All 4 bunker systems at Lv 2+, then seal (from Q' + LD.MIN_EVAC_TURN + ").</div>";
    if (LD.fyDossier) h += LD.fyDossier(state);
    var md = LD.mandateById(state.mandate);
    if (md) h += '<div class="target mandate"><span>◈</span><b>Board mandate</b> ' + esc(md.text) + " · +" + LD.MANDATE_BONUS + " ◈ on a win</div>";
    h += '<div class="dz-stat"><span>Credit rating</span><b>' + esc(LD.ratingName(state.rating)) + " · exit ×" + LD.ratingMultiplier(state.rating).toFixed(1) + " ◈</b></div>";
    if (state.perks && state.perks.length) {
      var slots = LD.perkSlots({ owned: ["slot:2"] }, state.rating);
      h += '<div class="dz-stat"><span>Perquisites</span><b>' + state.perks.slice(0, slots).map(function (id) { return (LD.perkById(id) || {}).name; }).join(", ") + "</b></div>";
    }
    h += '<p class="quote">“' + esc(exec.blurb) + "”</p>";
    h += '<div class="dz-stat"><span>Seed</span><b>' + esc(String(state.seedLabel)) + "</b></div>";
    h += "</div>";
    return h;
  }

  function renderDossier(state, ui) {
    if (ui.hidePins) return renderExecDossier(state);
    if (ui.selDeal && state.phase === "deal" && state.offered.indexOf(ui.selDeal) !== -1) return renderDealDossier(state, ui.selDeal);
    if (ui.selRegion) return renderRegionDossier(state, ui.selRegion);
    if (ui.selNet) return renderNetDossier(state, ui.selNet);
    if (ui.selRival != null && state.rivals && state.rivals[ui.selRival]) return renderRivalDossier(state, ui.selRival);
    return renderExecDossier(state);
  }

  /* Short hover / long-press card for a region. */

    var info = LD.bossInfo(state, q);

    var act = LD.ACTS[LD.actOf(q) - 1];
    var h = '<div class="fy-boss b-' + info.id + '"><div class="fy-boss-ico" aria-hidden="true">' + info.icon + "</div>";
    h += '<div class="dz-k">' + (mode === "confirm" ? "Boss quarter · Q" + q : "Act " + act.roman + " · " + esc(act.name) + " · boss at Q" + q) + "</div>";
    h += "<h2>" + esc(info.name) + "</h2>";
    h += '<p class="fy-demand">' + esc(info.demand) + "</p>";
    h += '<div class="fy-outs"><div class="fy-out good"><b>Beat it</b><span>' + esc(info.beat) + (info.id === "reckoning" ? "" : " · rare draft + 10 ◈") + '</span></div><div class="fy-out bad"><b>Miss it</b><span>' + esc(info.miss) + "</span></div></div>";
    if (mode === "confirm" && info.id === "strike") h += '<p class="fy-note">Unrest now ' + state.unrest + (state.unrest >= 40 ? " · the big hit applies" : " · under 40, the small hit applies") + ".</p>";
    if (mode === "confirm" && info.choice) h += '<p class="fy-note">Cash now ' + money(state.cash) + ". It resolves when you end the quarter.</p>";
    if (mode === "confirm" && info.id === "reckoning") h += '<p class="fy-note">' + esc(LD.readinessSummary(state).tally) + ". " + (LD.readinessSummary(state).canWin ? "Your bunker would hold." : "Your bunker would not hold.") + "</p>";
    return h + "</div>";
  }

  /* Executive dossier block: act, next boss, sealing rule. */
  function fyDossier(state) {
    var f = state.fy; if (!f) return "";
    var q = nextBossQ(state), info = q ? LD.bossInfo(state, q) : null;
    var h = '<div class="target fy-target"><span>⚑</span><b>Act ' + LD.ACTS[f.act - 1].roman + " · " + esc(LD.ACTS[f.act - 1].name) + "</b> Q" + state.turn + " of " + f.rules.finalQ;
    if (info) h += '<button class="fy-bosslink" data-boss-q="' + q + '">' + info.icon + " " + esc(info.name) + " · Q" + q + " ▸</button>";
    return h + "</div>";
  }

  LD.renderDraft = renderDraft;
  LD.renderPortfolio = renderPortfolio;
  LD.portfolioChip = portfolioChip;
  LD.actChip = actChip;
  LD.renderBossCard = bossCard;
  LD.fyDossier = fyDossier;
  LD.nextBossQ = nextBossQ;
  if (typeof module !== "undefined" && module.exports) module.exports = LD;
})(typeof globalThis !== "undefined" ? globalThis : this);

  </script>
  <script>
/* Last Dividend — B3 touch-first UI. No hover-only actions. */
(function () {
  var state = null;
  var screen = "title";
  var tutorialPage = 0;
  var selectedExec = "mara";
  var seedDraft = "";
  var crisisOpen = null;
  var lastFired = [];
  var screenIntent = "title";
  var selectedRating = null;
  var lastEnd = null;
  var boardBack = "title";
  var boardNotice = "";
  var boardTab = "seats";
  var boardPage = 0;
  var endLetter = false;
  function boardShopPageSize() {
    var h = Math.round((window.visualViewport && visualViewport.height) || window.innerHeight || 800);
    var w = window.innerWidth || 400;
    var cols = w >= 700 ? 2 : 1;
    if (cols === 1) return h < 900 ? 3 : 4;
    return h < 720 ? 4 : 6;
  }

  function $(id) { return document.getElementById(id); }

  function defaultMeta() {
    return LD.migrateMeta({ seenTutorial: false, history: [], midRun: null, finished: 0, wins: 0 });
  }

  function loadMeta() {
    try {
      var raw = localStorage.getItem(LD.SAVE_KEY);
      if (!raw) return defaultMeta();
      var parsed = JSON.parse(raw);
      var meta = defaultMeta();
      Object.keys(parsed).forEach(function (k) { meta[k] = parsed[k]; });
      if (!Array.isArray(meta.history)) meta.history = [];
      return LD.migrateMeta(meta);
    } catch (e) {
      return defaultMeta();
    }
  }

  function saveMeta(meta) {
    try { localStorage.setItem(LD.SAVE_KEY, JSON.stringify(meta)); } catch (e) {}
  }

  function persistRun() {
    var meta = loadMeta();
    meta.midRun = state && !state.ended ? state : null;
    saveMeta(meta);
  }

  function clearMidRun() {
    var meta = loadMeta();
    meta.midRun = null;
    saveMeta(meta);
  }

  function recordEnding() {
    var applied = LD.applyRunEnd(loadMeta(), state);
    var meta = applied.meta;
    lastEnd = { payout: applied.payout, newRating: applied.newRating, seed: state.seed, turn: state.turn, xp: applied.xp, toastShown: false };
    meta.finished += 1;
    if (state.ending && state.ending.kind === "win") meta.wins += 1;
    meta.midRun = null;
    meta.history.unshift({
      at: Date.now(),
      seed: state.seedLabel,
      executiveId: state.executiveId,
      result: state.ending.kind,
      reason: state.ending.reason,
      title: state.ending.title,
      turn: state.turn,
      cash: state.cash,
      unrest: state.unrest,
      collapse: state.collapse,
      rating: state.rating | 0,
      dividends: applied.payout.total
    });
    var cap = meta.owned.indexOf("annual:history") !== -1 ? 50 : 12;
    if (meta.history.length > cap) meta.history.length = cap;
    saveMeta(meta);
  }

  function tick() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!tick.ctx) tick.ctx = new Ctx();
      var ctx = tick.ctx;
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "square";
      o.frequency.value = 220;
      g.gain.value = 0.025;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
      o.stop(ctx.currentTime + 0.07);
    } catch (e) {}
  }

  function show(name) {
    if (typeof PN !== "undefined" && PN.on && (name !== "desk" || PN.mode === "tip")) pennyStop();
    screen = name;
    document.body.classList.toggle("on-desk", name === "desk");
    ["title", "tutorial", "exec", "deal", "bunker", "desk", "end", "history", "boardroom"].forEach(function (id) {
      var el = $("screen-" + id);
      if (!el) return;
      el.classList.toggle("on", id === name);
    });
    hideOverlay();
    window.scrollTo(0, 0);
  }

  function renderTitle() {
    $("screen-title").innerHTML = LD.renderTitle({ meta: loadMeta(), seedDraft: seedDraft });
    $("btn-new").addEventListener("click", function () {
      tick();
      seedDraft = $("seed-input").value.trim();
      selectedExec = "mara";
      goExec();
    });
    var cont = $("btn-continue");
    if (cont) {
      cont.addEventListener("click", function () {
        tick();
        state = loadMeta().midRun;
        if (state && LD.ensureSupply) LD.ensureSupply(state);
        if (state && LD.ensureWorld) LD.ensureWorld(state);
        if (state && LD.ensureFY) LD.ensureFY(state);
        crisisOpen = null;
        enterPlay();
        if (state && !state.ended) fyAfterOpen();
      });
    }
    $("btn-roll").addEventListener("click", function () {
      tick();
      seedDraft = String((Math.floor(Math.random() * 900000) + 100000));
      $("seed-input").value = seedDraft;
    });
    $("seed-input").addEventListener("input", function () { seedDraft = this.value; });
    $("btn-how").addEventListener("click", function () { tick(); openHowTo(false); });
    $("btn-history").addEventListener("click", function () { tick(); show("history"); renderHistory(); });
    $("btn-boardroom").addEventListener("click", function () { tick(); openBoardroom("title"); });
  }

  /* ---------- The Boardroom ---------- */
  function openBoardroom(back) {
    boardBack = back || "title";
    boardNotice = "";
    boardTab = "seats";
    boardPage = 0;
    show("boardroom");
    renderBoardroom();
  }
  function renderBoardroom() {
    $("screen-boardroom").innerHTML = LD.renderBoardroom({ meta: loadMeta(), notice: boardNotice, tab: boardTab, page: boardPage, pageSize: boardShopPageSize() });
    Array.prototype.forEach.call(document.querySelectorAll("#screen-boardroom [data-br-tab]"), function (b) {
      b.addEventListener("click", function () {
        boardTab = b.getAttribute("data-br-tab");
        boardPage = 0;
        boardNotice = "";
        renderBoardroom();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#screen-boardroom [data-br-page]"), function (b) {
      b.addEventListener("click", function () {
        boardPage = +b.getAttribute("data-br-page") || 0;
        renderBoardroom();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#screen-boardroom [data-buy]"), function (b) {
      b.addEventListener("click", function () {
        tick();
        var res = LD.buyItem(loadMeta(), b.getAttribute("data-buy"));
        if (!res.ok) { boardNotice = res.error; renderBoardroom(); return; }
        var m = res.meta;
        if (res.item.wing === "perks" && res.item.key.indexOf("perk:") === 0 && m.equipped.length < LD.perkSlots(m)) m.equipped.push(res.item.key.slice(5));
        if (res.item.wing === "portfolio") { m.cosmetics[res.item.slot] = res.item.id; }
        saveMeta(m);
        applyCosmetics();
        boardNotice = "Acquired: " + res.item.name + ". The board approves.";
        renderBoardroom();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#screen-boardroom [data-equip]"), function (b) {
      b.addEventListener("click", function () {
        tick();
        var parts = b.getAttribute("data-equip").split(":");
        var m = loadMeta();
        m.cosmetics[parts[0]] = parts[1];
        saveMeta(m);
        applyCosmetics();
        boardNotice = "";
        renderBoardroom();
      });
    });
    $("btn-br-play").addEventListener("click", function () { tick(); seedDraft = ""; goExec(); });
    setTimeout(function () { if (screen === "boardroom") pennyTip("dividends"); }, 400);
    $("btn-br-back").addEventListener("click", function () {
      tick();
      if (boardBack === "exec") goExec();
      else if (boardBack === "end" && state && state.ended) showEnd();
      else { show("title"); renderTitle(); }
    });
  }

  function applyCosmetics() {
    var eq = LD.equippedCosmetics(loadMeta());
    var cls = document.body.className.split(" ").filter(function (c) { return c && c.indexOf("cos-") !== 0; });
    Object.keys(eq).forEach(function (k) { cls.push("cos-" + k + "-" + eq[k]); });
    document.body.className = cls.join(" ");
  }

  function renderTutorial() {
    $("screen-tutorial").innerHTML = LD.renderTutorial(tutorialPage);
    function finish() {
      var meta = loadMeta();
      meta.seenTutorial = true;
      saveMeta(meta);
      if (screenIntent === "exec") goExec();
      else if ((screenIntent === "deal" || screenIntent === "bunker" || screenIntent === "play") && state) enterPlay();
      else { show("title"); renderTitle(); }
    }
    var next = $("btn-next");
    if (next) next.addEventListener("click", function () { tick(); tutorialPage += 1; renderTutorial(); });
    var skip = $("btn-skip");
    if (skip) skip.addEventListener("click", function () { tick(); tutorialPage = LD.TUTORIAL.length - 1; finish(); });
    var done = $("btn-done");
    if (done) done.addEventListener("click", function () { tick(); finish(); });
  }

  function goExec() {
    var meta = loadMeta();
    screenIntent = "exec";
    if (false && !meta.seenTutorial) {
      tutorialPage = 0;
      show("tutorial");
      renderTutorial();
      return;
    }
    show("exec");
    renderExec();
  }

  function currentRating(meta) {
    var max = LD.ratingUnlocked(meta, selectedExec);
    if (selectedRating == null || selectedRating > max) selectedRating = max;
    return selectedRating;
  }

  function renderExec() {
    var meta = loadMeta();
    if (!LD.isExecutiveUnlocked(selectedExec, meta)) selectedExec = "mara";
    $("screen-exec").innerHTML = LD.renderExec({ meta: meta, selectedExec: selectedExec, rating: currentRating(meta) });
    Array.prototype.forEach.call(document.querySelectorAll(".exec-card"), function (btn) {
      btn.addEventListener("click", function () {
        tick();
        selectedExec = btn.getAttribute("data-id");
        selectedRating = null;
        renderExec();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".rating-chip"), function (btn) {
      btn.addEventListener("click", function () { tick(); selectedRating = +btn.getAttribute("data-rating"); renderExec(); });
    });
    bindLoadoutChips(document.querySelector("#screen-exec"), false);
    var lo = $("btn-loadout");
    if (lo) lo.addEventListener("click", function () { tick(); openLoadoutSheet(); });
    $("btn-boardroom2").addEventListener("click", function () { tick(); openBoardroom("exec"); });
    $("btn-start").addEventListener("click", function () { tick(); startRun(); });
    if ((meta.finished | 0) >= 1) setTimeout(function () { if (screen === "exec") pennyTip("ratings"); }, 400);
    $("btn-back").addEventListener("click", function () { tick(); show("title"); renderTitle(); });
  }
  function openLoadoutSheet() {
    var ex = $("lo-extra");
    if (!ex) return;
    showFy('<div class="lo-sheet"><div class="kicker">Executive loadout</div>' + ex.innerHTML + "</div>", '<button class="btn btn-coral" id="lo-done">Done</button>', function () {
      bindLoadoutChips($("overlay"), true);
      $("lo-done").addEventListener("click", function () { tick(); hideOverlay(); });
    });
  }
  function bindLoadoutChips(root, inSheet) {
    if (!root) return;
    var after = function () { renderExec(); if (inSheet) openLoadoutSheet(); };
    Array.prototype.forEach.call(root.querySelectorAll(".perk-chip[data-perk]"), function (btn) {
      btn.addEventListener("click", function () {
        tick();
        var m = loadMeta();
        var id = btn.getAttribute("data-perk");
        var i = m.equipped.indexOf(id);
        if (i !== -1) m.equipped.splice(i, 1);
        else {
          m.equipped.push(id);
          var slots = LD.perkSlots(m);
          if (m.equipped.length > slots) m.equipped = m.equipped.slice(-slots);
        }
        saveMeta(m);
        after();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll(".pack-chip"), function (btn) {
      btn.addEventListener("click", function () {
        tick();
        var m = loadMeta();
        var id = btn.getAttribute("data-pack");
        var i = m.packsOff.indexOf(id);
        if (i === -1) m.packsOff.push(id); else m.packsOff.splice(i, 1);
        saveMeta(m);
        after();
      });
    });
  }

  function startRun() {
    var meta = loadMeta();
    var rating = currentRating(meta);
    state = LD.createRun({ seed: seedDraft, executiveId: selectedExec, rating: rating, perks: meta.equipped.slice(0, LD.perkSlots(meta, rating)), packs: LD.activePacks(meta), level: LD.execLevel ? LD.execLevel(meta, selectedExec) : 1 });
    if (state.fy) state.fy.actIntro = 1;
    lastEnd = null;
    crisisOpen = null;
    lastFired = [];
    clearSel();
    hidePins = false;
    persistRun();
    enterPlay();
    if (PN.forceStart) { PN.forceStart = false; pennySave(function (p) { p.offered = true; }); pennyStart(); }
    else if (rating === 0) pennyAutoOffer();
    if (PN.on) { if (state.fy) state.fy.actIntro = 0; persistRun(); }
    else fyAfterOpen();
  }

  function enterPlay() {
    if (!state) { show("title"); renderTitle(); return; }
    if (LD.ensureWorld) LD.ensureWorld(state);
    if (state.ended) { showEnd(); return; }
    show("desk");
    renderDesk();
  }

  /* ---------- Desk (world map) ---------- */
  var sel = { deal: null, region: null, net: null, rival: null, choice: null };
  var bunkerMode = "install";
  var hidePins = false;
  var lens = "none";
  var mq = window.matchMedia ? window.matchMedia("(orientation: landscape) and (min-width: 900px)") : null;
  var rmq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function isPhone() { return !(mq && mq.matches); }
  function reduced() { return !!(rmq && rmq.matches); }

  function coachInfo() {
    var meta = loadMeta();
    if (meta.coachDone || !state || state.turn !== 1 || PN.on) return {};
    if (state.phase === "deal") {
      if (sel.deal) return {};
      var pick = state.offered[0];
      state.offered.forEach(function (id) { if (LD.dealKind(LD.dealById(id)) === "claim") pick = id; });
      return { coach: "pin", coachDeal: pick, coachText: "Tap the glowing pin to open a deal" };
    }
    if (!state.bunkerActedThisTurn) return { coach: "bunker", coachText: "Build your bunker (optional)" };
    return { coach: "end", coachText: "End the quarter and watch the world react" };
  }

  function uiOpts() {
    var c = coachInfo();
    var phone = isPhone();
    return { selDeal: sel.deal, selRegion: sel.region, selNet: sel.net, selRival: sel.rival, coach: c.coach, coachDeal: c.coachDeal, coachText: c.coachText,
      hidePins: hidePins, lens: lens, interactive: true, phone: phone, globe: !phone };
  }

  function renderDesk(from) {
    var el = $("screen-desk");
    el.innerHTML = LD.renderDesk(state, uiOpts());
    bindDesk();
    if (from) animateMeters(from);
  }

  function animateMeters(from) {
    var map = { cash: from.cash, unrest: from.unrest, collapse: from.collapse };
    Array.prototype.forEach.call(document.querySelectorAll(".desk .meter"), function (m) {
      var key = m.className.match(/m-(\w+)/)[1];
      var to = +m.getAttribute("data-num");
      var start = map[key];
      if (start == null || start === to) return;
      var bar = m.querySelector(".m-bar span");
      var val = m.querySelector(".m-val");
      var money = m.getAttribute("data-money");
      bar.style.transition = "none";
      bar.style.width = Math.max(0, Math.min(100, start)) + "%";
      void bar.offsetWidth;
      bar.style.transition = "";
      bar.style.width = Math.max(0, Math.min(100, to)) + "%";
      m.classList.add(to > start ? "rise" : "fall");
      var t0 = null;
      function stepFn(t) {
        if (!t0) t0 = t;
        var k = Math.min(1, (t - t0) / 900);
        var v = Math.round(start + (to - start) * (1 - Math.pow(1 - k, 3)));
        val.textContent = money ? LD.formatMoney(v) : v;
        if (k < 1) requestAnimationFrame(stepFn);
      }
      requestAnimationFrame(stepFn);
    });
  }

  /* In-place update: dossier, selection classes, map preview and rail. No map rebuild. */
  function refreshSelection() {
    var desk = document.querySelector(".desk");
    if (!desk) return;
    var dz = $("dossier");
    dz.innerHTML = LD.renderDossier(state, uiOpts());
    desk.classList.toggle("has-sel", !!(sel.deal || sel.region || sel.net || sel.rival != null));
    Array.prototype.forEach.call(desk.querySelectorAll(".pin"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-deal") === sel.deal);
      if (sel.deal) n.classList.remove("coach");
    });
    Array.prototype.forEach.call(desk.querySelectorAll(".region"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-region") === sel.region);
    });
    Array.prototype.forEach.call(desk.querySelectorAll(".net-chip"), function (n) { n.classList.toggle("sel", n.getAttribute("data-net") === sel.net); });
    Array.prototype.forEach.call(desk.querySelectorAll(".rv-row"), function (n) { n.classList.toggle("sel", +n.getAttribute("data-rival") === sel.rival); });
    updatePreview(sel.deal, null);
    var cb = desk.querySelector(".coach-bubble.c-pin");
    if (cb && sel.deal) cb.remove();
    bindDossier();
    dz.classList.remove("pop");
    void dz.offsetWidth;
    dz.classList.add("pop");
    if (isPhone() && (sel.deal || sel.region)) {
      var board = desk.querySelector(".board");
      if (board) window.scrollTo({ top: Math.max(0, board.getBoundingClientRect().top + window.scrollY - 8), behavior: reduced() ? "auto" : "smooth" });
    }
  }

  function updatePreview(dealId, choiceId) {
    var o = uiOpts();
    var pv = document.querySelector("#screen-desk #map-preview");
    if (pv) pv.innerHTML = LD.renderMapPreview(state, dealId, choiceId, o).replace(/href="#rg-/g, 'href="#mrg-');
    var rail = $("rail-wrap");
    if (rail) { rail.innerHTML = LD.renderRail(state, dealId, choiceId); bindBossLinks(rail); }
  }

  function clearSel() { sel.deal = null; sel.region = null; sel.net = null; sel.rival = null; }
  function selectDealPin(id) {
    if (state.phase !== "deal") return;
    clearSel();
    sel.deal = id;
    refreshSelection();
    pennyEmit("pin");
    if (LD.dealKind(LD.dealById(id)) === "crisis") pennyTip("crisis");
  }
  function selectRegion(id) { clearSel(); sel.region = id; refreshSelection(); pennyTip("region"); }
  function selectNet(id) { clearSel(); sel.net = id; refreshSelection(); }
  function selectRival(i) { clearSel(); sel.rival = i; refreshSelection(); }

  function activateOnKey(n, fn) {
    n.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); }
    });
  }

  function flashRegion(id) {
    var g = document.querySelector('.desk .region[data-region="' + id + '"]');
    if (!g) return;
    g.classList.remove("flash");
    void g.getBoundingClientRect();
    g.classList.add("flash");
    setTimeout(function () { g.classList.remove("flash"); }, 1600);
  }

  function bindDesk() {
    var pins = Array.prototype.slice.call(document.querySelectorAll(".desk .pin"));
    pins.forEach(function (n, i) {
      function open() { tick(); selectDealPin(n.getAttribute("data-deal")); }
      n.addEventListener("click", function (e) { e.stopPropagation(); open(); });
      activateOnKey(n, open);
      /* Drag a pin to preview what it does; dropping it opens the deal. */
      n.addEventListener("pointerdown", function (e) {
        if (state.phase !== "deal" || (e.button && e.button > 0)) return;
        e.stopPropagation();
        var svg = n.ownerSVGElement;
        if (!svg || !svg.viewBox || !svg.viewBox.baseVal) return;
        var vb = svg.viewBox.baseVal, rr = svg.getBoundingClientRect();
        var k = Math.max(vb.width / Math.max(1, rr.width), vb.height / Math.max(1, rr.height));
        var orig = n.getAttribute("transform");
        var m = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(orig || "");
        if (!m) return;
        var sx = e.clientX, sy = e.clientY, moved = false, id = n.getAttribute("data-deal");
        function mv(ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          if (!moved && Math.sqrt(dx * dx + dy * dy) < 8) return;
          if (!moved) { moved = true; n.classList.add("dragging"); hideTip(); updatePreview(id, null); }
          n.setAttribute("transform", "translate(" + (+m[1] + dx * k).toFixed(1) + " " + (+m[2] + dy * k).toFixed(1) + ")");
        }
        function up() {
          window.removeEventListener("pointermove", mv);
          window.removeEventListener("pointerup", up);
          window.removeEventListener("pointercancel", up);
          if (moved) { n.setAttribute("transform", orig); n.classList.remove("dragging"); selectDealPin(id); }
        }
        window.addEventListener("pointermove", mv);
        window.addEventListener("pointerup", up);
        window.addEventListener("pointercancel", up);
      });
      n.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); pins[(i + 1) % pins.length].focus(); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); pins[(i + pins.length - 1) % pins.length].focus(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".desk .sr-deal"), function (n) {
      n.addEventListener("click", function () { tick(); selectDealPin(n.getAttribute("data-deal")); var dz = $("dossier"); var f = dz && dz.querySelector("button:not(.dz-x)"); if (f) f.focus(); });

  /* Phone: pinch to zoom, drag to pan, double-tap to reset. */
  var zoom = { s: 1, x: 0, y: 0 };
  function applyZoom(el) {
    el.style.transform = zoom.s === 1 ? "" : "translate(" + zoom.x + "px," + zoom.y + "px) scale(" + zoom.s + ")";
  }
  function bindZoom() {
    var el = $("map-zoom");
    if (!el) return;
    applyZoom(el);
    var pts = {}, start = null, lastTap = 0;
    function count() { return Object.keys(pts).length; }
    function clampZoom() {
      zoom.s = Math.max(1, Math.min(3, zoom.s));
      var w = el.offsetWidth, h = el.offsetHeight;
      zoom.x = Math.min(0, Math.max(w - w * zoom.s, zoom.x));
      zoom.y = Math.min(0, Math.max(h - h * zoom.s, zoom.y));
      if (zoom.s === 1) { zoom.x = 0; zoom.y = 0; }
    }
    el.addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "touch") return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var now = Date.now();
      if (count() === 1 && now - lastTap < 300 && zoom.s > 1) { zoom = { s: 1, x: 0, y: 0 }; applyZoom(el); }
      lastTap = now;
      start = { zoom: { s: zoom.s, x: zoom.x, y: zoom.y }, pts: JSON.parse(JSON.stringify(pts)) };
    });
    el.addEventListener("pointermove", function (e) {
      if (!pts[e.pointerId] || !start) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      var r = el.parentNode.getBoundingClientRect();
      if (ids.length >= 2 && start.pts[ids[0]] && start.pts[ids[1]]) {
        var a0 = start.pts[ids[0]], b0 = start.pts[ids[1]], a1 = pts[ids[0]], b1 = pts[ids[1]];
        var d0 = Math.hypot(a0.x - b0.x, a0.y - b0.y) || 1, d1 = Math.hypot(a1.x - b1.x, a1.y - b1.y);
        var k = d1 / d0;
        var cx = (a0.x + b0.x) / 2 - r.left, cy = (a0.y + b0.y) / 2 - r.top;
        var nx = (a1.x + b1.x) / 2 - r.left, ny = (a1.y + b1.y) / 2 - r.top;
        zoom.s = start.zoom.s * k;
        zoom.x = nx - (cx - start.zoom.x) * k;
        zoom.y = ny - (cy - start.zoom.y) * k;
        suppressTap = Date.now() + 400;
      } else if (ids.length === 1 && start.zoom.s > 1) {
        var p0 = start.pts[ids[0]], p1 = pts[ids[0]];
        if (!p0) return;
        if (Math.abs(p1.x - p0.x) + Math.abs(p1.y - p0.y) > 8) suppressTap = Date.now() + 300;
        zoom.x = start.zoom.x + (p1.x - p0.x);
        zoom.y = start.zoom.y + (p1.y - p0.y);
      } else return;
      clampZoom();
      applyZoom(el);
    });
    function up(e) {
      delete pts[e.pointerId];
      start = count() ? { zoom: { s: zoom.s, x: zoom.x, y: zoom.y }, pts: JSON.parse(JSON.stringify(pts)) } : null;
    }
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }

  function boardPoint(regionId) {

  var floatStack = {};

    var now = Date.now();

    if (!st || now - st.t > 1600) st = floatStack[regionId] = { n: 0, t: now };
    var k = st.n++;

  function placeFloat(fx, x, y, text, cls, delay) {

  function zoomFrom(view, from) {

    view.style.transformOrigin = "0 0";
    view.style.transition = "none";
    view.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
    view.style.opacity = "0.4";

  /* ---------- Quarter close: the world reacts, one beat at a time, then the report ---------- */
  var closing = false;
  var seq = null;
  function endQuarter(opts) {
    opts = opts || {};
    if (closing) return;
    if (state.phase !== "deal" && !opts.confirmed && LD.bossInfo && LD.bossInfo(state, state.turn)) { showBossConfirm(); return; }
    if (state.phase === "deal") {
      var desk = document.querySelector(".desk");
      var btn = $("btn-endq");
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      Array.prototype.forEach.call(desk.querySelectorAll(".pin"), function (p) { p.classList.add("coach"); });
      return;
    }
    var prev = state;
    var res = LD.closeQuarter(state, { bossChoice: opts.bossChoice });
    if (!res.ok) { flash(res.error); return; }
    closing = true;
    state = res.state;
    pennyEmit("endq");
    if ((res.world || []).some(function (ev) { return /^rival/.test(ev.kind || ""); }) || res.sniped) PN.pendingRival = true;
    if (state.ended) recordEnding();
    else persistRun();
    var meta = loadMeta();
    if (!meta.coachDone) { meta.coachDone = true; saveMeta(meta); }
    var desk = document.querySelector(".desk");
    desk.classList.add("closing");
    var fx = $("fx");
    var stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.innerHTML = "Q" + prev.turn + " <span>closed</span>";
    fx.appendChild(stamp);
    var step = reduced() ? 260 : 620;
    seq = { timers: [], done: false };
    function later(fn, ms) { seq.timers.push(setTimeout(fn, ms)); }
    function finish() {
      if (!seq || seq.done) return;
      seq.done = true;
      seq.timers.forEach(clearTimeout);
      var f = $("fx");
      if (f) f.innerHTML = "";
      closing = false;
      showReport(prev, res);
    }
    later(function () {
      clearSel();
      hidePins = true;
      renderDesk(prev);
      var skip = document.createElement("button");
      skip.className = "skip-btn";
      skip.id = "btn-skip-react";
      skip.textContent = "Skip ▸";
      skip.addEventListener("click", function () { tick(); finish(); });
      var board = document.querySelector(isPhone() ? ".desk .board-tilt" : ".desk .board") || document.querySelector(".desk .board");
      if (board) board.appendChild(skip);
      var beats = [];
      /* 1. Delayed effects land (from the rail). */
      (res.fired || []).forEach(function (f) {
        if (f.world) return;
        if (f.fy) {
          var ft = f.fy === "boss" ? (f.beaten ? "⚑ " + (LD.BOSSES[f.boss] || {}).name + " beaten!" : "⚑ " + (LD.BOSSES[f.boss] || {}).name + ": missed") : f.text.replace(/\.$/, "");
          beats.push(function (dy) { floatCenter(ft, f.fy === "boss" ? (f.beaten ? "good big boss" : "bad big boss") : f.fy === "liability" ? "bad" : "cash", 0, dy); });
          return;
        }
        var short = (f.source || "Delayed effect") + (f.item ? " arrives" : " lands");
        var m = /\(([^)]*)\)/.exec(f.text || "");
        beats.push(function (dy) { floatCenter(short + (m ? " · " + m[1] : ""), f.item ? "good" : "bad", 0, dy); });
      });

      '<div class="pn-actions"><button class="pn-alt" type="button" hidden></button><button class="pn-next" type="button">Next ▸</button></div></div>' +
      '<button class="pn-skip" type="button">Skip tutorial</button></div>';
    document.body.appendChild(el);
    el.querySelector(".pn-next").addEventListener("click", function (e) { e.stopPropagation(); tick(); pennyNext(); });
    el.querySelector(".pn-skip").addEventListener("click", function (e) { e.stopPropagation(); tick(); if (PN.mode === "tip") pennyMuteTips(); else pennySkip(); });
    el.querySelector(".pn-alt").addEventListener("click", function (e) { e.stopPropagation(); tick(); pennySkip(); });
    el.querySelector(".pn-text").addEventListener("click", function () { pennyFinishType(); });
    Array.prototype.forEach.call(el.querySelectorAll(".pn-blk"), function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        if (PN.mode === "tip") { pennyCloseTip(); return; }
        var a = el.querySelector(".pn-arrow");
        a.classList.remove("nudge"); void a.offsetWidth; a.classList.add("nudge");
      });
    });
    PN.el = el;
    return el;
  }

  function pennyType(html) {
    var el = PN.el.querySelector(".pn-text");
    var out = "", inTag = false;
    for (var i = 0; i < html.length; i++) {
      var c = html[i];
      if (c === "<") inTag = true;
      if (inTag) { out += c; if (c === ">") inTag = false; continue; }
      if (c === "&") { var j = html.indexOf(";", i); out += '<span class="ch">' + html.slice(i, j + 1) + "</span>"; i = j; continue; }

    el.innerHTML = out;
    PN.el.querySelector(".pn-sr").textContent = el.textContent;
    var chars = el.querySelectorAll(".ch");
    clearInterval(PN.typer);

    el.classList.remove("done");
    PN.typed = false;
    var k = 0;
    PN.typer = setInterval(function () {
      for (var s = 0; s < 2 && k < chars.length; s++) chars[k++].classList.add("on");
      if (k >= chars.length) pennyFinishType();

  }
  function pennyFinishType() {
    clearInterval(PN.typer);
    if (!PN.el) return;
    PN.el.querySelector(".pn-text").classList.add("done");
    PN.typed = true;
  }

  function pennyShowStep(step) {
    var el = pennyBuild();
    PN.cur = step;
    PN.scrolled = false;
    PN.shownFor = null;
    el.querySelector(".pn-face").src = assetUrlP(PENNY_FACES[step.face] || "penny-wink");
    var count = el.querySelector(".pn-count");
    count.textContent = step.n ? step.n + " / " + TOUR_TOTAL : "";

    var alt = el.querySelector(".pn-alt");
    var skip = el.querySelector(".pn-skip");
    alt.hidden = true;
    if (PN.mode === "tip") { next.textContent = "Got it ✓"; skip.textContent = "Mute tips"; }
    else if (step.offer) { next.textContent = "Yes, show me ▸"; skip.textContent = "Skip tutorial"; }
    else if (step.last) { next.textContent = "Let's go! ✦"; skip.textContent = "Skip tutorial"; }
    else { next.textContent = step.label || (step.act ? "Do it for me ▸" : "Next ▸"); skip.textContent = "Skip tutorial"; }
    if (step.scrollTo && isPhone()) { var st = pq(step.scrollTo); if (st) try { st.scrollIntoView({ block: "start" }); } catch (e) {} }
    next.hidden = !!step.passive;
    el.classList.toggle("is-tip", PN.mode === "tip");
    el.classList.toggle("is-passive", !!step.passive);
    el.classList.toggle("is-action", !!step.act);
    pennyType(typeof step.text === "function" ? step.text() : step.text);
    el.hidden = false;
    pennyPlace();
    var box = el.querySelector(".pn-box");
    box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
    try { next.focus({ preventScroll: true }); } catch (e) {}
  }
  function assetUrlP(name) { return LD.assetUrl ? LD.assetUrl(name) : "assets/" + name + ".webp"; }

  function pennyPlace() {
    var el = PN.el, step = PN.cur;
    if (!el || !step || el.hidden && !PN.on) return;
    var t = step.target ? step.target() : null;
    var vw = window.innerWidth, vh = window.innerHeight;
    var box = el.querySelector(".pn-box");
    var hole = el.querySelector(".pn-hole"), arrow = el.querySelector(".pn-arrow");
    var blks = el.querySelectorAll(".pn-blk");
    Array.prototype.forEach.call(document.querySelectorAll(".pn-glow"), function (g) { g.classList.remove("pn-glow"); });
    if (step.glow) Array.prototype.forEach.call(document.querySelectorAll(step.glow), function (g) { g.classList.add("pn-glow"); });
    if (!t || !pvis(t)) {
      hole.style.display = "none";
      arrow.style.display = "none";
      var full = !step.passive;
      blks[0].style.cssText = full ? "left:0;top:0;width:100vw;height:" + ((window.visualViewport && visualViewport.height) || window.innerHeight) + "px;" : "display:none";
      for (var i = 1; i < 4; i++) blks[i].style.cssText = "display:none";
      el.classList.remove("box-top");
      return;
    }
    if (!PN.scrolled) {
      PN.scrolled = true;
      var r0 = t.getBoundingClientRect();
      var boxH0 = box.getBoundingClientRect().height || 200;
      if (r0.top < 8 || r0.bottom > vh - boxH0 - 12) {
        try { t.scrollIntoView({ block: r0.height > vh * 0.45 ? "start" : "center", behavior: "auto" }); } catch (e) {}
      }
    }
    var r = t.getBoundingClientRect();
    var pad = 8;
    var L = Math.max(0, r.left - pad), T = Math.max(0, r.top - pad), R = Math.min(vw, r.right + pad), B = Math.min(vh, r.bottom + pad);
    hole.style.display = "block";
    hole.style.cssText = "display:block;left:" + L + "px;top:" + T + "px;width:" + (R - L) + "px;height:" + (B - T) + "px;";
    blks[0].style.cssText = "left:0;top:0;width:100vw;height:" + T + "px;";
    blks[1].style.cssText = "left:0;top:" + T + "px;width:" + L + "px;height:" + (B - T) + "px;";
    blks[2].style.cssText = "left:" + R + "px;top:" + T + "px;width:" + Math.max(0, vw - R) + "px;height:" + (B - T) + "px;";
    blks[3].style.cssText = "left:0;top:" + B + "px;width:100vw;height:" + Math.max(0, vh - B) + "px;";
    var bh = box.getBoundingClientRect().height || 200;
    var wantTop = B > vh - bh - 16 && T > bh + 16;
    el.classList.toggle("box-top", wantTop);
    var bb = box.getBoundingClientRect();
    /* Arrow: above the hole pointing down, or below pointing up; keep it off the dialogue box. */
    var cx = (L + R) / 2;
    var up = T < 84 || (wantTop && T - 76 < bb.bottom);
    var ay = up ? B + 6 : T - 74;
    if (!up && !wantTop && ay + 70 > bb.top && bb.top > 0 && T > bb.top - 10) up = true, ay = B + 6;
    arrow.style.display = "block";
    arrow.style.left = Math.max(4, Math.min(vw - 60, cx - 30)) + "px";
    arrow.style.top = Math.max(4, Math.min(vh - 74, ay)) + "px";
    arrow.classList.toggle("up", up);
  }

  function pennyTickLoop() {
    if (!PN.on || !PN.cur) return;
    if (!state && PN.mode === "tour") { pennyStop(); return; }
    var step = PN.cur;
    if (PN.mode === "tour" && !step.offer) {
      if (step.skip && step.skip()) { pennyAdvance(); return; }
      if (step.lost && step.lost() && step.back) { pennyGoto(step.back); return; }
    }
    var waiting = step.wait && step.wait();
    var t = step.target ? step.target() : null;
    var hide = waiting || (step.target && !step.passive && !(t && pvis(t)) && !step.offer);
    if (hide) {
      if (!PN.el.hidden) { PN.el.hidden = true; }
      return;
    }
    if (PN.el.hidden) { PN.el.hidden = false; PN.scrolled = false; }
    pennyPlace();
  }

  function pennyStart(opts) {
    opts = opts || {};
    if (!state || screen !== "desk") return;
    pennyCloseTip(true);
    PN.on = true;
    PN.mode = "tour";
    PN.startTurn = state.turn;
    clearInterval(PN.loop);
    PN.loop = setInterval(pennyTickLoop, 180);
    document.body.classList.add("penny-on");
    renderDesk();
    if (opts.offer) {
      PN.idx = -1;
      pennyShowStep({ offer: true, face: "wink", n: 0, text: "Hi! I'm <b>Penny</b>, from Onboarding ✦ Want a quick guided first quarter? Two minutes, eight steps, zero liability!", target: null });
      return;
    }
    PN.idx = -1;
    pennyAdvance();
  }
  function pennyGoto(id) {
    for (var i = 0; i < TOUR.length; i++) if (TOUR[i].id === id) { PN.idx = i; pennyShowStep(TOUR[i]); return; }
  }
  function pennyAdvance() {
    PN.idx += 1;
    while (PN.idx < TOUR.length && TOUR[PN.idx].skip && TOUR[PN.idx].skip()) PN.idx += 1;
    if (PN.idx >= TOUR.length) { pennyDone(); return; }
    pennyShowStep(TOUR[PN.idx]);
  }
  function pennyNext() {
    if (!PN.on || !PN.cur) return;
    if (!PN.typed) { pennyFinishType(); return; }
    var step = PN.cur;
    if (PN.mode === "tip") { pennyCloseTip(); return; }
    if (step.offer) { pennyAdvance(); return; }
    if (step.last) { pennyDone(); return; }
    if (step.act) { step.act(); return; }
    if (step.passive) return;
    pennyAdvance();
  }
  function pennyEmit(ev) {
    if (PN.mode === "tour" && PN.cur && PN.cur.on === ev) {
      var at = PN.cur;
      setTimeout(function () { if (PN.cur === at && PN.on) pennyAdvance(); }, 60);
    }
    if (ev === "report-closed" && PN.pendingRival) { PN.pendingRival = false; setTimeout(function () { pennyTip("rival"); }, 400); }
  }
  function pennyStop() {
    PN.on = false;
    PN.mode = null;
    PN.cur = null;
    clearInterval(PN.loop);
    clearInterval(PN.typer);
    document.body.classList.remove("penny-on");
    Array.prototype.forEach.call(document.querySelectorAll(".pn-glow"), function (g) { g.classList.remove("pn-glow"); });
    if (PN.el) PN.el.hidden = true;
  }
  function pennyDone() {
    pennySave(function (p) { p.done = true; p.offered = true; });
    var wasDesk = screen === "desk" && state && !state.ended;
    pennyStop();
    if (wasDesk) renderDesk();
  }
  function pennySkip() { pennyDone(); }

  /* One-time tips: same dialogue, "Got it" to close. Never during the tour. */
  function pennyTip(key) {
    if (PN.mode === "tour") return;
    var m = pennyMeta();
    if (m.penny.tipsOff || m.penny.tips[key]) return;
    var tip = PENNY_TIPS[key];
    if (!tip) return;
    var t = tip.target();
    if (!t || !pvis(t)) return;
    if (key === "rival" && !state) return;
    pennySave(function (p) { p.tips[key] = true; });
    PN.on = true;
    PN.mode = "tip";
    clearInterval(PN.loop);
    PN.loop = setInterval(pennyTickLoop, 180);
    pennyShowStep({ id: "tip-" + key, face: tip.face, text: tip.text, target: tip.target, n: 0 });
  }
  function pennyCloseTip(silent) {
    if (PN.mode !== "tip") return;
    pennyStop();
  }
  function pennyMuteTips() { pennySave(function (p) { p.tipsOff = true; }); pennyCloseTip(); }
  function pennyAutoOffer() {
    var m = pennyMeta();
    if (m.penny.offered || m.penny.done) return false;
    var fresh = (m.finished | 0) === 0 && (!m.history || !m.history.length);
    pennySave(function (p) { p.offered = true; });
    if (!fresh) return false;
    pennyStart({ offer: true });
    return true;
  }

  document.addEventListener("keydown", function (e) {
    if (!PN.on || !PN.el || PN.el.hidden) return;
    if (e.key === "Escape" || e.key === "Esc") {
      e.preventDefault(); e.stopPropagation();
      if (PN.mode === "tip") pennyCloseTip(); else pennySkip();
      return;
    }
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      var a = document.activeElement;
      if (a && a.closest && (a.closest(".pn-skip") || a.closest(".pn-alt"))) return;
      var neutral = !a || a === document.body || a === document.documentElement || (a.closest && a.closest("#penny"));
      if (!neutral) return;
      e.preventDefault(); e.stopPropagation();
      pennyNext();
    }
  }, true);
  window.addEventListener("resize", function () { if (PN.on) pennyPlace(); });
  window.addEventListener("scroll", function () { if (PN.on) pennyPlace(); }, { passive: true });

  function openHowTo(inRun) {
    var m = loadMeta();
    var warn = !inRun && m.midRun ? "<p class='muted'>Starts a fresh AAA practice run with Mara Voss. Your saved run will be replaced.</p>" : "";
    showOverlay("How to play", "<div class='howto-pick'><img src='" + assetUrlP("penny-wink") + "' alt=''><p><b>Penny · Onboarding</b> walks you through a real first quarter, step by step." + (inRun ? " She'll pick up from wherever you are." : "") + "</p></div>" + warn,
      '<button class="btn btn-coral" id="ht-penny">' + (inRun ? "Replay Penny's tour" : "Guided tour with Penny") + '</button><button class="btn" id="ht-rules">Read the rulebook</button><button class="btn btn-ghost" id="ht-close">Back</button>',
      function () {
        $("ht-penny").addEventListener("click", function () {
          tick();
          hideOverlay();
          if (inRun) { pennyStart(); return; }
          selectedExec = "mara"; selectedRating = 0; seedDraft = "";
          PN.forceStart = true;
          startRun();
        });
        $("ht-rules").addEventListener("click", function () { tick(); screenIntent = inRun ? "play" : "title"; tutorialPage = 0; show("tutorial"); renderTutorial(); });
        $("ht-close").addEventListener("click", function () { tick(); hideOverlay(); });
      });
  }

  function boot() {
    seedDraft = "";
    applyCosmetics();
    show("title");
    renderTitle();
  }

  document.addEventListener("DOMContentLoaded", boot);
})();

  </script>
