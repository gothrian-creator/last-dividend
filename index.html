      '<pattern id="p-waves" width="40" height="18" patternUnits="userSpaceOnUse"><path d="M2 9 q8 -6 16 0" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="1.6" stroke-linecap="round"/></pattern>' +
      '<filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      LD.REGION_IDS.map(function (id) { return '<path id="rg-' + id + '" d="' + M.regions[id].d + '"/>'; }).join("") +
      "</defs>";
    h += '<rect class="sea" x="-700" y="-500" width="2400" height="1500" fill="url(#g-ocean)"/>';
    h += '<rect class="waves" x="-700" y="-500" width="2400" height="1500" fill="url(#p-waves)"/>';
    h += '<ellipse class="glare" cx="560" cy="150" rx="260" ry="120" fill="url(#g-glare)"/>';
    h += '<path class="grat" d="' + M.grat + '"/>';

    /* Trade routes */
    h += '<g class="routes">';
    ROUTES.forEach(function (rt, i) {
      var live = W.regions[rt[0]].owned || W.regions[rt[1]].owned;
      h += '<path id="rt' + i + '" class="route' + (live ? " live" : "") + '" d="' + routePath(rt[0], rt[1]) + '"/>';
    });
    h += "</g>";

    /* Land: extruded side, then top. */
    h += '<g class="lands">';
    LD.REGION_IDS.forEach(function (id) {
      var r = W.regions[id];
      var cls = "region r-" + id + (r.owned ? " owned" : "") + " s-" + LD.stressLabel(r.stress) + (selRegion === id ? " sel" : "") + (r.trait ? " t-" + r.trait : "");
      h += '<g class="' + cls + '" data-region="' + id + '">';
      h += '<use class="side" href="#rg-' + id + '" transform="translate(0 7)"/>';
      h += '<use class="top" href="#rg-' + id + '"/>';
      h += '<use class="dots" href="#rg-' + id + '" fill="url(#p-dots)"/>';
      h += "</g>";
    });
    h += '<path class="borders" d="' + M.mesh + '"/>';
    h += "</g>";

    /* Ships and a plane riding the routes. */
    h += '<g class="traffic">';
    ROUTES.forEach(function (rt, i) {
      if (i % 2 && !(W.regions[rt[0]].owned || W.regions[rt[1]].owned)) return;
      var dur = 16 + (i * 3) % 9;
      h += '<g class="ship"><path d="M-9 -3 L9 -3 L6 4 L-6 4Z" fill="#fdf6e7" stroke="#0a464e" stroke-width="1.5"/><rect x="-4" y="-8" width="7" height="5" fill="#e05a48"/>' +
        '<animateMotion dur="' + dur + 's" repeatCount="indefinite" rotate="auto" begin="-' + (i * 2.3).toFixed(1) + 's"><mpath href="#rt' + i + '"/></animateMotion></g>';
    });
    h += '<g class="plane"><path d="M-10 0 L10 0 M2 0 L-4 -8 M2 0 L-4 8 M-8 0 L-11 -4 M-8 0 L-11 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>' +
      '<animateMotion dur="11s" repeatCount="indefinite" rotate="auto"><mpath href="#rt0"/></animateMotion></g>';
    h += "</g>";

    /* Region props: plants, flags, hazards, protests, labels. */
    h += '<g class="props">';
    LD.REGION_IDS.forEach(function (id) {
      var r = W.regions[id];
      var a = anchor(id);
      var lvl = LD.stressLabel(r.stress);
      if (LD.hazardVisible(state, id)) {
        var hz = at(id, "hazard");
        h += '<g class="prop-hz" transform="translate(' + hz[0] + " " + hz[1] + ') scale(1.6)">' + hazardIcon(r.hazard) + "</g>";
      }
      if (r.owned && (lvl === "tense" || lvl === "strike")) {
        var pr = at(id, "protest");
        h += '<g transform="translate(' + pr[0] + " " + pr[1] + ') scale(1.4)">' + protestIcon(lvl) + "</g>";
      }
      if (r.owned && r.plant) {
        var pl = at(id, "plant");
        h += '<g transform="translate(' + pl[0] + " " + pl[1] + ') scale(1.3)">' + plantIcon(r) + "</g>";
      }
      if (r.owned) {
        var fl = at(id, "flag");
        h += '<g transform="translate(' + fl[0] + " " + fl[1] + ')">' + flagIcon(r.trait === "hq") + "</g>";
      }
      h += '<circle class="anc" data-anc="' + id + '" cx="' + a[0] + '" cy="' + a[1] + '" r="1"/>';
      var lab = LD.REGION_NAMES[id].toUpperCase();
      h += '<text class="rlabel' + (r.owned ? " own" : "") + '" x="' + a[0] + '" y="' + (a[1] + 58) + '" text-anchor="middle">' + esc(lab) + "</text>";
      if (r.trait === "boom" && !r.owned) {
        h += '<text class="rtag boom" x="' + a[0] + '" y="' + (a[1] + 78) + '" text-anchor="middle">BOOMING</text>';
      }
    });
    h += "</g>";

    /* Deal pins */
    h += '<g class="pins">';
    if (state.phase === "deal" && !state.ended && !ui.hidePins) {
      state.offered.forEach(function (dealId, i) {
        var rid = W.pins[dealId];
        if (!rid) return;
        var d = LD.dealById(dealId);
        var kind = LD.dealKind(d);
        var p = at(rid, "pin");
        var cls = "pin k-" + kind + (selDeal === dealId ? " sel" : "") + (coachDeal === dealId ? " coach" : "");
        h += '<g class="' + cls + '" data-deal="' + dealId + '" transform="translate(' + p[0] + " " + p[1] + ')" style="--i:' + i + '">';
        h += '<g class="pin-body">';
        h += '<circle class="ring" r="22"/>';
        h += '<path class="drop" d="M0 22 C-6 12 -20 4 -20 -8 A20 20 0 1 1 20 -8 C20 4 6 12 0 22Z"/>';
        h += '<text class="glyph" y="0" text-anchor="middle">' + esc(KIND_ICON[kind]) + "</text>";
        h += "</g>";
        h += '<circle class="hit" r="36" cy="-6"/>';
        h += "</g>";
      });
    }
    h += "</g>";
    h += "</svg>";
    /* Namespace ids so two maps (title + desk) never share gradients. */
    var P = ui.idPrefix || "m";
    return h.replace(/(id="|url\(#|href="#)(g-|p-|f-|rg-|rt)/g, "$1" + P + "$2");
  }

  function meter(cls, label, num, extra, isMoney) {
    var pct = Math.max(0, Math.min(100, num));
    return '<div class="meter m-' + cls + '" data-num="' + num + '"' + (isMoney ? ' data-money="1"' : "") + '><div class="m-lbl">' + label + '</div><div class="m-val">' + (isMoney ? money(num) : num) + "</div>" +
      '<div class="m-bar"><span style="width:' + pct + '%"></span></div>' + (extra ? '<div class="m-sub">' + extra + "</div>" : "") + "</div>";
  }

  function sparkline(state) {
    var hist = (state.world && state.world.history) || [];
    var pts = hist.map(function (p) { return p.cash; });
    if (pts[pts.length - 1] !== state.cash) pts.push(state.cash);
    if (pts.length < 2) pts.unshift(pts[0] || 0);
    var max = Math.max.apply(null, pts.concat([10])), min = Math.min.apply(null, pts.concat([0]));
    var w = 220, hh = 54;
    var step = w / (pts.length - 1);
    var d = pts.map(function (v, i) {
      var y = hh - 6 - ((v - min) / ((max - min) || 1)) * (hh - 12);
      return (i ? "L" : "M") + (i * step).toFixed(1) + " " + y.toFixed(1);
    }).join(" ");
    var up = pts[pts.length - 1] >= pts[pts.length - 2];
    return '<svg class="spark" viewBox="0 0 ' + w + " " + hh + '" preserveAspectRatio="none"><path class="area" d="' + d + " L" + w + " " + hh + " L0 " + hh + 'Z"/><path class="line' + (up ? " up" : " down") + '" d="' + d + '"/></svg>';
  }

  function bunkerCutaway(state) {
    var rooms = [["air", 10, 54], ["water", 112, 54], ["power", 10, 104], ["food", 112, 104]];
    var h = '<svg class="cutaway" viewBox="0 0 214 156" aria-hidden="true">';
    h += '<rect x="0" y="0" width="214" height="40" fill="#9fd36a"/><rect x="0" y="34" width="214" height="122" fill="#b98a55"/>';
    h += '<path d="M98 0 L116 0 L116 44 L98 44Z" fill="#7b6a58"/><path d="M92 28 L122 28 L122 34 L92 34Z" fill="#0a464e"/>';
    h += '<circle cx="180" cy="14" r="9" fill="#ffd36a"/>';
    rooms.forEach(function (rm) {
      var id = rm[0], x = rm[1], y = rm[2];
      var sys = state.bunker[id];
      var st = LD.systemStatus(state, id);
      h += '<g class="room st-' + st + '"><rect x="' + x + '" y="' + y + '" width="92" height="44" rx="5"/>';
      h += '<text x="' + (x + 8) + '" y="' + (y + 27) + '" class="r-ico">' + SYS_ICON[id] + "</text>";
      for (var l = 0; l < 3; l++) {
        h += '<rect class="pip' + (l < sys.level ? " on" : "") + '" x="' + (x + 50 + l * 12) + '" y="' + (y + 30) + '" width="9" height="7" rx="2"/>';
      }
      h += "</g>";
    });
    h += "</svg>";
    return h;
  }

  function bunkerTally(state) {
    var r = LD.readinessSummary(state);
    return r.ready + "/4 ready";
  }

  function tickerItems(state) {
    var items = (state.log || []).slice(0, 6).map(function (l) { return "Q" + l.turn + " · " + l.text; });
    if (!items.length) items = ["Markets open."];
    return items;
  }

  function renderDesk(state, ui) {
    ui = ui || {};
    var exec = LD.execById(state.executiveId);
    var dealPhase = state.phase === "deal";
    var h = '<div class="desk ' + (dealPhase ? "phase-deal" : "phase-bunker") + (ui.selDeal || ui.selRegion ? " has-sel" : "") + '">';
    h += '<div class="desk-light" aria-hidden="true"></div>';
    h += '<header class="desk-head"><div class="brand"><div class="wordmark">LAST DIVIDEND<span class="sun" aria-hidden="true"></span></div>' +
      '<div class="tag">A Brighter Tomorrow, Privately Owned</div></div>' +
      '<div class="head-right"><div class="q-chip" aria-label="Quarter ' + state.turn + '"><small>Quarter</small>Q' + state.turn + "</div>" +
      '<button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button></div></header>';

    h += '<aside class="dossier" id="dossier">' + renderDossier(state, ui) + "</aside>";

    h += '<main class="board"><div class="board-tilt"><div class="board-slab">' + renderMap(state, ui) + "</div></div>";
    h += '<div class="phase-pill">' + (ui.hidePins ? "The world reacts…" : dealPhase ? "Pick 1 of 3 deals on the map" : (state.bunkerActedThisTurn ? "Ready to end the quarter" : "Deal signed · upgrade the bunker or end the quarter")) + "</div>";
    if (ui.coach === "pin" && ui.coachText) h += '<div class="coach-bubble c-pin">' + esc(ui.coachText) + "</div>";
    h += '<div class="fx" id="fx" aria-hidden="true"></div></main>';

    var hist = (state.world && state.world.history) || [];
    var prev = hist.length > 1 ? hist[hist.length - 2].cash : null;
    var last = hist.length ? hist[hist.length - 1].cash : state.cash;
    var delta = state.cash - (prev == null ? last : (state.turn === hist[hist.length - 1].turn ? prev : last));
    h += '<aside class="dash">';
    h += '<div class="panel dash-meters"><div class="panel-k">Q' + state.turn + " Performance</div><div class=\"meters\">";
    h += meter("cash", "Cash", state.cash, delta ? (delta > 0 ? "▲ " : "▼ ") + money(Math.abs(delta)) + " this Q" : "steady", true);
    h += meter("unrest", "Unrest", state.unrest, state.unrest >= 70 ? "Boiling" : state.unrest >= 40 ? "Restless" : "Manageable");
    h += meter("collapse", "Collapse", state.collapse, "~" + LD.forecastQuarters(state) + "Q to breach");
    h += "</div>";
    h += '<div class="spark-row">' + sparkline(state) +
      '<div class="holdings"><b>' + LD.ownedCount(state) + "</b> regions<br><b>" + LD.plantCount(state) + "</b> plants</div></div></div>";
    h += '<div class="panel ticker" aria-label="News"><div class="panel-k">News</div><div class="tick-wrap"><div class="tick-run">';
    var items = tickerItems(state);
    h += items.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + items.map(function (t) { return '<span aria-hidden="true">' + esc(t) + "</span>"; }).join("");
    h += "</div></div></div>";
    var bunkerReady = !dealPhase && !state.bunkerActedThisTurn;
    h += '<button class="panel bunker-card' + (bunkerReady ? " ready" : "") + (ui.coach === "bunker" ? " coach" : "") + '" id="bunker-card">' +
      '<div class="panel-k">Private bunker · ' + esc(bunkerTally(state)) + "</div>" + bunkerCutaway(state) +
      (ui.coach === "bunker" && ui.coachText ? '<div class="coach-inline">' + esc(ui.coachText) + "</div>" : "") +
      '<div class="bc-cta">' + (dealPhase ? "Sign a deal to unlock" : state.bunkerActedThisTurn ? "Works ordered this quarter" : "Tap to build ▸") + "</div></button>";
    h += "</aside>";

    h += '<footer class="hand">';
    h += '<div class="cards">';
    if (ui.hidePins) {
      h += '<div class="card dealing"><span class="c-t">Dealing Q' + state.turn + " opportunities…</span></div>";
    } else state.offered.forEach(function (dealId) {
      var d = LD.dealById(dealId);
      var kind = LD.dealKind(d);
      var rid = state.world.pins[dealId];
      var taken = !dealPhase && state.lastDealId === dealId;
      var cls = "card k-" + kind + (ui.selDeal === dealId ? " sel" : "") + (taken ? " taken" : "") + (!dealPhase && !taken ? " gone" : "");
      h += '<button class="' + cls + '" data-deal="' + dealId + '"' + (dealPhase ? "" : " disabled") + ">";
      h += '<span class="c-ico">' + esc(KIND_ICON[kind]) + "</span>";
      h += '<span class="c-txt"><span class="c-k">' + esc(KIND_LABEL[kind]) + " · " + esc(LD.REGION_NAMES[rid] || "") + "</span>";
      h += '<span class="c-t">' + esc(d.title) + "</span></span>";
      h += '<span class="c-tag">' + esc(cardTag(state, d)) + "</span>";
      if (taken) h += '<span class="c-stamp">Signed</span>';
      h += "</button>";
    });
    h += "</div>";
    var canEnd = !dealPhase;
    h += '<button class="end-q' + (canEnd ? " live" : "") + (ui.coach === "end" ? " coach" : "") + '" id="btn-endq">' +
      '<span class="eq-ico">✓</span><span class="eq-t">END QUARTER<small>' + (canEnd ? "Ride the upside. Own the future." : "Sign a deal first") + "</small></span></button>";
    if (ui.coach === "end" && ui.coachText) h += '<div class="coach-bubble c-end">' + esc(ui.coachText) + "</div>";
    h += "</footer>";
    h += "</div>";
    return h;
  }

  function cardTag(state, d) {
    if (d.choices) return "Choose";
    var c = (d.immediate && d.immediate.cash) || 0;
    if (c > 0) return "+" + money(LD.dealCashAmount(state, c));
    if (c < 0) return money(c);
    return "Free";
  }

  function chip(cls, text) { return '<span class="fx-chip ' + cls + '">' + esc(text) + "</span>"; }

  function payloadChips(state, deal, payload) {
    var now = [], later = [], world = [];
    var imm = payload.immediate || {};
    if (imm.cash) {
      var cash = imm.cash > 0 ? LD.dealCashAmount(state, imm.cash) : imm.cash;
      now.push(chip(cash > 0 ? "good" : "cost", (cash > 0 ? "+" : "") + money(cash) + (cash !== imm.cash ? " (60%)" : "")));
    }
    if (imm.unrest) now.push(chip(imm.unrest > 0 ? "bad" : "good", "Unrest " + signed(imm.unrest)));
    if (imm.collapse) now.push(chip(imm.collapse > 0 ? "bad" : "good", "Collapse " + signed(imm.collapse)));
    if (imm.special === "divertFilters") now.push(chip("good", state.bunker.air.level < 1 ? "Air Lv1 (discount)" : "+$12M resale"));
    var dl = payload.delay;
    if (dl) {
      var exec = LD.execById(state.executiveId);
      var due = state.turn + dl.turns + ((exec.perks && exec.perks.delayBonus) || 0);
      if (dl.cash) later.push(chip(dl.cash > 0 ? "good" : "cost", money(dl.cash)));
      if (dl.unrest) later.push(chip(dl.unrest > 0 ? "bad" : "good", "Unrest " + signed(dl.unrest)));
      if (dl.collapse) later.push(chip(dl.collapse > 0 ? "bad" : "good", "Collapse " + signed(dl.collapse)));
      if (dl.effectsIf && dl.effectsIf.collapse) later.push(chip("bad", "Collapse +" + dl.effectsIf.collapse + " unless filters funded"));
      if (dl.grantSystem) later.push(chip("good", dl.grantSystem.id + " Lv" + dl.grantSystem.level + " arrives"));
      if (later.length) later.unshift('<span class="when">Q' + due + "</span>");
    }
    var supply = LD.defaultSupply(deal, payload);
    if (supply.strain) Object.keys(supply.strain).forEach(function (g) {
      var next = Math.min(LD.GRID_DISRUPTED, LD.gridLevel(state, g) + supply.strain[g]);
      var lbl = LD.gridLabel(next);
      world.push(chip("bad", "Public " + g + " " + lbl + (lbl === "disrupted" ? " (+" + LD.DISRUPT_SURCHARGE + ", 1Q late)" : lbl === "strained" ? " (+" + LD.STRAIN_SURCHARGE + ")" : "")));
    });
    if (supply.ease) Object.keys(supply.ease).forEach(function (g) { world.push(chip("good", "Public " + g + " eases")); });
    return { now: now, later: later, world: world };
  }

  function regionChips(state, dealId, choiceId) {
    var eff = LD.dealRegionEffect(state, dealId, choiceId);
    if (!eff) return [];
    var out = [];
    if (eff.claim) out.push(chip("own", "Claims " + eff.regionName));
    var r = state.world.regions[eff.regionId];
    if (eff.stress > 0) out.push(chip(r.owned || eff.claim ? "bad" : "meh", eff.regionName + " stress +" + eff.stress));
    if (eff.stress < 0) out.push(chip("good", eff.regionName + " stress " + eff.stress));
    return out;
  }

  function chipRows(c, mapChips) {
    var h = "";
    if (c.now.length) h += '<div class="fx-row"><span class="row-k">Now</span>' + c.now.join("") + "</div>";
    if (c.later.length) h += '<div class="fx-row"><span class="row-k">Later</span>' + c.later.join("") + "</div>";
    var w = (mapChips || []).concat(c.world);
    if (w.length) h += '<div class="fx-row"><span class="row-k">Map</span>' + w.join("") + "</div>";
    return h;
  }

  function renderDealDossier(state, dealId) {
    var d = LD.dealById(dealId);
    var kind = LD.dealKind(d);
    var rid = state.world.pins[dealId];
    var h = '<div class="dz deal-dz k-' + kind + '">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    h += '<div class="dz-k">' + esc(d.kicker) + " · " + esc(LD.REGION_NAMES[rid] || "") + "</div>";
    h += "<h3>" + esc(d.title) + "</h3>";
    var art = LD.dealArtKey(dealId);
    if (art) h += '<img class="dz-art" src="' + esc(LD.assetUrl(art)) + '" alt="">';
    h += '<p class="dz-body">' + esc(d.body) + "</p>";
    if (d.choices) {
      h += '<div class="dz-choices">';
      d.choices.forEach(function (c) {
        var poor = c.cost && state.cash < c.cost;
        h += '<button class="dz-choice" data-deal="' + dealId + '" data-choice="' + c.id + '"' + (poor ? " disabled" : "") + ">";
        h += "<b>" + esc(c.label) + (poor ? " · need " + money(c.cost) : "") + "</b>";
        h += chipRows(payloadChips(state, d, c), regionChips(state, dealId, c.id)) + "</button>";
      });
      h += "</div>";
    } else {
      h += chipRows(payloadChips(state, d, d), regionChips(state, dealId));
      var poor = d.cost && state.cash < d.cost;
      h += '<button class="btn-sign" id="btn-sign" data-deal="' + dealId + '"' + (poor ? " disabled" : "") + ">" + (poor ? "Need " + money(d.cost) : "Sign the deal") + "</button>";
      h += '<p class="fine">Fine print: ' + esc(d.hint) + "</p>";
    }
    h += "</div>";
    return h;
  }

  function stressPips(r) {
    var h = '<span class="pips s-' + LD.stressLabel(r.stress) + '">';
    for (var i = 1; i <= LD.STRESS_MAX; i++) h += '<i class="' + (i <= r.stress ? "on" : "") + '"></i>';
    return h + "</span>";
  }

  function renderRegionDossier(state, rid) {
    var r = state.world.regions[rid];
    var lvl = LD.stressLabel(r.stress);
    var h = '<div class="dz region-dz' + (r.owned ? " owned" : "") + '">';
    h += '<button class="dz-x" id="dz-close" aria-label="Close">✕</button>';
    var status = r.owned ? (r.trait === "hq" ? "Headquarters" : "Your territory") : "Not yours yet";
    h += '<div class="dz-k">' + esc(status) + (r.trait === "boom" ? " · Booming" : r.trait === "crisis" ? " · In crisis" : "") + "</div>";
    h += "<h3>" + esc(LD.REGION_NAMES[rid]) + "</h3>";
    h += '<div class="dz-stat"><span>Mood</span>' + stressPips(r) + "<b>" + esc({ calm: "Calm", tense: "Protests", strike: "Riots", revolt: "Revolt" }[lvl]) + "</b></div>";
    if (LD.hazardVisible(state, rid)) h += '<div class="dz-stat"><span>Hazard</span><b>' + esc(LD.HAZARD_NAMES[r.hazard]) + "</b></div>";
    if (r.owned && r.plant) {
      var pay = LD.plantIncome(state, rid);
      h += '<div class="dz-stat"><span>Plant</span><b>' + (r.stress >= LD.STRESS_STRIKE ? "On strike · $0M" : "+" + money(pay) + " / quarter") + "</b></div>";
    }
    if (!r.owned) {
      h += '<p class="dz-body">Win it with an <b>Acquire</b> deal (＋ pin). Owned land can host a plant.</p>';
    } else {
      var acted = state.world.actedTurn === state.turn;
      var err = LD.regionGuard(state, rid);
      h += '<p class="dz-note">One regional order per quarter' + (acted ? " · used" : "") + ". At 5 stress it revolts and you lose it.</p>";
      if (!r.plant) {
        var inc = LD.PLANT.income + (r.trait === "boom" ? LD.PLANT.boomBonus : 0);
        h += '<button class="dz-act" id="btn-build" data-region="' + rid + '"' + (LD.canBuildPlant(state, rid) ? "" : " disabled") + ">" +
          "<b>Build a desalination plant · " + money(LD.PLANT.cost) + "</b>" +
          '<span class="fx-row">' + chip("good", "+" + money(inc) + "/Q") + chip("bad", "Stress +1/Q") + chip("bad", "Collapse +1/Q") + "</span></button>";
      }
      h += '<button class="dz-act" id="btn-calm" data-region="' + rid + '"' + (LD.canCalmRegion(state, rid) ? "" : " disabled") + ">" +
        "<b>Charm offensive · " + money(LD.PR_PUSH.cost) + "</b>" +
        '<span class="fx-row">' + chip("good", "Stress −" + LD.PR_PUSH.calm) + "</span></button>";
      if (err && !acted && err.indexOf("own") === -1) h += '<p class="dz-note">' + esc(err) + "</p>";
    }
    h += "</div>";
    return h;
  }

  function renderExecDossier(state) {
    var exec = LD.execById(state.executiveId);
    var initials = exec.name.replace(/^Dr\. /, "").split(" ").map(function (p) { return p[0]; }).join("");
    var h = '<div class="dz exec-dz">';
    h += '<div class="dz-k">Executive dossier</div>';
    h += '<div class="exec-id"><div class="avatar" aria-hidden="true">' + esc(initials) + '</div><div><h3>' + esc(exec.name) + "</h3>" +
      '<div class="exec-t">' + esc(exec.title) + "<br>" + esc(exec.firm) + "</div></div></div>";
    h += '<div class="target"><span>◎</span><b>Goal</b> All 4 bunker systems at Lv 2+, then seal (from Q' + LD.MIN_EVAC_TURN + ").</div>";
    h += '<p class="quote">“' + esc(exec.blurb) + "”</p>";
    h += '<div class="dz-stat"><span>Seed</span><b>' + esc(String(state.seedLabel)) + "</b></div>";
    h += "</div>";
    return h;
  }

  function renderDossier(state, ui) {
    if (ui.hidePins) return renderExecDossier(state);
    if (ui.selDeal && state.phase === "deal" && state.offered.indexOf(ui.selDeal) !== -1) return renderDealDossier(state, ui.selDeal);
    if (ui.selRegion) return renderRegionDossier(state, ui.selRegion);
    return renderExecDossier(state);
  }

  /* Bunker works sheet: compact, touch-first. */
  function renderBunkerSheet(state, mode) {
    mode = mode || "install";
    var acted = state.bunkerActedThisTurn;
    var locked = state.phase !== "bunker";
    var r = LD.readinessSummary(state);
    var h = '<div class="sheet bunker-sheet">';
    h += '<button class="dz-x" id="bs-close" aria-label="Close">✕</button>';
    h += '<div class="dz-k">Private bunker · ' + r.ready + "/4 ready" + (state.engineer ? " · engineer on staff" : "") + "</div>";
    h += "<h3>" + (locked ? "Sign a deal first" : acted ? "Works ordered this quarter" : "One bunker order this quarter") + "</h3>";
    h += '<p class="dz-note">Win: all four systems Lv 2+ and holding. <b>Sound</b> holds. <b>Discount</b> is cheaper but fails at Lv 2 unless you hire an engineer or reach Lv 3.</p>';
    if (state.converting) {
      h += '<p class="dz-note priv">Private supply: deals pay 60% cash. Installs ignore public damage and arrive now.</p>';
    } else if (!locked && !acted) {
      h += '<div class="mode-row"><button class="mode' + (mode === "install" ? " on" : "") + '" data-mode="install">Public supply</button>' +
        '<button class="mode' + (mode === "convert" ? " on" : "") + '" data-mode="convert">Go private</button></div>';
      if (mode === "convert") {
        h += '<p class="dz-note priv">Once per run. Deals pay 60% cash afterwards, but installs ignore network damage and arrive this quarter. Secure one system now at the clear rate, or convert only.</p>';
        h += '<button class="dz-act slim" data-convert="">Convert only · $0M</button>';
      }
    }
    h += '<div class="sys-list">';
    var ups = LD.availableUpgrades(state);
    LD.SYSTEMS.forEach(function (s) {
      var sys = state.bunker[s.id];
      var st = LD.systemStatus(state, s.id);
      var u = null;
      ups.forEach(function (x) { if (x.systemId === s.id) u = x; });
      var gl = LD.gridLabel(LD.gridLevel(state, s.id));
      h += '<div class="sys st-' + st + '"><div class="sys-ico">' + SYS_ICON[s.id] + "</div>";
      h += '<div class="sys-main"><div class="sys-n">' + esc(s.name) + " <span>Lv " + sys.level + "</span></div>";
      h += '<div class="sys-d">' + esc(LD.systemDetail(state, s.id, true)) + (!state.converting && gl !== "clear" ? ' · <em class="g-' + gl + '">public ' + gl + "</em>" : "") + "</div></div>";
      h += '<div class="sys-btns">';
      if (!u) {
        h += '<span class="maxed">Max</span>';
      } else if (mode === "convert" && !state.converting && !locked && !acted) {
        if (u.inbound) h += '<span class="maxed">In transit</span>';
        else ["sound", "cheap"].forEach(function (q) {
          var clone = LD.deepClone(state); clone.converting = true;
          var c = LD.upgradeCost(clone, s.id, sys.level + 1, q);
          h += '<button class="buy q-' + q + '" data-convert="' + s.id + '" data-q="' + q + '"' + (state.cash < c ? " disabled" : "") + "><small>" + (q === "sound" ? "Sound" : "Discount") + "</small>" + money(c) + "</button>";
        });
      } else if (u.inbound) {
        h += '<span class="maxed">Arrives Q' + u.inbound.due + "</span>";
      } else {
        h += '<button class="buy q-sound" data-up="' + s.id + '" data-q="sound"' + (locked || acted || !u.canSound ? " disabled" : "") + "><small>Sound</small>" + money(u.soundCost) + "</button>";
        h += '<button class="buy q-cheap" data-up="' + s.id + '" data-q="cheap"' + (locked || acted || !u.canCheap ? " disabled" : "") + "><small>Discount</small>" + money(u.cheapCost) + "</button>";
      }
      h += "</div>";
      if (u && !u.inbound && !state.converting && u.delay > 0 && mode !== "convert") h += '<div class="sys-warn">Public ' + s.id + " disrupted: arrives Q" + (state.turn + 1) + ", not if you seal first.</div>";
      h += "</div>";
    });
    h += "</div>";
    if (!state.engineer) {
      var ec = LD.engineerCost(state);
      h += '<button class="dz-act slim" id="btn-engineer"' + (locked || acted || !LD.canHireEngineer(state) ? " disabled" : "") + "><b>Hire chief engineer · " + money(ec) + "</b><span>Discount Lv 2 systems will hold.</span></button>";
    }
    if (LD.canEvacuate(state)) {
      h += '<button class="btn-seal" id="btn-seal">Seal the bunker</button>';
    } else {
      h += '<p class="dz-note">Sealing opens in quarter ' + LD.MIN_EVAC_TURN + ".</p>";
    }
    h += "</div>";
    return h;
  }

  function reportIcon(f) {
    var w = f.world;
    if (!w) return "✉";
    return { income: "$", strike: "✊", riot: "🔥", protest: "✊", revolt: "⚑", brine: "≈" }[w.kind] || "•";
  }

  function renderReport(prev, next, fired, tick) {
    var h = '<div class="report"><div class="dz-k">Quarterly report</div><h3>Q' + prev.turn + " closes</h3>";
    h += '<div class="rep-deltas">';
    [["Cash", prev.cash, next.cash, true], ["Unrest", prev.unrest, next.unrest, false], ["Collapse", prev.collapse, next.collapse, false]].forEach(function (x) {
      var d = x[2] - x[1];
      var good = x[3] ? d >= 0 : d <= 0;
      h += '<div class="rd ' + (d === 0 ? "flat" : good ? "good" : "bad") + '"><span>' + x[0] + "</span><b>" + (x[3] ? money(x[2]) : x[2]) + "</b><em>" + (d === 0 ? "±0" : signed(d)) + "</em></div>";
    });
    h += "</div><ul class=\"rep-list\">";
    (fired || []).slice(0, 7).forEach(function (f) {
      h += "<li><i>" + reportIcon(f) + "</i>" + esc(f.text) + "</li>";
    });
    if (tick) h += "<li><i>↗</i>Collapse drifts +" + tick + ".</li>";
    h += "</ul></div>";
    return h;
  }

  LD.renderMap = renderMap;
  LD.renderDesk = renderDesk;
  LD.renderBunkerSheet = renderBunkerSheet;
  LD.renderReport = renderReport;
  LD.renderDossier = renderDossier;
  LD.payloadChips = payloadChips;
  LD.deskAnchor = anchor;
  LD.deskAt = at;
  LD.formatMoney = money;

  if (typeof module !== "undefined" && module.exports) module.exports = LD;
})(typeof globalThis !== "undefined" ? globalThis : this);

  </script>
  <script>
/* Last Dividend — B3 touch-first UI. No hover-only actions. */
(function () {
  var state = null;
  var screen = "title";
  var tutorialPage = 0;
  var selectedExec = "mara";
  var seedDraft = "";
  var crisisOpen = null;
  var lastFired = [];
  var screenIntent = "title";

  function $(id) { return document.getElementById(id); }

  function defaultMeta() {
    return { seenTutorial: false, history: [], midRun: null, finished: 0, wins: 0 };
  }

  function loadMeta() {
    try {
      var raw = localStorage.getItem(LD.SAVE_KEY);
      if (!raw) return defaultMeta();
      var parsed = JSON.parse(raw);
      var meta = defaultMeta();
      Object.keys(parsed).forEach(function (k) { meta[k] = parsed[k]; });
      if (!Array.isArray(meta.history)) meta.history = [];
      return meta;
    } catch (e) {
      return defaultMeta();
    }
  }

  function saveMeta(meta) {
    try { localStorage.setItem(LD.SAVE_KEY, JSON.stringify(meta)); } catch (e) {}
  }

  function persistRun() {
    var meta = loadMeta();
    meta.midRun = state && !state.ended ? state : null;
    saveMeta(meta);
  }

  function clearMidRun() {
    var meta = loadMeta();
    meta.midRun = null;
    saveMeta(meta);
  }

  function recordEnding() {
    var meta = loadMeta();
    meta.finished += 1;
    if (state.ending && state.ending.kind === "win") meta.wins += 1;
    meta.midRun = null;
    meta.history.unshift({
      at: Date.now(),
      seed: state.seedLabel,
      executiveId: state.executiveId,
      result: state.ending.kind,
      reason: state.ending.reason,
      title: state.ending.title,
      turn: state.turn,
      cash: state.cash,
      unrest: state.unrest,
      collapse: state.collapse
    });
    if (meta.history.length > 12) meta.history.length = 12;
    saveMeta(meta);
  }

  function tick() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!tick.ctx) tick.ctx = new Ctx();
      var ctx = tick.ctx;
      if (ctx.state === "suspended") ctx.resume();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "square";
      o.frequency.value = 220;
      g.gain.value = 0.025;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
      o.stop(ctx.currentTime + 0.07);
    } catch (e) {}
  }

  function show(name) {
    screen = name;
    document.body.classList.toggle("on-desk", name === "desk");
    ["title", "tutorial", "exec", "deal", "bunker", "desk", "end", "history"].forEach(function (id) {
      var el = $("screen-" + id);
      if (!el) return;
      el.classList.toggle("on", id === name);
    });
    hideOverlay();
    window.scrollTo(0, 0);
  }

  function renderTitle() {
    $("screen-title").innerHTML = LD.renderTitle({ meta: loadMeta(), seedDraft: seedDraft });
    $("btn-new").addEventListener("click", function () {
      tick();
      seedDraft = $("seed-input").value.trim();
      selectedExec = "mara";
      goExec();
    });
    var cont = $("btn-continue");
    if (cont) {
      cont.addEventListener("click", function () {
        tick();
        state = loadMeta().midRun;
        if (state && LD.ensureSupply) LD.ensureSupply(state);
        if (state && LD.ensureWorld) LD.ensureWorld(state);
        crisisOpen = null;
        enterPlay();
      });
    }
    $("btn-roll").addEventListener("click", function () {
      tick();
      seedDraft = String((Math.floor(Math.random() * 900000) + 100000));
      $("seed-input").value = seedDraft;
    });
    $("seed-input").addEventListener("input", function () { seedDraft = this.value; });
    $("btn-how").addEventListener("click", function () {
      tick();
      screenIntent = "title";
      tutorialPage = 0;
      show("tutorial");
      renderTutorial();
    });
    $("btn-history").addEventListener("click", function () { tick(); show("history"); renderHistory(); });
  }

  function renderTutorial() {
    $("screen-tutorial").innerHTML = LD.renderTutorial(tutorialPage);
    function finish() {
      var meta = loadMeta();
      meta.seenTutorial = true;
      saveMeta(meta);
      if (screenIntent === "exec") goExec();
      else if ((screenIntent === "deal" || screenIntent === "bunker" || screenIntent === "play") && state) enterPlay();
      else { show("title"); renderTitle(); }
    }
    var next = $("btn-next");
    if (next) next.addEventListener("click", function () { tick(); tutorialPage += 1; renderTutorial(); });
    var skip = $("btn-skip");
    if (skip) skip.addEventListener("click", function () { tick(); tutorialPage = LD.TUTORIAL.length - 1; finish(); });
    var done = $("btn-done");
    if (done) done.addEventListener("click", function () { tick(); finish(); });
  }

  function goExec() {
    var meta = loadMeta();
    screenIntent = "exec";
    if (false && !meta.seenTutorial) {
      tutorialPage = 0;
      show("tutorial");
      renderTutorial();
      return;
    }
    show("exec");
    renderExec();
  }

  function renderExec() {
    $("screen-exec").innerHTML = LD.renderExec({ meta: loadMeta(), selectedExec: selectedExec });
    Array.prototype.forEach.call(document.querySelectorAll(".exec-card"), function (btn) {
      btn.addEventListener("click", function () {
        tick();
        selectedExec = btn.getAttribute("data-id");
        renderExec();
      });
    });
    $("btn-start").addEventListener("click", function () { tick(); startRun(); });
    $("btn-back").addEventListener("click", function () { tick(); show("title"); renderTitle(); });
  }

  function startRun() {
    state = LD.createRun({ seed: seedDraft, executiveId: selectedExec });
    crisisOpen = null;
    lastFired = [];
    sel = { deal: null, region: null };
    hidePins = false;
    persistRun();
    enterPlay();
  }

  function enterPlay() {
    if (!state) { show("title"); renderTitle(); return; }
    if (LD.ensureWorld) LD.ensureWorld(state);
    if (state.ended) { showEnd(); return; }
    show("desk");
    renderDesk();
  }

  /* ---------- Desk (world map) ---------- */
  var sel = { deal: null, region: null };
  var bunkerMode = "install";
  var hidePins = false;

  function coachInfo() {
    var meta = loadMeta();
    if (meta.coachDone || !state || state.turn !== 1) return {};
    if (state.phase === "deal") {
      if (sel.deal) return {};
      var pick = state.offered[0];
      state.offered.forEach(function (id) { if (LD.dealKind(LD.dealById(id)) === "claim") pick = id; });
      return { coach: "pin", coachDeal: pick, coachText: "Tap the glowing pin to open a deal" };
    }
    if (!state.bunkerActedThisTurn) return { coach: "bunker", coachText: "Build your bunker (optional)" };
    return { coach: "end", coachText: "End the quarter and watch the world react" };
  }

  function uiOpts() {
    var c = coachInfo();
    return { selDeal: sel.deal, selRegion: sel.region, coach: c.coach, coachDeal: c.coachDeal, coachText: c.coachText, hidePins: hidePins };
  }

  function renderDesk(from) {
    var el = $("screen-desk");
    el.innerHTML = LD.renderDesk(state, uiOpts());
    bindDesk();
    if (from) animateMeters(from);
  }

  function animateMeters(from) {
    var map = { cash: from.cash, unrest: from.unrest, collapse: from.collapse };
    Array.prototype.forEach.call(document.querySelectorAll(".desk .meter"), function (m) {
      var key = m.className.match(/m-(\w+)/)[1];
      var to = +m.getAttribute("data-num");
      var start = map[key];
      if (start == null || start === to) return;
      var bar = m.querySelector(".m-bar span");
      var val = m.querySelector(".m-val");
      var money = m.getAttribute("data-money");
      bar.style.transition = "none";
      bar.style.width = Math.max(0, Math.min(100, start)) + "%";
      void bar.offsetWidth;
      bar.style.transition = "";
      bar.style.width = Math.max(0, Math.min(100, to)) + "%";
      m.classList.add(to > start ? "rise" : "fall");
      var t0 = null;
      function stepFn(t) {
        if (!t0) t0 = t;
        var k = Math.min(1, (t - t0) / 900);
        var v = Math.round(start + (to - start) * (1 - Math.pow(1 - k, 3)));
        val.textContent = money ? LD.formatMoney(v) : v;
        if (k < 1) requestAnimationFrame(stepFn);
      }
      requestAnimationFrame(stepFn);
    });
  }

  function refreshSelection() {
    var desk = document.querySelector(".desk");
    if (!desk) return;
    var dz = $("dossier");
    dz.innerHTML = LD.renderDossier(state, uiOpts());
    desk.classList.toggle("has-sel", !!(sel.deal || sel.region));
    Array.prototype.forEach.call(desk.querySelectorAll(".pin, .card"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-deal") === sel.deal);
      if (sel.deal) n.classList.remove("coach");
    });
    Array.prototype.forEach.call(desk.querySelectorAll(".region"), function (n) {
      n.classList.toggle("sel", n.getAttribute("data-region") === sel.region);
    });
    var cb = desk.querySelector(".coach-bubble.c-pin");
    if (cb && sel.deal) cb.remove();
    bindDossier();
    dz.classList.remove("pop");
    void dz.offsetWidth;
    dz.classList.add("pop");
  }

  function selectDealPin(id) {
    if (state.phase !== "deal") return;
    sel.deal = id;
    sel.region = null;
    refreshSelection();
  }

  function selectRegion(id) {
    sel.region = id;
    sel.deal = null;
    refreshSelection();
  }

  function bindDesk() {
    Array.prototype.forEach.call(document.querySelectorAll(".desk .pin, .desk .card"), function (n) {
      n.addEventListener("click", function (e) {
        e.stopPropagation();
        tick();
        selectDealPin(n.getAttribute("data-deal"));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".desk .region"), function (n) {
      n.addEventListener("click", function () {
        tick();
        selectRegion(n.getAttribute("data-region"));
      });
    });
    $("bunker-card").addEventListener("click", function () { tick(); openBunker(); });
    $("btn-endq").addEventListener("click", function () { tick(); endQuarter(); });
    $("btn-menu").addEventListener("click", function () { tick(); openMenu(); });
    bindDossier();
  }

  function bindDossier() {
    var x = $("dz-close");
    if (x) x.addEventListener("click", function () { tick(); sel.deal = null; sel.region = null; refreshSelection(); });
    var sign = $("btn-sign");
    if (sign) sign.addEventListener("click", function () { tick(); applyDeal(sign.getAttribute("data-deal")); });
    Array.prototype.forEach.call(document.querySelectorAll(".dz-choice"), function (b) {
      b.addEventListener("click", function () { tick(); applyDeal(b.getAttribute("data-deal"), b.getAttribute("data-choice")); });
    });
    var build = $("btn-build");
    if (build) build.addEventListener("click", function () {
      tick();
      var rid = build.getAttribute("data-region");
      var prev = state;
      var res = LD.buildPlant(state, rid);
      if (!res.ok) { flash(res.error); return; }
      state = res.state;
      persistRun();
      renderDesk(prev);
      floatAt(rid, "Plant opened −" + LD.formatMoney(res.cost).replace("$", "$"), "cost");
      popRegion(rid, "built");
    });
    var calm = $("btn-calm");
    if (calm) calm.addEventListener("click", function () {
      tick();
      var rid = calm.getAttribute("data-region");
      var prev = state;
      var res = LD.calmRegion(state, rid);
      if (!res.ok) { flash(res.error); return; }
      state = res.state;
      persistRun();
      renderDesk(prev);
      floatAt(rid, "Stress −" + LD.PR_PUSH.calm, "good");
      popRegion(rid, "calmed");
    });
  }

  function boardPoint(regionId) {
    var board = document.querySelector(".desk .board");
    var a = document.querySelector('.desk .anc[data-anc="' + regionId + '"]');
    if (!board || !a) return null;
    var b = board.getBoundingClientRect();
    var r = a.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
  }

  var floatStack = {};
  function floatAt(regionId, text, cls, delay) {
    var fx = $("fx");
    var p = boardPoint(regionId);
    if (!fx || !p) return;
    var now = Date.now();
    var st = floatStack[regionId];
    if (!st || now - st.t > 1600) st = floatStack[regionId] = { n: 0, t: now };
    var k = st.n++;
    st.t = now;
    var n = document.createElement("div");
    n.className = "float " + (cls || "");
    n.textContent = text;
    n.style.left = p.x + "px";
    n.style.top = (p.y + k * 40) + "px";
    if (delay) n.style.animationDelay = delay + "ms";
    fx.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 2600 + (delay || 0));
  }

  function popRegion(regionId, cls, delay) {
    var g = document.querySelector('.desk .region[data-region="' + regionId + '"]');
    if (!g) return;
    setTimeout(function () {
      g.classList.add(cls);
      var p = boardPoint(regionId);
      var fx = $("fx");
      if (p && fx) {
        var ring = document.createElement("div");
        ring.className = "burst " + cls;
        ring.style.left = p.x + "px";
        ring.style.top = p.y + "px";
        fx.appendChild(ring);
        setTimeout(function () { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 1400);
      }
    }, delay || 0);
  }

  function applyDeal(id, choice) {
    var prev = state;
    var res = LD.selectDeal(state, id, choice);
    if (!res.ok) { flash(res.error); return; }
    state = res.state;
    sel.deal = null;
    sel.region = null;
    persistRun();
    renderDesk(prev);
    var rid = res.region ? res.region.regionId : (prev.world && prev.world.pins[id]);
    if (rid) {
      var dc = state.cash - prev.cash;
      if (dc) floatAt(rid, (dc > 0 ? "+" : "−") + LD.formatMoney(Math.abs(dc)), dc > 0 ? "cash" : "cost");
      if (res.region && res.region.claim) {
        popRegion(rid, "claimed", 150);
        floatAt(rid, "Claimed!", "own", 350);
      } else if (res.region && res.region.stress > 0) {
        floatAt(rid, "Stress +" + res.region.stress, "bad", 350);
      } else if (res.region && res.region.stress < 0) {
        floatAt(rid, "Calmer", "good", 350);
      }
      var du = state.unrest - prev.unrest;
      if (du) floatAt(rid, "Unrest " + (du > 0 ? "+" : "−") + Math.abs(du), du > 0 ? "bad" : "good", 650);
    }
  }

  /* ---------- Bunker sheet ---------- */
  function openBunker() {
    bunkerMode = state.converting ? "install" : bunkerMode;
    showSheet(LD.renderBunkerSheet(state, bunkerMode), bindBunkerSheet);
  }

  function showSheet(html, bind) {
    var ov = $("overlay");
    ov.hidden = false;
    ov.className = "overlay on sheet-mode";
    ov.innerHTML = '<div class="sheet-wrap">' + html + "</div>";
    ov.onclick = function (e) { if (e.target === ov) { tick(); hideOverlay(); } };
    if (bind) bind();
  }

  function afterBunker(prev, msg) {
    state = prevGuard(state);
    persistRun();
    hideOverlay();
    renderDesk(prev);
    var card = $("bunker-card");
    if (card) {
      card.classList.add("installed");
      var t = document.createElement("div");
      t.className = "toast";
      t.textContent = msg;
      card.appendChild(t);
    }
  }

  function prevGuard(s) { return s; }

  function bindBunkerSheet() {
    var x = $("bs-close");
    if (x) x.addEventListener("click", function () { tick(); hideOverlay(); });
    Array.prototype.forEach.call(document.querySelectorAll(".bunker-sheet .mode"), function (b) {
      b.addEventListener("click", function () { tick(); bunkerMode = b.getAttribute("data-mode"); openBunker(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".bunker-sheet [data-up]"), function (b) {
      b.addEventListener("click", function () {
        tick();
        var prev = state;
        var res = LD.buyUpgrade(state, b.getAttribute("data-up"), b.getAttribute("data-q"));
        if (!res.ok) { flash(res.error); return; }
        state = res.state;
        afterBunker(prev, res.delayed ? "Shipment paid · arrives Q" + res.due : "Installed ✓");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".bunker-sheet [data-convert]"), function (b) {
      b.addEventListener("click", function () {
        tick();
        var prev = state;
        var sys = b.getAttribute("data-convert") || "";
        var res = LD.beginConversion(state, sys || null, sys ? b.getAttribute("data-q") : null);
        if (!res.ok) { flash(res.error); return; }
        state = res.state;
        bunkerMode = "install";
        afterBunker(prev, sys ? "Private supply ✓ secured" : "Private supply ✓");
      });
    });
    var hire = $("btn-engineer");
    if (hire) hire.addEventListener("click", function () {
      tick();
      var prev = state;
      var res = LD.hireEngineer(state);
      if (!res.ok) { flash(res.error); return; }
      state = res.state;
      afterBunker(prev, "Engineer hired ✓");
    });
    var seal = $("btn-seal");
    if (seal) seal.addEventListener("click", function () { tick(); showEvacConfirm(); });
  }

  /* ---------- Quarter close ---------- */
  var closing = false;
  function endQuarter() {
    if (closing) return;
    if (state.phase === "deal") {
      var desk = document.querySelector(".desk");
      var btn = $("btn-endq");
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      Array.prototype.forEach.call(desk.querySelectorAll(".pin"), function (p) { p.classList.add("coach"); });
      return;
    }
    var prev = state;
    var res = LD.closeQuarter(state);
    if (!res.ok) { flash(res.error); return; }
    closing = true;
    state = res.state;
    if (state.ended) recordEnding();
    else persistRun();
    var meta = loadMeta();
    if (!meta.coachDone) { meta.coachDone = true; saveMeta(meta); }
    var desk = document.querySelector(".desk");
    desk.classList.add("closing");
    var fx = $("fx");
    var stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.innerHTML = "Q" + prev.turn + " <span>closed</span>";
    fx.appendChild(stamp);
    setTimeout(function () {
      sel.deal = null; sel.region = null;
      hidePins = true;
      renderDesk(prev);
      var events = res.world || [];
      var delay = 200;
      events.forEach(function (ev) {
        if (!ev.regionId) return;
        var label = ev.kind === "income" ? "+" + LD.formatMoney(ev.cash) : ev.kind === "strike" ? "Strike!" : ev.kind === "riot" ? "Riots +" + ev.unrest : ev.kind === "protest" ? "Protest +" + ev.unrest : ev.kind === "revolt" ? "Nationalised!" : ev.text;
        var cls = ev.kind === "income" ? "cash" : "bad";
        floatAt(ev.regionId, label, cls, delay);
        popRegion(ev.regionId, "ev-" + ev.kind, delay);
        delay += 380;
      });
      setTimeout(function () {
        closing = false;
        showReport(prev, res);
      }, Math.max(1100, delay + 700));
    }, 850);
  }

  function showReport(prev, res) {
    var body = LD.renderReport(prev, state, res.fired, res.tick);
    showOverlay("", body,
      '<button class="btn btn-coral" id="ov-ok">' + (state.ended ? "See how it ends" : "Open Q" + state.turn) + "</button>",
      function () {
        $("ov-ok").addEventListener("click", function () {
          tick();
          hideOverlay();
          hidePins = false;
          if (state.ended) showEnd();
          else renderDesk();
        });
      });
    $("overlay").classList.add("report-mode");
  }

  function openMenu() {
    showOverlay("Menu", "<p class='muted'>Seed " + LD.escapeHtml(String(state.seedLabel)) + " · Q" + state.turn + "</p>",
      '<button class="btn btn-coral" id="mn-resume">Resume</button>' +
      '<button class="btn" id="mn-how">How to play</button>' +
      '<button class="btn" id="mn-title">Save &amp; exit to title</button>' +
      '<button class="btn btn-danger" id="mn-abandon">Abandon run</button>',
      function () {
        $("mn-resume").addEventListener("click", function () { tick(); hideOverlay(); });
        $("mn-how").addEventListener("click", function () {
          tick();
          screenIntent = "play";
          tutorialPage = 0;
          show("tutorial");
          renderTutorial();
        });
        $("mn-title").addEventListener("click", function () { tick(); persistRun(); show("title"); renderTitle(); });
        $("mn-abandon").addEventListener("click", function () {
          tick();
          state = null;
          clearMidRun();
          hideOverlay();
          show("title");
          renderTitle();
        });
      });
  }

  function showEvacConfirm() {
    showOverlay(
      "Seal the bunker now?",
      LD.evacConfirmBody(state),
      '<button class="btn btn-danger" id="ov-seal">Seal now</button><button class="btn btn-ghost" id="ov-wait">Keep working</button>',
      function () {
        $("ov-seal").addEventListener("click", function () {
          tick();
          var res = LD.attemptEvacuation(state);
          if (!res.ok) { hideOverlay(); flash(res.error); return; }
          state = res.state;
          recordEnding();
          hideOverlay();
          showEnd();
        });
        $("ov-wait").addEventListener("click", function () { tick(); hideOverlay(); });
      }
    );
  }

  function showEnd() {
    show("end");
    $("screen-end").innerHTML = LD.renderEnd(state);
    $("btn-again").addEventListener("click", function () {
      tick();
      selectedExec = state.executiveId;
      seedDraft = "";
      startRun();
    });
    $("btn-title").addEventListener("click", function () {
      tick();
      show("title");
      renderTitle();
    });
  }

  function renderHistory() {
    $("screen-history").innerHTML = LD.renderHistory({ meta: loadMeta() });
    $("btn-h-back").addEventListener("click", function () { tick(); show("title"); renderTitle(); });
  }

  function showOverlay(title, body, actions, bind) {
    var ov = $("overlay");
    ov.hidden = false;
    ov.className = "overlay on";
    ov.onclick = null;
    ov.innerHTML = '<div class="panel">' + (title ? "<h2>" + LD.escapeHtml(title) + "</h2>" : "") + body + '<div class="btn-row">' + actions + "</div></div>";
    if (bind) bind();
  }

  function hideOverlay() {
    var ov = $("overlay");
    ov.className = "overlay";
    ov.onclick = null;
    ov.hidden = true;
    ov.innerHTML = "";
  }

  function flash(msg) {
    showOverlay("Cannot do that", "<p>" + LD.escapeHtml(msg || "That action is not available.") + "</p>",
      '<button class="btn btn-coral" id="ov-ok">OK</button>',
      function () { $("ov-ok").addEventListener("click", function () { tick(); hideOverlay(); }); }
    );
  }

  function boot() {
    seedDraft = "";
    show("title");
    renderTitle();
  }

  document.addEventListener("DOMContentLoaded", boot);
})();

  </script>
</body>
</html>
