:root {
  --teal: rgb(10, 70, 78);
  --teal-deep: rgb(8, 50, 56);
  --teal-mid: rgb(16, 90, 98);
  --chip: rgb(10, 58, 66);
  --ink: rgb(18, 44, 50);
  --ink-muted: rgb(64, 86, 88);
  --ochre: rgb(201, 148, 40);
  --coral: rgb(224, 90, 72);
  --coral-deep: rgb(184, 62, 50);
  --cream: rgb(248, 236, 210);
  --cream-panel: rgb(251, 243, 224);
  --paper: rgb(252, 245, 228);
  --ground: rgb(236, 220, 186);
  --font-serif: "Playfair Display", Palatino, "Palatino Linotype", Georgia, serif;
  --font-slab: "Zilla Slab", Palatino, Georgia, serif;
  --font-sans: "Source Sans Pro", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --tap: 48px;
  --tap-min: 44px;
  --pad: clamp(16px, 3.2vw, 28px);
  --radius: 12px;
  --text: 17px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text);
  line-height: 1.45;
}
body {
  min-height: 100dvh;
  background-image: radial-gradient(rgba(10, 70, 78, 0.12) 1.05px, transparent 1.2px);
  background-size: 9px 9px;
  background-attachment: fixed;
}
button, input { font: inherit; color: inherit; }
button {
  appearance: none;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
img { max-width: 100%; display: block; }

.shell {
  width: min(740px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.page {
  position: relative;
  min-height: calc(100dvh - 20px);
  background: var(--cream);
  border: 2px solid var(--teal);
  border-radius: 4px;
  overflow: auto;
}
.page::before, .page::after {
  content: "";
  position: absolute;
  pointer-events: none;
  width: 14px;
  height: 14px;
  border: 2px solid var(--teal);
  z-index: 5;
}
.page::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.page::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.page.play, .page.inner { background: var(--ground); background-image: radial-gradient(rgba(10, 70, 78, 0.12) 1.05px, transparent 1.2px); background-size: 9px 9px; }
.page-inner { padding: 18px var(--pad) 28px; }

.screen { display: none; }
.screen.on { display: block; }

.kicker {
  font-size: 16px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ochre);
}
.muted { color: var(--ink-muted); }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 700; letter-spacing: -0.02em; margin: 0; color: var(--teal); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 16px;
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--paper);
  color: var(--teal);
  font-weight: 600;
  font-size: 17px;
  text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.38; pointer-events: none; }
.btn-coral {
  background: var(--coral);
  border-color: var(--coral);
  color: var(--cream-panel);
  font-weight: 700;
}
.btn-ochre {
  background: var(--ochre);
  border-color: var(--ochre);
  color: var(--teal-deep);
  font-weight: 700;
}
.btn-teal {
  background: var(--teal);
  border-color: var(--teal);
  color: var(--cream-panel);
  font-weight: 700;
}
.btn-danger {
  background: var(--paper);
  border-color: var(--coral);
  color: var(--coral-deep);
}
.btn-ghost {
  background: transparent;
  border-color: rgba(16, 90, 98, 0.45);
  color: var(--ink-muted);
}
.btn-row { display: grid; gap: 10px; margin-top: 12px; }
.btn-row.split { grid-template-columns: 1fr 1fr; }
.field-label {
  display: block;
  font-size: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 14px 0 6px;
  font-weight: 600;
}
.seed-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}
.seed-row input {
  min-height: var(--tap);
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--paper);
  padding: 0 14px;
  width: 100%;
  font-size: 17px;
}
.footer-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}

/* Title: HTML wordmark sits above the art, not over it. */
.title-page { display: flex; flex-direction: column; min-height: calc(100dvh - 20px); background: var(--cream); }
.title-copy {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 28px 24px 16px;
  color: var(--teal);
  background: var(--cream);
  flex: 0 0 auto;
}
.title-art {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  flex: 0 0 auto;
  aspect-ratio: 900 / 720;
  overflow: hidden;
  background: var(--cream);
}
.title-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
  object-position: center center;
}
.title-copy .kicker { color: var(--teal); letter-spacing: 0.18em; font-weight: 700; font-size: 16px; }
.title-copy h1 {
  font-size: clamp(48px, 14vw, 86px);
  line-height: 0.86;
  margin: 12px 0 10px;
  color: var(--teal);
}
.title-copy h1 .it {
  display: block;
  font-style: italic;
  font-weight: 600;
  font-size: 0.62em;
  line-height: 1;
}
.title-copy h1::after {
  content: "";
  display: block;
  width: 72px;
  height: 2px;
  background: var(--ochre);
  margin: 12px auto 0;
}
.tagline {
  font-family: var(--font-slab);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(18px, 3.4vw, 22px);
  color: var(--coral);
  margin: 12px 0 0;
}
.title-panel {
  position: relative;
  z-index: 2;
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  margin-top: 0;
  padding: 22px 18px max(22px, env(safe-area-inset-bottom));
  box-shadow: 0 -10px 28px rgba(8, 50, 56, 0.14);
}
.demo-note {
  margin: 14px 0 0;
  font-size: 16px;
  color: var(--ink-muted);
  text-align: center;
}

/* Inner brochure pages */
.inner-head { padding: 8px 0 16px; }
.inner-head h2 { font-size: clamp(28px, 6vw, 36px); margin-top: 6px; }
.exec-list { display: grid; gap: 12px; }
.exec-card {
  text-align: left;
  padding: 16px;
  min-height: 96px;
  border-radius: var(--radius);
  border: 2px solid var(--teal);
  background: var(--paper);
}
.exec-card:active { transform: translateY(1px); }
.exec-card.on { box-shadow: inset 0 0 0 2px var(--coral); border-color: var(--coral); }
.exec-card.locked { opacity: 0.55; }
.exec-card .name { font-family: var(--font-serif); font-size: 24px; color: var(--teal); }
.exec-card .firm { color: var(--ochre); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; margin: 4px 0 8px; font-weight: 600; }
.exec-card p { margin: 0; color: var(--ink-muted); font-size: 16px; }
.dots { display: flex; gap: 8px; margin: 16px 0; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(10, 70, 78, 0.25); display: block; }
.dots i.on { background: var(--coral); }

/* Play chrome */
.chrome {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 12px;
  background: var(--teal);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--cream);
  min-height: 82px;
}
.chrome .kicker { color: var(--ochre); margin-bottom: 2px; }
.chrome .who { font-size: 16px; color: var(--cream); }
.chrome h2 { font-family: var(--font-sans); font-weight: 700; font-size: 22px; color: var(--cream); letter-spacing: 0; }
.q-badge {
  flex: 0 0 62px;
  width: 62px;
  min-height: 54px;
  border-radius: 8px;
  background: var(--coral);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 22px;
  box-shadow: inset 0 0 0 2px var(--cream);
  margin: 4px 0;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 8px;
}
.stat {
  background: var(--teal);
  border-radius: 10px;
  padding: 10px 10px 8px;
  color: var(--cream);
  min-height: 86px;
  overflow: hidden;
  position: relative;
}
.stat::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 5px;
  background: var(--coral);
}
.stat.cash::before { background: var(--ochre); }
.stat .lbl {
  font-size: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--cream);
}
.stat .val {
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin: 2px 0 8px;
  color: var(--cream);
}
.bar {
  height: 7px;
  border-radius: 99px;
  background: var(--teal-deep);
  overflow: hidden;
}
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--coral); }
.stat.cash .bar > span { background: var(--ochre); }
.forecast {
  font-family: var(--font-slab);
  font-style: italic;
  font-size: 17px;
  color: var(--ink);
  margin: 4px 0 12px;
}

.hero-frame {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  height: clamp(180px, 32vw, 280px);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--teal-deep);
}
.hero-frame.deal {
  height: auto;
  aspect-ratio: 960 / 540;
  background: var(--cream);
}
.hero-frame.bunker { height: clamp(170px, 30vw, 260px); }
.hero-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
}
.hero-frame.deal img {
  object-fit: contain;
  object-position: center center;
}
.hero-frame.bunker img { object-position: center center; }
.chips {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 0 0 12px;
}
.chip {
  background: var(--chip);
  border: 2px solid var(--cream);
  border-radius: 8px;
  padding: 6px 6px 5px;
  color: var(--cream);
  min-height: 62px;
  text-align: left;
}
.chip .nm { font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.chip .lv { font-size: 18px; font-weight: 700; line-height: 1.15; }
.chip .q { font-size: 16px; line-height: 1.15; opacity: 0.95; }
.chip.ready { border-color: var(--ochre); }
.chip.risk { border-color: var(--coral); }
.chip.incomplete { border-color: var(--coral); }
.chip .nm.accent { color: var(--coral); }

.pending {
  margin: 0 0 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--teal);
  color: var(--cream);
  font-size: 16px;
}
.pending strong { color: var(--ochre); font-weight: 700; }

.banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: var(--teal);
  color: var(--cream);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 0 0 12px;
  min-height: var(--tap-min);
}
.banner h2 { font-family: var(--font-sans); font-size: 18px; font-weight: 700; color: var(--cream); letter-spacing: 0; }
.banner .ap { font-size: 16px; color: var(--cream); font-weight: 600; }

.deals { display: grid; gap: 12px; }
.deal {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  text-align: left;
  border-radius: 12px;
  border: 2px solid var(--teal);
  background: var(--paper);
  padding: 0;
  min-height: 112px;
  overflow: hidden;
  position: relative;
}
.deal-layout {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 12px;
  width: 100%;
  min-height: 112px;
  align-items: stretch;
}
.deal:active { transform: translateY(1px); }
.deal::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--coral);
}
.deal.crisis::before { width: 6px; }
.deal-art, .deal-fallback {
  width: 92px;
  min-width: 92px;
  min-height: 112px;
  object-fit: cover;
  height: 100%;
  max-width: none;
  background: var(--teal-deep);
}
.deal-fallback {
  /* Decorative tile only — category text lives in .deal-body so it cannot clip. */
  display: block;
  padding: 0;
  background:
    radial-gradient(circle at 70% 22%, var(--coral) 0 16px, transparent 17px),
    linear-gradient(160deg, var(--teal-mid), var(--teal-deep));
}
.deal-body { padding: 12px 14px 12px 0; min-width: 0; }
.deal-body .kicker { font-size: 16px; color: var(--coral); letter-spacing: 0.08em; overflow-wrap: anywhere; }
.deal-body h3 { font-family: var(--font-sans); font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: 0; margin: 2px 0 6px; text-transform: none; }
.deal-body p { margin: 0 0 8px; color: var(--ink-muted); font-size: 16px; }
.deal-body .hint { font-size: 16px; color: var(--ink); border-top: 1px solid rgba(18, 44, 50, 0.16); padding-top: 8px; }
.deal[disabled] { opacity: 0.45; pointer-events: none; }
.choices { display: grid; gap: 8px; margin-top: 10px; grid-column: 1 / -1; padding: 0 12px 12px; }
.choice {
  text-align: left;
  min-height: var(--tap);
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--cream-panel);
}
.choice:active { transform: translateY(1px); }
.choice strong { display: block; margin-bottom: 2px; font-size: 17px; }
.choice span { color: var(--ink-muted); font-size: 16px; }

.upgrade {
  border: 2px solid var(--teal);
  background: var(--paper);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.upgrade h3 { font-family: var(--font-sans); font-size: 18px; font-weight: 700; color: var(--ink); letter-spacing: 0; margin-bottom: 4px; }
.upgrade .meta { color: var(--ink-muted); font-size: 16px; margin-bottom: 10px; }

.readiness {
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 12px;
  padding: 14px;
  margin: 0 0 14px;
}
.readiness h3 { font-family: var(--font-sans); font-size: 18px; color: var(--teal); letter-spacing: 0; margin-bottom: 8px; }
.readiness p, .readiness li { font-size: 16px; margin: 0 0 8px; color: var(--ink); }
.readiness ul { margin: 0 0 8px; padding: 0; list-style: none; }
.readiness li { padding: 6px 0 6px 12px; border-left: 4px solid var(--ink-muted); }
.readiness li.ready { border-color: var(--ochre); }
.readiness li.risk { border-color: var(--coral); }
.readiness li.incomplete, .readiness li.empty { border-color: var(--ink-muted); }
.readiness .tally { font-weight: 700; margin: 0; }

.log { margin-top: 16px; color: var(--ink-muted); font-size: 16px; }
.log ul { margin: 8px 0 0; padding: 0; }
.log li { list-style: none; margin: 0 0 6px; }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(8, 50, 56, 0.78);
  padding: max(24px, env(safe-area-inset-top)) 18px 28px;
  overflow: auto;
}
.overlay.on { display: block; }
.overlay .panel {
  width: min(560px, 100%);
  margin: 8vh auto 0;
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 14px;
  padding: 20px 18px;
}
.overlay .panel h2 { margin-bottom: 10px; font-size: 28px; }
.overlay .panel p { color: var(--ink); font-size: 16px; }

.end-mark {
  font-size: 16px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 10px;
}
.end-mark.win { color: var(--ochre); }
.end-mark.lose { color: var(--coral-deep); }
.end-hero { position: relative; display: block; width: 100%; height: 180px; border-radius: 10px; overflow: hidden; margin: 14px 0; background: var(--teal-deep); }
.end-hero img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center center; }
.end-hero.diagram { height: auto; aspect-ratio: 900 / 720; background: var(--cream); }
.end-hero.diagram img { object-fit: contain; }
.history ul { margin: 0; padding: 0; }
.history li {
  list-style: none;
  padding: 12px 0;
  border-bottom: 1px solid rgba(10, 70, 78, 0.18);
  color: var(--ink-muted);
  font-size: 16px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}


.contracts {
  background: var(--paper);
  border: 2px solid var(--teal);
  border-radius: 10px;
  padding: 12px;
  margin: 0 0 12px;
}
.contracts > .kicker { color: var(--coral); margin-bottom: 8px; }
.contract-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.contract {
  border: 2px solid var(--teal);
  border-radius: 8px;
  padding: 8px;
  background: var(--cream);
  min-height: 72px;
}
.contract .nm {
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.contract .lv { font-size: 16px; font-weight: 700; color: var(--teal); }
.contract .q { font-size: 16px; color: var(--ink-muted); }
.contract.strained { border-color: var(--ochre); }
.contract.strained .lv { color: var(--ochre); }
.contract.disrupted { border-color: var(--coral); }
.contract.disrupted .lv { color: var(--coral); }
.convert-banner {
  background: var(--teal);
  color: var(--cream);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 16px;
  margin: 0 0 10px;
}
.convert-panel { border-color: var(--ochre); }

@media (max-width: 520px) {
  .chips { grid-template-columns: 1fr 1fr; }
  .contract-grid { grid-template-columns: 1fr 1fr; }
  .hero-frame.bunker {
    height: clamp(240px, 62vw, 360px);
  }
}

.tutorial-page {
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - 20px);
}
.tutorial-page .page-inner {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.tutorial-copy {
  flex: 1 1 auto;
}
.tutorial-page .btn-row {
  flex: 0 0 auto;
  margin-top: auto;
  position: sticky;
  bottom: 0;
  padding-top: 16px;
  min-height: calc(16px + var(--tap) * 2 + 10px);
  align-content: start;
  background: linear-gradient(to top, var(--ground) 70%, rgba(236, 220, 186, 0));
}

/* =====================================================================
   World-map desk (sunny corporate gloss). Touch-first, landscape + portrait.
   ===================================================================== */
:root {
  --sun: #ffd36a;
  --glass: rgba(255, 252, 244, 0.86);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --teal-glow: #19b3a6;
  --shadow: 0 10px 28px rgba(80, 48, 12, 0.22), 0 2px 6px rgba(80, 48, 12, 0.18);
  --good: #0f8a6a;
  --bad: #d2493a;
}
body.on-desk { background: #e8c48f; }
body.on-desk .shell { width: 100%; max-width: none; padding: 0; }
.desk {
  position: relative;
  min-height: 100dvh;
  display: grid;
  gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  grid-template-columns: 1fr;
  grid-template-areas: "head" "board" "dash" "hand" "dos";
  background:
    radial-gradient(120% 70% at 85% -10%, rgba(255, 244, 200, 0.95), rgba(255, 244, 200, 0) 60%),
    repeating-linear-gradient(94deg, rgba(120, 72, 24, 0.05) 0 2px, transparent 2px 22px),
    linear-gradient(180deg, #f6dcab 0%, #e7bd83 55%, #d9a76b 100%);
  overflow-x: clip;
  color: var(--ink);
}
.desk-light {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.0) 0 80px, rgba(255, 255, 255, 0.14) 80px 150px, rgba(255, 255, 255, 0) 150px 260px);
  animation: beams 18s ease-in-out infinite alternate;
}
@keyframes beams { from { background-position: 0 0; } to { background-position: 160px 0; } }
.desk > * { position: relative; z-index: 1; }
.desk-head { grid-area: head; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { text-align: left; }
.wordmark {
  font-family: var(--font-sans); font-weight: 700; letter-spacing: 0.04em;
  font-size: clamp(28px, 4.2vw, 46px); line-height: 1; color: var(--teal);
  text-shadow: 0 2px 0 #fff6dc, 0 4px 10px rgba(10, 70, 78, 0.25);
  position: relative; display: inline-block;
}
.wordmark .sun {
  position: absolute; right: -40px; top: -18px; width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle, #fff3b0 0 35%, var(--sun) 36% 60%, rgba(255, 211, 106, 0) 62%);
  box-shadow: 0 0 22px 6px rgba(255, 211, 106, 0.7);
  animation: sunspin 6s linear infinite;
}
@keyframes sunspin { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.tag { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #a36a10; font-size: 16px; margin-top: 4px; }
.head-right { display: flex; align-items: center; gap: 10px; }
.q-chip {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 70px; min-height: 56px; padding: 4px 12px; border-radius: 14px;
  background: linear-gradient(180deg, #13606a, var(--teal-deep)); color: #fff; font-weight: 700; font-size: 26px; line-height: 1;
  box-shadow: var(--shadow);
}
.q-chip small { font-size: 16px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.8; text-transform: uppercase; margin-bottom: 2px; }
.icon-btn {
  min-width: 52px; min-height: 52px; border-radius: 14px; font-size: 24px; color: var(--teal);
  background: var(--glass); box-shadow: var(--shadow);
}
.panel {
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 12px; text-align: left;
}
.panel-k, .dz-k {
  font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal);
}

/* ---- Board / map ---- */
.board { grid-area: board; position: relative; min-height: 0; display: flex; flex-direction: column; align-items: stretch; }
.board-tilt { perspective: 1500px; flex: 1; min-height: 0; display: flex; }
.board-slab {
  flex: 1; min-height: 0; position: relative; overflow: hidden; background: #2a9bb5;
  transform: rotateX(16deg) scale(0.98); transform-origin: 50% 100%;
  border-radius: 26px; padding: 6px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.25));
  box-shadow: 0 14px 0 -2px #0b4f5e, 0 34px 40px -14px rgba(70, 38, 6, 0.6), 0 0 0 5px rgba(255, 255, 255, 0.55) inset;
  padding: 0;
}
.board-slab::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.5), inset 0 0 40px rgba(6, 50, 70, 0.45); pointer-events: none; z-index: 2; }
.map { display: block; width: 100%; height: 100%; aspect-ratio: 2 / 1; }
.map .waves { animation: waves 9s linear infinite; opacity: 0.9; }
@keyframes waves { from { transform: translate(0, 0); } to { transform: translate(40px, 0); } }
.map .glare { mix-blend-mode: screen; animation: glare 12s ease-in-out infinite alternate; }
@keyframes glare { from { transform: translate(-80px, -10px); opacity: 0.65; } to { transform: translate(120px, 20px); opacity: 1; } }
.map .grat { fill: none; stroke: #fff; stroke-opacity: 0.16; stroke-width: 1; }
.map .route { fill: none; stroke: #fff; stroke-opacity: 0.35; stroke-width: 2; stroke-dasharray: 3 8; stroke-linecap: round; }
.map .route.live { stroke: #ffe39a; stroke-opacity: 0.95; stroke-width: 3; stroke-dasharray: 10 10; animation: dash 2.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -40; } }
.map .region { cursor: pointer; transition: transform 0.45s cubic-bezier(.2,1.4,.4,1); }
.map .region .side { fill: #8b6a3c; }
.map .region .top { fill: url(#mg-land); stroke: #fffaf0; stroke-width: 1.4; transition: fill 0.4s; }
.map .region .dots { pointer-events: none; opacity: 0.8; }
.map .region.owned { transform: translate(0, -5px); }
.map .region.owned .side { fill: #064a4f; }
.map .region.owned .top { fill: url(#mg-own); stroke: #b8fff4; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(25, 179, 166, 0.9)); }
.map .region.s-strike:not(.owned) .top, .map .region.t-crisis:not(.owned) .top { fill: url(#mg-burn); }
.map .region.owned.s-strike .top { stroke: #ff8a6a; stroke-width: 3; }
.map .region.sel .top { stroke: var(--coral); stroke-width: 4; }
.map .region.claimed .top { animation: claimflash 1.2s ease-out; }
@keyframes claimflash { 0% { fill: #fff; } 40% { fill: #7ff2e3; } 100% { } }
.map .region.ev-revolt { animation: shudder 0.6s ease-in-out 2; }
.map .region.ev-income .top { animation: incomeflash 0.9s ease-out; }
@keyframes incomeflash { 30% { fill: #ffe39a; } }
@keyframes shudder { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 0); } 75% { transform: translate(4px, 0); } }
.map .borders { fill: none; stroke: #6a4a20; stroke-opacity: 0.18; stroke-width: 0.7; pointer-events: none; }
.map .rlabel { font-family: var(--font-sans); font-weight: 700; font-size: 17px; letter-spacing: 0.08em; fill: #5b3f14; paint-order: stroke; stroke: #fff4d8; stroke-width: 4px; pointer-events: none; }
.map .rlabel.own { fill: #04454a; stroke: #d9fff8; }
.map .rtag { font-family: var(--font-sans); font-weight: 700; font-size: 16px; letter-spacing: 0.1em; fill: #0f8a6a; paint-order: stroke; stroke: #fff; stroke-width: 4px; pointer-events: none; }
.map .anc { fill: none; }
.map .props, .map .traffic { pointer-events: none; }
.map .ship { filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.3)); }
.map .plane { opacity: 0.9; }
.map .flag .cloth { transform-origin: 0 -12px; animation: wave 1.6s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.82); } }
.map .plant .steam { animation: steam 2.4s ease-out infinite; opacity: 0.8; }
@keyframes steam { from { transform: translate(0, 0) scale(0.6); opacity: 0.85; } to { transform: translate(4px, -14px) scale(1.5); opacity: 0; } }
.map .plant.off { filter: grayscale(0.8) brightness(0.85); }
.map .hz.fire { animation: flicker 0.9s ease-in-out infinite alternate; transform-origin: 0 6px; }
@keyframes flicker { from { transform: scale(0.92, 0.9); } to { transform: scale(1.08, 1.12); } }
.map .hz.storm .spin { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.map .hz.flood { animation: bob 2s ease-in-out infinite; }
.map .hz.drought { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.map .protest .sign { animation: bob 0.8s ease-in-out infinite; }
.map .protest.hot .sign rect { fill: #ffd2c4; stroke: var(--bad); }

/* Deal pins */
.map .pin { cursor: pointer; }
.map .pin .hit { fill: transparent; }
.map .pin-body { animation: pindrop 0.7s cubic-bezier(.2,1.6,.4,1) both, pinbob 2.4s ease-in-out 0.8s infinite; animation-delay: calc(var(--i) * 0.15s), calc(0.8s + var(--i) * 0.3s); }
@keyframes pindrop { from { transform: translateY(-120px) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pinbob { 50% { transform: translateY(-5px); } }
.map .pin .drop { fill: #fffaf0; stroke: #a36a10; stroke-width: 3; filter: drop-shadow(0 4px 3px rgba(60, 30, 0, 0.35)); }
.map .pin.k-claim .drop { fill: #fff3c4; stroke: var(--teal); }
.map .pin.k-squeeze .drop { fill: #ffe7a6; stroke: #a36a10; }
.map .pin.k-calm .drop { fill: #e3fbf1; stroke: var(--good); }
.map .pin.k-crisis .drop { fill: #ffd9cf; stroke: var(--bad); }
.map .pin .glyph { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: var(--teal); dominant-baseline: central; transform: translateY(-8px); pointer-events: none; }
.map .pin.k-crisis .glyph { fill: var(--bad); }
.map .pin.k-squeeze .glyph { fill: #8a5508; }
.map .pin.k-calm .glyph { fill: var(--good); }
.map .pin .ring { fill: none; stroke: #fff; stroke-width: 3; opacity: 0; transform: translateY(-8px); }
.map .pin.sel .drop { fill: var(--coral); stroke: #fff; }
.map .pin.sel .glyph { fill: #fff; }
.map .pin.sel .ring, .map .pin.coach .ring { animation: ring 1.4s ease-out infinite; }
.map .pin.coach .ring { stroke: #ffe39a; stroke-width: 5; }
@keyframes ring { from { r: 20; opacity: 0.95; } to { r: 52; opacity: 0; } }

.phase-pill {
  align-self: center; margin-top: -4px; padding: 6px 16px; border-radius: 999px;
  background: rgba(10, 70, 78, 0.9); color: #fff; font-weight: 600; font-size: 16px; box-shadow: var(--shadow);
}
.fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
.float {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-weight: 700; font-size: 20px; padding: 4px 12px; border-radius: 999px; color: #fff;
  background: var(--teal); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
  animation: floatup 2.2s ease-out both;
}
.float.cash { background: linear-gradient(180deg, #ffcf4a, #e39a12); color: #3b2500; }
.float.cost { background: #5b6b6e; }
.float.bad { background: var(--bad); }
.float.good { background: var(--good); }
.float.own { background: var(--teal-glow); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.08); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
.burst { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 4px solid var(--teal-glow); animation: burst 1.2s ease-out both; }
.burst.ev-revolt, .burst.ev-riot, .burst.ev-protest { border-color: var(--bad); }
.burst.ev-income { border-color: #ffcf4a; }
@keyframes burst { from { transform: scale(0.5); opacity: 1; } to { transform: scale(9); opacity: 0; } }
.stamp {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%) rotate(-8deg);
  font-weight: 700; font-size: clamp(40px, 7vw, 76px); color: var(--coral); letter-spacing: 0.06em;
  border: 6px solid var(--coral); border-radius: 14px; padding: 4px 26px; background: rgba(255, 250, 240, 0.85);
  animation: stamp 0.8s cubic-bezier(.2,1.4,.4,1) both;
}
.stamp span { font-size: 0.55em; text-transform: uppercase; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } }
.desk.closing .board-slab { animation: closeshake 0.5s ease-in-out; }
@keyframes closeshake { 30% { transform: rotateX(20deg) scale(0.96); } }

/* ---- Coach bubbles ---- */
.coach-bubble {
  position: absolute; z-index: 8; padding: 10px 16px; border-radius: 14px; background: var(--teal); color: #fff;
  font-weight: 700; font-size: 18px; box-shadow: var(--shadow); animation: coachbob 1.6s ease-in-out infinite; pointer-events: none;
  max-width: 280px; text-align: center;
}
.coach-bubble::after { content: ""; position: absolute; width: 16px; height: 16px; background: var(--teal); transform: rotate(45deg); }
.coach-bubble.c-pin { bottom: 44px; left: 50%; margin-left: -140px; width: 280px; }
.coach-bubble.c-pin::after { top: -7px; left: 132px; }
.coach-bubble.c-bunker { right: 14px; bottom: calc(100% - 4px); }
.coach-bubble.c-end { right: 14px; bottom: 112px; }
.coach-bubble.c-end::after, .coach-bubble.c-bunker::after { bottom: -7px; right: 40px; }
@keyframes coachbob { 50% { transform: translateY(-5px); } }

/* ---- Dash ---- */
.dash { grid-area: dash; display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-content: start; }
.dash-meters { grid-column: 1 / -1; }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.meter { background: #fff; border-radius: 12px; padding: 6px 10px 8px; box-shadow: inset 0 0 0 1px rgba(10, 70, 78, 0.12); }
.m-lbl { font-size: 16px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.m-val { font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--teal); font-variant-numeric: tabular-nums; }
.m-unrest .m-val { color: #b4570e; }
.m-collapse .m-val { color: var(--bad); }
.m-bar { height: 9px; border-radius: 9px; background: rgba(10, 70, 78, 0.1); overflow: hidden; margin-top: 4px; }
.m-bar span { display: block; height: 100%; border-radius: inherit; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.m-cash .m-bar span { background: linear-gradient(90deg, #f5c04a, #e39a12); }
.m-unrest .m-bar span { background: linear-gradient(90deg, #f5c04a, #e2722b); }
.m-collapse .m-bar span { background: linear-gradient(90deg, #f08a5d, var(--bad)); }
.m-sub { font-size: 16px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter.rise .m-val, .meter.fall .m-val { animation: pulse 0.9s ease-out; }
@keyframes pulse { 30% { transform: scale(1.18); } }
.spark-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 8px; }
.spark-row .spark { width: 100%; height: 44px; display: block; }
.holdings { line-height: 1.2; text-align: right; }
.spark .area { fill: rgba(25, 179, 166, 0.16); }
.spark .line { fill: none; stroke: var(--good); stroke-width: 3; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark .line.down { stroke: var(--bad); }
.holdings { font-size: 16px; color: var(--ink-muted); }
.holdings b { color: var(--teal); }
.ticker { overflow: hidden; }
.tick-wrap { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.tick-run { display: inline-block; animation: ticker 40s linear infinite; font-size: 16px; padding-top: 4px; }
.tick-run span { margin-right: 36px; }
.tick-run span::before { content: "● "; color: var(--coral); }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.bunker-card { display: flex; flex-direction: column; gap: 4px; position: relative; cursor: pointer; transition: transform 0.2s; }
.bunker-card:active { transform: scale(0.98); }
.bunker-card.ready { box-shadow: var(--shadow), 0 0 0 3px var(--teal-glow); animation: readyglow 1.8s ease-in-out infinite; }
@keyframes readyglow { 50% { box-shadow: var(--shadow), 0 0 0 6px rgba(25, 179, 166, 0.35); } }
.cutaway { width: 100%; height: auto; display: block; border-radius: 10px; overflow: hidden; }
.cutaway .room rect:first-child { fill: #3d3328; stroke: #fff; stroke-width: 2; }
.cutaway .room.st-incomplete rect:first-child { fill: #c99428; }
.cutaway .room.st-risk rect:first-child { fill: var(--coral); }
.cutaway .room.st-ready rect:first-child { fill: var(--teal-glow); }
.cutaway .r-ico { font-size: 22px; font-weight: 700; fill: #fff; }
.cutaway .pip { fill: rgba(255, 255, 255, 0.3); }
.cutaway .pip.on { fill: #fff; }
.bc-cta { font-weight: 700; color: var(--teal); font-size: 16px; }
.bunker-card.ready .bc-cta { color: var(--coral-deep); }
.toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--teal); color: #fff;
  font-weight: 700; padding: 8px 16px; border-radius: 999px; white-space: nowrap; animation: floatup 2.2s ease-out both; font-size: 18px;
}

/* ---- Hand ---- */
.hand { grid-area: hand; display: grid; gap: 10px; grid-template-columns: 1fr; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card {
  position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: 2px 10px; align-items: start;
  min-height: 96px; padding: 10px 12px; text-align: left; border-radius: 16px; background: var(--glass); box-shadow: var(--shadow);
  border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s, opacity 0.3s;
}
.card:active { transform: translateY(2px); }
.card.sel { border-color: var(--coral); transform: translateY(-4px); }
.card.gone { opacity: 0.4; filter: grayscale(0.7); }
.card.taken { border-color: var(--teal-glow); }
.card.dealing { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); animation: coachbob 1.2s ease-in-out infinite; }
.c-ico { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; background: #fff3c4; color: var(--teal); }
.card.k-squeeze .c-ico { background: #ffe7a6; color: #8a5508; }
.card.k-calm .c-ico { background: #e3fbf1; color: var(--good); }
.card.k-crisis .c-ico { background: #ffd9cf; color: var(--bad); }
.c-txt { display: flex; flex-direction: column; min-width: 0; }
.c-k { font-size: 16px; font-weight: 700; color: #a36a10; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-t { font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--ink); }
.c-tag { justify-self: end; font-weight: 700; color: #fff; background: var(--coral); border-radius: 999px; padding: 2px 10px; font-size: 16px; }
.card.k-calm .c-tag { background: var(--good); }
.c-stamp { position: absolute; right: 10px; top: 8px; transform: rotate(8deg); border: 3px solid var(--teal-glow); color: var(--teal-glow); font-weight: 700; padding: 0 8px; border-radius: 6px; text-transform: uppercase; font-size: 16px; }
.end-q {
  position: relative; display: flex; align-items: center; gap: 14px; min-height: 84px; padding: 10px 20px; border-radius: 22px; text-align: left;
  color: #fff; background: linear-gradient(180deg, #b9b2a6, #8f877b); box-shadow: var(--shadow); transition: transform 0.15s, filter 0.2s;
}
.end-q.live { background: linear-gradient(180deg, #ff8a6a 0%, var(--coral) 45%, var(--coral-deep) 100%); box-shadow: var(--shadow), inset 0 2px 0 rgba(255, 255, 255, 0.5); }
.end-q.live::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 45%, transparent 60%); background-size: 250% 100%; animation: sheen 3s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { from { background-position: 130% 0; } to { background-position: -130% 0; } }
.end-q:active { transform: scale(0.97); }
.end-q.coach { animation: coachbob 1.6s ease-in-out infinite; }
.end-q.shake { animation: shake 0.45s ease-in-out; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.eq-ico { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; }
.eq-t { font-weight: 700; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: 0.04em; line-height: 1.05; }
.eq-t small { display: block; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; opacity: 0.92; margin-top: 4px; }

/* ---- Dossier ---- */
.dossier { grid-area: dos; }
.dz { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; position: relative; }
.dossier.pop .dz { animation: dzpop 0.35s cubic-bezier(.2,1.4,.4,1); }
@keyframes dzpop { from { transform: translateY(14px) scale(0.97); opacity: 0.4; } }
.dz h3 { font-family: var(--font-sans); font-size: 22px; line-height: 1.15; margin: 4px 0 6px; color: var(--ink); letter-spacing: 0; }
.dz-x { position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; color: var(--ink-muted); background: rgba(10, 70, 78, 0.06); }
.dz-k { padding-right: 46px; color: #a36a10; }
.dz-art { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; margin: 4px 0 8px; }
.dz-body { margin: 0 0 8px; color: var(--ink-muted); font-size: 16px; }
.dz-note { font-size: 16px; color: var(--ink-muted); margin: 6px 0; }
.dz-note.priv { color: var(--teal); }
.fine { font-size: 16px; color: var(--ink-muted); font-style: italic; margin: 8px 0; }
.fx-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.row-k, .when { font-size: 16px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); min-width: 52px; }
.when { min-width: 0; color: #a36a10; }
.fx-chip { font-size: 16px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #eef2f0; color: var(--ink); }
.fx-chip.good { background: #d6f5e8; color: #08694f; }
.fx-chip.bad { background: #ffe0d8; color: #a8301f; }
.fx-chip.cost { background: #e9e4da; color: #4b4136; }
.fx-chip.own { background: var(--teal-glow); color: #fff; }
.fx-chip.meh { background: #f3ead2; color: #6d5420; }
.btn-sign, .btn-seal {
  width: 100%; min-height: 56px; margin-top: 8px; border-radius: 16px; font-weight: 700; font-size: 20px; color: #fff;
  background: linear-gradient(180deg, #1aa196, var(--teal)); box-shadow: var(--shadow);
  animation: signpulse 1.8s ease-in-out infinite;
}
.btn-seal { background: linear-gradient(180deg, #ff8a6a, var(--coral-deep)); animation: none; }
.btn-sign[disabled] { opacity: 0.45; animation: none; }
@keyframes signpulse { 50% { box-shadow: var(--shadow), 0 0 0 6px rgba(25, 179, 166, 0.3); } }
.dz-choices { display: grid; gap: 8px; }
.dz-choice, .dz-act { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 2px rgba(10, 70, 78, 0.15); min-height: var(--tap); margin-top: 6px; }
.dz-choice:active, .dz-act:active { transform: scale(0.98); }
.dz-choice b, .dz-act b { font-size: 17px; color: var(--teal); }
.dz-act span { display: block; font-size: 16px; color: var(--ink-muted); }
.dz-act span.fx-row { display: flex; }
.dz-choice[disabled], .dz-act[disabled] { opacity: 0.45; }
.dz-stat { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 6px 0; }
.dz-stat span:first-child { min-width: 64px; color: var(--ink-muted); font-weight: 600; }

.overlay.sheet-mode { align-items: flex-end; }

.buy small { font-size: 16px; font-weight: 600; opacity: 0.9; }
.buy.q-cheap { background: #c99428; }

.dz-act.slim { margin-top: 8px; }
.overlay.report-mode .panel { max-width: 520px; }
.report h3 { font-family: var(--font-sans); font-size: 26px; margin: 2px 0 10px; color: var(--ink); letter-spacing: 0; }

/* ---- Portrait / narrow: dossier becomes a bottom sheet when something is selected ---- */
@media (orientation: portrait), (max-width: 899px) {

/* ---- Landscape desk ---- */

/* Last Dividend — seeded PRNG (Mulberry32). Browser + Node. */
(function (root) {
  var LD = root.LD || (root.LD = {});

  function hashString(str) {
    var h = 2166136261 >>> 0;
    var s = String(str);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function normalizeSeed(seed) {
    if (seed == null || seed === "") {
      return (Math.floor(Math.random() * 0xffffffff) >>> 0) || 1;
    }
    if (typeof seed === "number" && isFinite(seed)) {
      return (seed >>> 0) || 1;
    }
    var s = String(seed).trim();
    /* The seed field in the UI is always a string. "1" must equal 1, not a hash. */
    if (/^[0-9]+$/.test(s)) {
      var parsed = parseInt(s, 10);
      if (parsed <= 0xFFFFFFFF) return (parsed >>> 0) || 1;
    }
    return hashString(s) || 1;
  }

  function createRng(seed) {
    var a = normalizeSeed(seed);
    function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    next.state = function () {
      return a;
    };
    next.int = function (n) {
      return Math.floor(next() * n);
    };
    next.pick = function (arr) {
      return arr[next.int(arr.length)];
    };
    next.shuffle = function (arr) {
      var a2 = arr.slice();
      for (var i = a2.length - 1; i > 0; i--) {
        var j = next.int(i + 1);
        var tmp = a2[i];
        a2[i] = a2[j];
        a2[j] = tmp;
      }
      return a2;
    };
    next.fork = function () {
      return createRng(next.int(0xffffffff) || 1);
    };
    return next;
  }

  LD.hashString = hashString;
  LD.normalizeSeed = normalizeSeed;
  LD.createRng = createRng;

    module.exports = { hashString: hashString, normalizeSeed: normalizeSeed, createRng: createRng };

    if (payload.collapse) {
      state.collapse = clamp(state.collapse + payload.collapse, 0, LD.MAX_COLLAPSE);
      notes.push((payload.collapse >= 0 ? "+" : "") + payload.collapse + " collapse");
    }
    if (payload.flags) setFlags(state, payload.flags);
    if (payload.special === "divertFilters") {
      if (state.bunker.air.level < 1) {
        state.bunker.air.level = 1;
        state.bunker.air.quality = "cheap";
        notes.push("Air L1 installed (discount crates)");
      } else {
        state.cash += 12;
        notes.push("+12 cash (shipment resold)");
      }
    }
    if (payload.grantSystem) {
      grantSystem(state, payload.grantSystem, notes);
    }
    return notes;
  }

  function grantSystem(state, grant, notes) {
    var sys = state.bunker[grant.id];
    if (!sys) return;
    if (sys.level < grant.level) {
      sys.level = grant.level;
      sys.quality = grant.quality || sys.quality;
      notes.push(grant.id + " raised to L" + grant.level + (grant.quality === "cheap" ? " (cheap)" : ""));
    } else if (grant.quality === "sound" && sys.quality === "cheap") {
      sys.quality = "sound";
      notes.push(grant.id + " recertified sound");
    } else {
      state.cash += 8;
      notes.push("Redundant " + grant.id + " component sold, +8 cash");
    }
  }

  function scheduleDelay(state, delay, sourceTitle) {
    if (!delay) return null;
    var exec = execById(state.executiveId);
    var bonus = delay.noBonus ? 0 : ((exec.perks && exec.perks.delayBonus) || 0);
    var due = state.turn + delay.turns + bonus;
    var delayedCash = delay.cash || 0;
    if (delayedCash > 0) delayedCash = dealCashAmount(state, delayedCash);
    var item = {
      due: due,
      source: sourceTitle,
      unrest: delay.unrest || 0,
      collapse: delay.collapse || 0,
      cash: delayedCash,
      log: delay.log || (sourceTitle + " comes due."),
      flags: delay.flags || null,
      grantSystem: delay.grantSystem || null,
      effectsIf: delay.effectsIf || null,
      strain: delay.strain || null,
      ease: delay.ease || null,
      install: delay.install || null
    };
    state.pending.push(item);
    return item;
  }

  function resolveChoiceDeal(deal, choiceId) {
    if (!deal.choices) return null;
    for (var i = 0; i < deal.choices.length; i++) {
      if (deal.choices[i].id === choiceId) return deal.choices[i];
    }
    return null;
  }

  function selectDeal(state, dealId, choiceId) {
    state = deepClone(state);
    if (state.ended) return { ok: false, error: "Run already ended.", state: state };
    if (state.phase !== "deal") return { ok: false, error: "Deal already chosen this quarter.", state: state };
    if (state.dealPickedThisTurn) return { ok: false, error: "Deal already chosen this quarter.", state: state };
    if (state.ap < LD.DEAL_AP) return { ok: false, error: "No action points remain.", state: state };
    if (state.offered.indexOf(dealId) === -1) return { ok: false, error: "That deal is not on offer.", state: state };

    var deal = dealById(dealId);
    if (!deal) return { ok: false, error: "Unknown deal.", state: state };

    var payload = deal;
    if (deal.choices) {
      var choice = resolveChoiceDeal(deal, choiceId);
      if (!choice) return { ok: false, error: "Choose a response to this crisis.", state: state, needChoice: true, deal: deal };
      payload = choice;
    }

    var cost = payload.cost || 0;
    if (cost && state.cash < cost) {
      return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };
    }

    var notes = applyImmediate(state, payload.immediate, []);
    if (payload.delay) scheduleDelay(state, payload.delay, deal.title);
    var supply = defaultSupply(deal, payload);
    if (supply.ease) applyGridMap(state, supply.ease, -1, notes);
    if (supply.strain) {
      var execS = execById(state.executiveId);
      var bonusS = (execS.perks && execS.perks.delayBonus) || 0;
      scheduleDelay(state, {
        turns: 0 + bonusS,
        strain: supply.strain,
        log: "Public networks you still buy from have tightened."
      }, deal.title);
      Object.keys(supply.strain).forEach(function (g) {
        var next = Math.min(LD.GRID_DISRUPTED, gridLevel(state, g) + supply.strain[g]);
        notes.push(g + " supply will be " + gridLabel(next) + " at close");
      });
    }
    var regionEffect = LD.worldOnDeal ? LD.worldOnDeal(state, deal, choiceId, notes) : null;
    if (deal.unique || deal.isCrisis) {
      if (state.usedUnique.indexOf(deal.id) === -1) state.usedUnique.push(deal.id);
    }

    state.ap -= LD.DEAL_AP;
    state.dealPickedThisTurn = true;
    state.lastDealId = deal.id;
    state.phase = "bunker";
    state.recentDealIds = state.recentDealIds.concat([deal.id]).slice(-6);
    var line = deal.title;
    if (payload.label) line += " — " + payload.label;
    if (notes.length) line += " (" + notes.join(", ") + ")";
    if (payload.delay) {
      var exec = execById(state.executiveId);
      var bonus = (exec.perks && exec.perks.delayBonus) || 0;
      line += ". Due Q" + (state.turn + payload.delay.turns + bonus) + ".";
    }
    pushLog(state, line);
    return { ok: true, state: state, notes: notes, region: regionEffect };
  }

  function upgradeCost(state, systemId, level, quality) {
    var table = LD.UPGRADES[systemId];
    if (!table) return null;
    var row = null;
    for (var i = 0; i < table.length; i++) {
      if (table[i].level === level) row = table[i];
    }
    if (!row) return null;
    var cost = quality === "cheap" ? row.cheap : row.sound;
    var exec = execById(state.executiveId);
    var perks = exec.perks || {};
    if (systemId === "water" && perks.waterUpgradeDiscount) cost -= perks.waterUpgradeDiscount;
    if (systemId === "power" && perks.powerUpgradeDiscount) cost -= perks.powerUpgradeDiscount;
    if (systemId === "food" && hasFlag(state, "seedVault")) cost -= 6;
    if (systemId === "food" && level === 2 && hasFlag(state, "farmLand")) cost -= 6;
    if (systemId === "power" && level === 2 && hasFlag(state, "solarWriteoff")) cost -= 8;
    if (!state.converting) {
      var gl = gridLevel(state, systemId);
      if (gl >= LD.GRID_DISRUPTED) cost += LD.DISRUPT_SURCHARGE;
      else if (gl >= LD.GRID_STRAINED) cost += LD.STRAIN_SURCHARGE;
    }
    if (state.bunker.water.level >= 2 && systemId === "food" && level === 2) cost -= 6;
    if (state.bunker.power.level >= 2 && (systemId === "air" || systemId === "water") && level === 2) cost -= 4;
    if (hasFlag(state, "freightCharter")) {
      cost = Math.floor(cost * 0.7);
    }
    return Math.max(4, cost);
  }

  function availableUpgrades(state) {
    var list = [];
    LD.SYSTEMS.forEach(function (sys) {
      var cur = state.bunker[sys.id];
      var nextLevel = cur.level + 1;
      if (nextLevel > 3) return;
      var table = LD.UPGRADES[sys.id];
      var row = table[nextLevel - 1];
      var inbound = pendingInstallFor(state, sys.id);
      var soundQ = shipmentQuote(state, sys.id, "sound");
      var cheapQ = shipmentQuote(state, sys.id, "cheap");
      var soundCost = soundQ ? soundQ.cost : upgradeCost(state, sys.id, nextLevel, "sound");
      var cheapCost = cheapQ ? cheapQ.cost : upgradeCost(state, sys.id, nextLevel, "cheap");
      list.push({
        systemId: sys.id,
        systemName: sys.name,
        level: nextLevel,
        name: row.name,
        soundCost: soundCost,
        cheapCost: cheapCost,
        canSound: !inbound && state.cash >= soundCost,
        canCheap: !inbound && state.cash >= cheapCost,
        delay: soundQ ? soundQ.delay : 0,
        surcharge: soundQ ? soundQ.surcharge : 0,
        gridLabel: soundQ ? soundQ.gridLabel : "clear",
        inbound: inbound
      });
    });
    return list;
  }

  function engineerCost(state) {
    var c = LD.ENGINEER_COST;
    if (hasFlag(state, "poachedTalent")) c -= 10;
    return Math.max(8, c);
  }

  function canHireEngineer(state) {
    return !state.engineer && state.cash >= engineerCost(state);
  }

  function bunkerGuard(state) {
    if (state.ended) return "Run already ended.";
    if (state.phase !== "bunker") return "Choose a deal first.";
    if (state.bunkerActedThisTurn) return "Bunker action already taken this quarter.";
    if (state.ap < LD.BUNKER_AP) return "No action points remain.";
    return null;
  }

  function buyUpgrade(state, systemId, quality) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (quality !== "sound" && quality !== "cheap") {
      return { ok: false, error: "Choose sound or discount contractors.", state: state };
    }
    var cur = state.bunker[systemId];
    if (!cur) return { ok: false, error: "Unknown system.", state: state };
    if (cur.level >= 3) return { ok: false, error: "That system is already at maximum.", state: state };
    var nextLevel = cur.level + 1;
    var cost = upgradeCost(state, systemId, nextLevel, quality);
    if (state.cash < cost) return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };

    if (hasFlag(state, "skilledCrew")) {
      quality = "sound";
      delete state.flags.skilledCrew;
    }
    if (hasFlag(state, "freightCharter")) {
      delete state.flags.freightCharter;
    }

    if (pendingInstallFor(state, systemId)) {
      return { ok: false, error: "A shipment for that system is already in transit.", state: state };
    }
    var quote = shipmentQuote(state, systemId, quality);
    state.cash -= cost;
    var row = LD.UPGRADES[systemId][nextLevel - 1];
    if (quote && quote.delay > 0) {
      scheduleDelay(state, {
        turns: quote.delay,
        noBonus: true,
        install: { id: systemId, level: nextLevel, quality: quality },
        log: "Private-shelter shipment arrived: " + row.name + "."
      }, row.name);
      state.ap -= LD.BUNKER_AP;
      state.bunkerActedThisTurn = true;
      state.lastBunkerAction = "upgrade:" + systemId + ":L" + nextLevel + ":" + quality + ":delayed";
      pushLog(state, "Paid " + cost + " for " + row.name + " (" + systemId + " L" + nextLevel + ", " + quality + "). Public " + systemId + " is disrupted — arrives Q" + (state.turn + quote.delay) + ".");
      return { ok: true, state: state, cost: cost, delayed: true, due: state.turn + quote.delay };
    }
    cur.level = nextLevel;
    if (quality === "cheap") {
      cur.quality = "cheap";
    } else if (nextLevel >= 3) {
      cur.quality = "sound";
    }
    /* L3 sound remediates; L1/L2 sound does not wash out a prior cheap mark unless L3. */
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    state.lastBunkerAction = "upgrade:" + systemId + ":L" + nextLevel + ":" + quality;
    pushLog(state, "Installed " + row.name + " (" + systemId + " L" + nextLevel + ", " + quality + ") for " + cost + ".");
    return { ok: true, state: state, cost: cost, delayed: false };
  }

  function hireEngineer(state) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (state.engineer) return { ok: false, error: "A chief engineer is already retained.", state: state };
    var cost = engineerCost(state);
    if (state.cash < cost) return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };
    state.cash -= cost;
    state.engineer = true;
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    state.lastBunkerAction = "engineer";
    pushLog(state, "Retained a chief engineer for " + cost + ".");
    return { ok: true, state: state, cost: cost };
  }

  function canBeginConversion(state) {
    return !state.ended && state.phase === "bunker" && !state.bunkerActedThisTurn && !state.converting && state.ap >= LD.BUNKER_AP;
  }

  function beginConversion(state, systemId, quality) {
    state = deepClone(state);
    var err = bunkerGuard(state);
    if (err) return { ok: false, error: err, state: state };
    if (state.converting) return { ok: false, error: "You have already converted to private supply.", state: state };
    if (systemId && quality !== "sound" && quality !== "cheap") {
      return { ok: false, error: "Choose sound or discount contractors.", state: state };
    }
    var cost = 0;
    var secured = null;
    if (systemId) {
      var curCheck = state.bunker[systemId];
      if (!curCheck) return { ok: false, error: "Unknown system.", state: state };
      if (curCheck.level >= 3) return { ok: false, error: "That system is already at maximum.", state: state };
      if (pendingInstallFor(state, systemId)) {
        return { ok: false, error: "A shipment for that system is already in transit.", state: state };
      }
      var priced = deepClone(state);
      priced.converting = true;
      if (hasFlag(priced, "skilledCrew")) quality = "sound";
      var nextCheck = curCheck.level + 1;
      cost = upgradeCost(priced, systemId, nextCheck, quality);
      if (state.cash < cost) return { ok: false, error: "Not enough cash (" + cost + " required).", state: state };
    }
    state.converting = true;
    if (systemId) {
      if (hasFlag(state, "skilledCrew")) {
        quality = "sound";
        delete state.flags.skilledCrew;
      }
      if (hasFlag(state, "freightCharter")) {
        delete state.flags.freightCharter;
      }
      var cur = state.bunker[systemId];
      var nextLevel = cur.level + 1;
      cost = upgradeCost(state, systemId, nextLevel, quality);
      state.cash -= cost;
      cur.level = nextLevel;
      if (quality === "cheap") cur.quality = "cheap";
      else if (nextLevel >= 3) cur.quality = "sound";
      secured = { systemId: systemId, level: nextLevel, quality: quality, name: LD.UPGRADES[systemId][nextLevel - 1].name };
      state.lastBunkerAction = "convert:" + systemId + ":L" + nextLevel + ":" + quality;
    } else {
      state.lastBunkerAction = "convert";
    }
    state.ap -= LD.BUNKER_AP;
    state.bunkerActedThisTurn = true;
    pushLog(state, "Converted to private supply. Further deals pay " + Math.round(LD.CONVERSION_CASH_RATE * 100) + "% cash. Installs ignore public-network damage and arrive this quarter.");
    if (secured) {
      pushLog(state, "Secured " + secured.name + " (" + secured.systemId + " L" + secured.level + ", " + secured.quality + ") for " + cost + ".");
    }
    return { ok: true, state: state, cost: cost, secured: secured };
  }

  function systemReliable(state, systemId) {
    var sys = state.bunker[systemId];
    if (!sys || sys.level < LD.WIN_LEVEL) return false;
    if (sys.quality === "sound") return true;
    if (sys.level >= 3) return true;
    if (state.engineer) return true;
    return false;
  }

  function evacuationResult(state) {
    var missing = [];
    var unreliable = [];
    LD.SYSTEMS.forEach(function (s) {
      var sys = state.bunker[s.id];
      if (sys.level < LD.WIN_LEVEL) missing.push(s.name);
      else if (!systemReliable(state, s.id)) unreliable.push(s.name);
    });
    if (missing.length) {
      return {
        kind: "lose",
        reason: "unfinished",
        title: "An unfinished hole in the ground",
        body: "The doors can close. They should not. Incomplete systems: " + missing.join(", ") + "."
      };
    }
    if (unreliable.length) {
      return {
        kind: "lose",
        reason: "failed-systems",
        title: "The cheapest filters failed first",
        body: "You sealed on time. The bargain work did not hold. Failed systems: " + unreliable.join(", ") + ". A chief engineer, or level-3 redundancy, would have carried them."
      };
    }
    var flavor = [];
    if (hasFlag(state, "clinicSold")) flavor.push("There is no surgeon. You did sell the clinic lot.");
    if (hasFlag(state, "blackoutContracts")) flavor.push("The generator is yours. The grid you priced in the dark is not coming back.");
    if (state.collapse < 70 && state.cash >= 20) flavor.push("You left money on the table. The street would have taken it anyway.");
    if (state.converting) flavor.push("You converted to a private supply chain before the public one finished failing.");
    else if ((state.grids && (state.grids.water + state.grids.power + state.grids.air + state.grids.food)) >= 3) {
      flavor.push("The municipal contracts you sold are not coming back. Your private ones did.");
    }
    var body = "Air, water, power, and food all hold. The last dividend is silence.";
    if (flavor.length) body += " " + flavor.join(" ");
    return {
      kind: "win",
      reason: "evacuated",
      title: "The doors close on time",
      body: body
    };
  }

  function applyPendingDue(state) {
    var fired = [];
    var keep = [];
    state.pending.forEach(function (item) {
      if (item.due > state.turn || item.install) {
        keep.push(item);
        return;
      }
      var notes = [];
      var unrest = item.unrest || 0;
      var collapse = item.collapse || 0;
      var cash = item.cash || 0;
      if (item.effectsIf) {
        var cond = item.effectsIf;
        var apply = true;
        if (cond.unlessFlag && hasFlag(state, cond.unlessFlag)) apply = false;
        if (cond.ifFlag && !hasFlag(state, cond.ifFlag)) apply = false;
        if (apply) {
          unrest += cond.unrest || 0;
          collapse += cond.collapse || 0;
          cash += cond.cash || 0;
        }
      }
      var exec = execById(state.executiveId);
      if (collapse > 0 && exec.perks && exec.perks.foodCollapseRelief && item.grantSystem == null) {
        /* Imani only relieves collapse on food-tagged delayed pain if we stored it; keep simple: small relief always on delayed collapse. */
      }
      if (unrest) {
        state.unrest = clamp(state.unrest + unrest, 0, LD.MAX_UNREST);
        notes.push((unrest >= 0 ? "+" : "") + unrest + " unrest");
      }
      if (collapse) {
        state.collapse = clamp(state.collapse + collapse, 0, LD.MAX_COLLAPSE);
        notes.push((collapse >= 0 ? "+" : "") + collapse + " collapse");
      }
      if (cash) {
        state.cash = Math.max(0, state.cash + cash);
        notes.push((cash >= 0 ? "+" : "") + cash + " cash");
      }
      if (item.flags) setFlags(state, item.flags);
      if (item.grantSystem) grantSystem(state, item.grantSystem, notes);
      if (item.strain) applyGridMap(state, item.strain, 1, notes);
      if (item.ease) applyGridMap(state, item.ease, -1, notes);
      var line = item.log + (notes.length ? " (" + notes.join(", ") + ")" : "");
      pushLog(state, line);
      fired.push({ text: line, source: item.source });
    });
    state.pending = keep;
    return fired;
  }

  function collapseTickAmount(state) {
    var tick = LD.BASE_COLLAPSE_TICK;
    if (hasFlag(state, "softQuarter")) {
      tick -= 2;
      delete state.flags.softQuarter;
    }
    var exec = execById(state.executiveId);
    if (exec.perks && exec.perks.foodCollapseRelief) tick -= exec.perks.foodCollapseRelief;
    return Math.max(1, tick);
  }

  function forecastQuarters(state) {
    var tick = LD.BASE_COLLAPSE_TICK;
    var exec = execById(state.executiveId);
    if (exec.perks && exec.perks.foodCollapseRelief) tick -= exec.perks.foodCollapseRelief;
    if (hasFlag(state, "softQuarter")) tick = Math.max(1, tick - 2);
    var remain = LD.MAX_COLLAPSE - state.collapse;
    if (remain <= 0) return 0;
    return Math.ceil(remain / Math.max(1, tick));
  }

  function maybeEnd(state) {
    if (state.ended) return;
    if (state.unrest >= LD.MAX_UNREST) {
      state.ended = true;
      state.ending = {
        kind: "lose",
        reason: "unrest",
        title: "The street is in the lobby",
        body: "The board is still in session. You do not reach the car."
      };
      state.phase = "ended";
      pushLog(state, "Run ends: unrest reached " + LD.MAX_UNREST + ".");
      return;
    }
    if (state.collapse >= LD.MAX_COLLAPSE) {
      var result = evacuationResult(state);
      if (result.kind === "win") {
        result.title = "The sirens started during the ribbon-cutting";
        result.body = "Collapse reached the door. Your bunker held. " + result.body;
      } else if (result.reason === "unfinished") {
        result.title = "The countdown expired in an unfinished room";
        result.body = "Collapse reached 100 before the bunker was ready. " + result.body;
      } else {
        result.title = "The doors closed on bargain work";
        result.body = "Collapse forced an evacuation. " + result.body;
      }
      state.ended = true;
      state.ending = result;
      state.phase = "ended";
      pushLog(state, "Run ends: collapse reached " + LD.MAX_COLLAPSE + " — " + result.kind + ".");
    }
  }

  function applyIncomingInstalls(state) {
    var fired = [];
    var keep = [];
    state.pending.forEach(function (item) {
      if (!item.install || item.due > state.turn) {
        keep.push(item);
        return;
      }
      var notes = [];
      grantSystem(state, item.install, notes);
      var text = item.log || (item.source + " arrives.");
      if (notes.length) text += " " + notes.join(", ") + ".";
      pushLog(state, text);
      fired.push({ source: item.source, text: text, item: item });
    });
    state.pending = keep;
    return fired;
  }

  function closeQuarter(state) {
    state = deepClone(state);
    if (state.ended) return { ok: false, error: "Run already ended.", state: state };
    if (state.phase === "deal" || !state.dealPickedThisTurn) {
      return { ok: false, error: "Choose a deal before closing the quarter.", state: state };
    }
    var fired = applyPendingDue(state);
    var worldEvents = LD.resolveWorldQuarter ? LD.resolveWorldQuarter(state) : [];
    worldEvents.forEach(function (ev) { fired.push({ text: ev.text, source: "map", world: ev }); });
    maybeEnd(state);
    if (state.ended) return { ok: true, state: state, fired: fired, ended: true, world: worldEvents };

    var tick = collapseTickAmount(state);
    state.collapse = clamp(state.collapse + tick, 0, LD.MAX_COLLAPSE);
    pushLog(state, "Quarter closes. Collapse drifts +" + tick + ".");
    maybeEnd(state);
    if (state.ended) return { ok: true, state: state, fired: fired, ended: true, tick: tick, world: worldEvents };

    state.turn += 1;
    state.phase = "deal";
    state.ap = LD.AP_PER_TURN;
    state.dealPickedThisTurn = false;
    state.bunkerActedThisTurn = false;
    state.lastDealId = null;
    state.lastBunkerAction = null;
    var rng = rngFrom(state);
    offerDeals(state, rng);
    state.rngState = rng.state();
    if (LD.worldAfterClose) LD.worldAfterClose(state);
    var arrivals = applyIncomingInstalls(state);
    if (arrivals.length) fired = fired.concat(arrivals);
    pushLog(state, "Q" + state.turn + " opens.");
    return { ok: true, state: state, fired: fired, ended: false, tick: tick, world: worldEvents };
  }

  function attemptEvacuation(state) {
    state = deepClone(state);
    if (state.ended) return { ok: false, error: "Run already ended.", state: state };
    if (state.phase !== "bunker") return { ok: false, error: "Choose a deal first.", state: state };
    if (state.turn < LD.MIN_EVAC_TURN) {
      return { ok: false, error: "The bunker cannot be sealed before quarter " + LD.MIN_EVAC_TURN + ".", state: state };
    }
    var result = evacuationResult(state);
    state.ended = true;
    state.ending = result;
    state.phase = "ended";
    pushLog(state, "You seal the bunker. " + result.title);
    return { ok: true, state: state, ending: result };
  }

  function canEvacuate(state) {
    return !state.ended && state.phase === "bunker" && state.turn >= LD.MIN_EVAC_TURN;
  }

  function restart(state, opts) {
    opts = opts || {};
    return createRun({
      seed: opts.seed != null ? opts.seed : (Date.now() >>> 0),
      executiveId: opts.executiveId || (state && state.executiveId) || "mara"
    });
  }

  function snapshot(state) {

  <script>
/* Last Dividend — pure render helpers. Browser + Node. No DOM writes. */
(function (root) {
  var LD = root.LD || (root.LD = {});

  var DISCOUNT_RULE =
    "You can seal from quarter 5. A working bunker needs all four systems at Lv 2 or higher, and those systems must hold. Sound contractors cost more and will hold. Discount contractors are cheaper, but a discount system at Lv 2 will fail at evacuation unless you have hired a chief engineer or raised that system to Lv 3.";

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function assetUrl(name) {
    if (LD.ASSETS && LD.ASSETS[name]) return LD.ASSETS[name];
    return "assets/" + name + ".webp";
  }

  function dealArtKey(dealId) {
    if (LD.DEAL_ART && LD.DEAL_ART[dealId]) return LD.DEAL_ART[dealId];
    return null;
  }

  function systemStatus(state, systemId) {
    var sys = state.bunker[systemId];
    if (!sys || sys.level <= 0) return "empty";
    if (sys.level < LD.WIN_LEVEL) return "incomplete";
    if (LD.systemReliable(state, systemId)) return "ready";
    return "risk";
  }

  function installedName(systemId, level) {
    if (!level) return "";
    var table = LD.UPGRADES[systemId];
    return table && table[level - 1] ? table[level - 1].name : "";
  }

  function qualityLabel(q) {
    return q === "cheap" ? "discount" : "sound";
  }

  function inboundFor(state, systemId) {
    return LD.pendingInstallFor ? LD.pendingInstallFor(state, systemId) : null;
  }

  function systemDetail(state, systemId, compact) {
    var sys = state.bunker[systemId];
    var status = systemStatus(state, systemId);
    var inbound = inboundFor(state, systemId);
    if (inbound && inbound.install) {
      var due = inbound.due;
      if (compact) return "arrives Q" + due;
      return "shipment in transit · arrives Q" + due + " · will not count if you seal first";
    }
    if (status === "empty") return "Not installed";
    var name = installedName(systemId, sys.level);
    var q = qualityLabel(sys.quality);
    if (compact) {
      if (status === "ready") return (name ? name + " · " : "") + q;
      if (status === "risk") return q + " · at risk";
      return (name ? name + " · " : "") + q;
    }
    if (status === "ready") return name + " · " + q + " · will hold";
    if (status === "risk") return name + " · " + q + " · at risk (hire an engineer or raise to Lv 3)";
    return name + " · " + q + " · not ready (need Lv 2)";
  }

  function readinessSummary(state) {
    var lines = [];
    var ready = 0, risk = 0, incomplete = 0, empty = 0;
    LD.SYSTEMS.forEach(function (s) {
      var st = systemStatus(state, s.id);
      var sys = state.bunker[s.id];
      if (st === "ready") ready += 1;
      else if (st === "risk") risk += 1;
      else if (st === "incomplete") incomplete += 1;
      else empty += 1;
      lines.push({
        id: s.id,
        name: s.name,
        level: sys.level,
        status: st,
        text: s.name + " — Lv " + sys.level + " · " + systemDetail(state, s.id, false)
      });
    });
    var missing = incomplete + empty;
    return {
      ready: ready,
      risk: risk,
      incomplete: incomplete,
      empty: empty,
      missing: missing,
      canWin: ready === 4 && risk === 0 && missing === 0,
      sealAvailable: state.turn >= LD.MIN_EVAC_TURN && state.phase === "bunker" && !state.ended,
      engineer: !!state.engineer,
      lines: lines,
      tally: "Ready " + ready + " of 4" +
        (missing ? " · " + missing + " incomplete" : "") +
        (risk ? " · " + risk + " at risk" : "") +
        (state.engineer ? " · chief engineer retained" : ""),
      rule: DISCOUNT_RULE
    };
  }

  function barPct(n, max) {
    return Math.max(0, Math.min(100, Math.round((n / max) * 100)));
  }

  function renderChrome(state) {
    var exec = LD.execById(state.executiveId);
    var html = '<div class="chrome">';
    html += "<div><div class='kicker'>" + escapeHtml(exec.firm) + "</div>";
    html += "<h2>" + escapeHtml(exec.name) + "</h2>";
    html += "<div class='who'>" + escapeHtml(exec.title) + " · seed " + escapeHtml(String(state.seedLabel)) + "</div></div>";
    html += "<div class='q-badge' aria-label='Quarter " + state.turn + "'>Q" + state.turn + "</div></div>";

    html += '<div class="stats">';
    html += statBox("cash", "Cash", state.cash, 100);
    html += statBox("unrest", "Unrest", state.unrest, LD.MAX_UNREST);
    html += statBox("collapse", "Collapse", state.collapse, LD.MAX_COLLAPSE);
    html += "</div>";
    var fc = LD.forecastQuarters(state);
    html += '<p class="forecast">At the current drift, breach in about ' + fc + " quarter" + (fc === 1 ? "" : "s") + ". Delayed deals are not included in this estimate.</p>";
    return html;
  }

  function statBox(cls, label, val, max) {
    var h = '<div class="stat ' + cls + '"><div class="lbl">' + label + '</div><div class="val">' + val + "</div>";
    h += '<div class="bar" aria-hidden="true"><span style="width:' + barPct(val, max) + '%"></span></div></div>';
    return h;
  }

  function renderChips(state) {
    var html = '<div class="chips" aria-label="Bunker systems">';
    LD.SYSTEMS.forEach(function (s) {
      var st = systemStatus(state, s.id);
      var sys = state.bunker[s.id];
      var installed = sys.level > 0;
      html += '<div class="chip ' + st + '"><div class="nm' + (installed ? " accent" : "") + '">' + escapeHtml(s.name) + "</div>";
      html += '<div class="lv">Lv ' + sys.level + "</div>";
      html += '<div class="q">' + escapeHtml(systemDetail(state, s.id, true)) + "</div></div>";
    });
    html += "</div>";
    return html;
  }

  function renderPending(state) {
    if (!state.pending || !state.pending.length) return "";
    var parts = state.pending.map(function (p) {
      var bits = [escapeHtml(p.source) + " due Q" + p.due];
      if (p.install) bits.push("shipment for " + p.install.id + " L" + p.install.level);
      if (p.strain) {
        Object.keys(p.strain).forEach(function (g) {
          bits.push(g + " network tightens");
        });
      }
      return bits.join(" — ");
    });
    return '<div class="pending"><strong>Still outstanding.</strong> ' + parts.join(" · ") + "</div>";
  }

  function renderContracts(state) {
    if (LD.ensureSupply) LD.ensureSupply(state);
    var html = '<section class="contracts" aria-label="Public supply contracts">';
    html += '<div class="kicker">Public networks you still buy from</div>';
    if (state.converting) {
      html += '<p class="convert-banner">Private supply conversion is active. Further deals pay 60% cash. Installs ignore network damage and arrive this quarter.</p>';
    }
    html += '<div class="contract-grid">';
    LD.SYSTEMS.forEach(function (s) {
      var level = LD.gridLevel ? LD.gridLevel(state, s.id) : 0;
      var label = LD.gridLabel ? LD.gridLabel(level) : "clear";
      var inbound = inboundFor(state, s.id);
      var coming = "";
      (state.pending || []).forEach(function (item) {
        if (item.strain && item.strain[s.id]) coming = "tightens Q" + item.due;
        if (item.ease && item.ease[s.id]) coming = "eases Q" + item.due;
      });
      html += '<div class="contract ' + label + '"><div class="nm">' + escapeHtml(s.name) + "</div>";
      html += '<div class="lv">' + escapeHtml(label) + "</div>";
      if (coming) html += '<div class="q">' + escapeHtml(coming) + "</div>";
      else if (inbound) html += '<div class="q">shipment Q' + inbound.due + "</div>";
      else if (level >= 2) html += '<div class="q">+14 and delayed</div>';
      else if (level >= 1) html += '<div class="q">+8 to install</div>';
      else html += '<div class="q">clear rate</div>';
      html += "</div>";
    });
    html += "</div></section>";
    return html;
  }

  function dealExtraHint(state, deal) {
    var bits = [];
    if (state.converting && deal.immediate && deal.immediate.cash > 0 && LD.dealCashAmount) {
      bits.push("Pays " + LD.dealCashAmount(state, deal.immediate.cash) + " after conversion (60%).");
    }
    if (deal.choices) {
      bits.push("A choice here can ease or strain a public network at close.");
    } else if (LD.defaultSupply) {
      var supply = LD.defaultSupply(deal, deal);
      if (supply.strain) {
        Object.keys(supply.strain).forEach(function (g) {
          var next = Math.min(LD.GRID_DISRUPTED, (LD.gridLevel(state, g) || 0) + supply.strain[g]);
          bits.push(g + " supply will be " + LD.gridLabel(next) + " at close.");
        });
      }
      if (supply.ease) {
        Object.keys(supply.ease).forEach(function (g) {
          bits.push("eases the " + g + " network now.");
        });
      }
    }
    return bits.join(" ");
  }

  function conversionSecureCost(state, systemId, quality) {
    var clone = LD.deepClone(state);
    clone.converting = true;
    return LD.upgradeCost(clone, systemId, clone.bunker[systemId].level + 1, quality);
  }

  function renderLog(state) {
    var html = '<div class="log"><div class="kicker">Ledger</div><ul>';
    (state.log || []).slice(0, 5).forEach(function (l) {
      html += "<li>Q" + l.turn + " — " + escapeHtml(l.text) + "</li>";
    });
    html += "</ul></div>";
    return html;
  }

  function renderPlayNav() {
